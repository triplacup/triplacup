// REM: Peliparien tunnistus liitetystä sotkuisesta tekstistä - ohjelman tekijä: Johannes Ketola
// "TUO PELIPARIT" -toiminnon ydin: käyttäjä liittää esim. tulospalvelun tai
// striimin raakatekstiä ("Game. Jf 7ccv Vertti Lehtovuori v64 Pertti Paaki
// jhokkn 6555 Viljo Kirstilä j76 Toivo Kallio ..."), jossa oikeiden
// pelaajien nimet ovat sekaisin merkityksettömien numero/kirjainroskien
// joukossa. Ainoat oikeat nimet tekstissä ovat AINA turnaukseen
// osallistuvia pelaajia (käyttäjän oma vahvistama sääntö), joten tämä ei
// yritä tunnistaa nimiä yleisesti (mikä olisi epäluotettavaa) - se etsii
// tekstistä pelkästään turnauksen OMAN pelaajalistan nimiä, sanajono
// kerrallaan täsmällisesti, ja ohittaa kaiken muun roskana.
//
// Toimintaperiaate: pilkotaan liitetty teksti välilyönneistä sanoiksi,
// siivotaan jokaisesta sanasta reunimmaiset välimerkit (jotta esim.
// "Kallio." tai "Lehtovuori," tunnistuvat oikein), ja käydään sanat
// järjestyksessä läpi. Jokaisessa kohdassa kokeillaan täsmääkö sen
// hetkinen sana (tai usean peräkkäisen sanan jono, koska nimet ovat usein
// kaksisanaisia "Etunimi Sukunimi") jonkun pelaajan koko nimeen TÄSMÄLLEEN
// - pidemmät (useampisanaiset) nimet tarkistetaan ensin, jotta lyhyempi
// nimi ei voi vahingossa "napata" vain osan pidemmästä. Kun täsmäys
// löytyy, koko täsmännyt sanajono ohitetaan ja jatketaan sen jälkeen;
// jos mikään ei täsmää, yksi sana ohitetaan roskana ja jatketaan. Löydetyt
// pelaajat kerätään SIINÄ JÄRJESTYKSESSÄ kuin ne tekstissä esiintyvät, ja
// tämän jälkeen ne parillistetaan peräkkäin (1.+2., 3.+4., jne.) - tämä
// funktio ei itse lisää mitään jonoon eikä koske pelimoottoriin millään
// tavalla, se vain palauttaa järjestetyn listan pelaajaobjekteja.
// Reunimmaisten välimerkkien (piste, pilkku, huutomerkki, sulkeet, lainausmerkit
// jne.) siivous - EI numeroita, jotta esim. pelkkä numerosana ei koskaan
// siisti tyhjäksi merkkijonoksi (mikä saisi kaksi eri, muuten erilaista
// nimeä näyttämään väärin samalta täsmäytyksessä). Sisäiset väliviivat ja
// heittomerkit (esim. "Veli-Pekka", "O'Brien") säilyvät koskemattomina,
// koska niitä ei koskaan poisteta reunoilta - vain aidot välimerkit.
function normalizePasteToken(tok) {
  return tok.replace(/^[\p{P}\p{S}]+|[\p{P}\p{S}]+$/gu, "").toLocaleLowerCase("fi-FI");
}
function findPlayersInPastedText(text, playersIn) {
  const tokens = (text || "").split(/\s+/).filter(Boolean);
  const normTokens = tokens.map(normalizePasteToken);

  const byLength = new Map();
  // KORJAUS (nimijärjestys): ohjelmaan tallennettu nimi on "Etunimi Sukunimi",
  // mutta tulospalvelut antavat usein "Sukunimi Etunimi" (esim. "Sirkiä Elmo").
  // Siksi jokaiselle nimelle tunnistetaan myös versio, jossa VIIMEINEN sana
  // (sukunimi) on ensin. Täsmälleen oikea järjestys ("Etunimi Sukunimi") käy
  // aina ensin, joten vanha muoto toimii täsmälleen kuten ennen.
  const byLengthRot = new Map();
  (playersIn || []).forEach((p) => {
    if (p.withdrawn) return; // keskeyttänyt ei voi enää olla mukana uudessa parissa
    const nameTokens = p.name.split(/\s+/).filter(Boolean).map(normalizePasteToken);
    if (nameTokens.length === 0) return;
    if (!byLength.has(nameTokens.length)) byLength.set(nameTokens.length, []);
    byLength.get(nameTokens.length).push({ player: p, nameTokens });
    if (nameTokens.length >= 2) {
      const rotTokens = [nameTokens[nameTokens.length - 1], ...nameTokens.slice(0, -1)];
      if (!byLengthRot.has(rotTokens.length)) byLengthRot.set(rotTokens.length, []);
      byLengthRot.get(rotTokens.length).push({ player: p, nameTokens: rotTokens });
    }
  });
  const lengthsDesc = [...new Set([...byLength.keys(), ...byLengthRot.keys()])].sort((a, b) => b - a);

  const found = [];
  let i = 0;
  while (i < normTokens.length) {
    let matchedPlayer = null;
    let matchedLen = 0;
    for (const len of lengthsDesc) {
      if (i + len > normTokens.length) continue;
      const slice = normTokens.slice(i, i + len).join("\u0001");
      let hit = (byLength.get(len) || []).find((c) => c.nameTokens.join("\u0001") === slice);
      if (!hit) hit = (byLengthRot.get(len) || []).find((c) => c.nameTokens.join("\u0001") === slice);
      if (hit) { matchedPlayer = hit.player; matchedLen = len; break; }
    }
    if (matchedPlayer) {
      found.push(matchedPlayer);
      i += matchedLen;
    } else {
      i += 1;
    }
  }
  return found;
}

// REM: Peliparien tunnistus riveittäin - ohjelman tekijä: Johannes Ketola
// Tulospalvelun taulukossa jokainen peli on OMALLA RIVILLÄÄN ("1001A  Sirkiä Elmo
// 0 : 0  Vuorenpää Juha 0 : 0  3"), eli yhden rivin kaksi nimeä ovat aina pari.
// Jos jollakin rivillä on vähintään kaksi tunnistettua pelaajaa, paritus tehdään
// RIVIKOHTAISESTI: näin yksi pelaaja, joka ei ole mukana turnauksessa, ei sotke
// kaikkia sen jälkeen tulevia pareja. Muussa tapauksessa (esim. yksi pitkä
// sotkuinen tekstipötkö tai yksi nimi per rivi) toimitaan täsmälleen kuten
// ennen: kaikki tunnistetut nimet peräkkäin ja parit 1.+2., 3.+4., jne.
// Ei koske pelimoottoriin; palauttaa vain pelaajaryhmiä.
function findPlayerGroupsInPastedText(text, playersIn) {
  const lineGroups = (text || "")
    .split(/\r?\n/)
    .map((ln) => findPlayersInPastedText(ln, playersIn))
    .filter((g) => g.length > 0);
  if (lineGroups.some((g) => g.length >= 2)) return { rowMode: true, groups: lineGroups };
  return { rowMode: false, groups: [findPlayersInPastedText(text, playersIn)] };
}

// REM: Onko teksti ihmisen nimi - ohjelman tekijä: Johannes Ketola
// Pelaajalistaa liitettäessä mukaan tulee usein taulukon ympäristöä, esim.
// "Rivejä per sivu", "256", "0 / 0". Ne eivät ole nimiä. Kaksi tarkistusta:
//  1) isPasteJunkText: ei yhtään kirjainta (esim. "0 / 0") TAI kaikki sanat
//     ovat taulukon/sivutuksen apusanoja ("Rivejä per sivu", "Rivejä per",
//     "Rivejä", "Rows per page", "Nimi", "Seura" ...). Tätä käytetään myös
//     tallennetun rekisterin siivoukseen, koska se ei koskaan osu oikeaan nimeen.
//  2) isLikelyPersonName: lisäksi nimessä saa olla vain kirjaimia, välilyöntejä
//     ja merkit  - ' ’ " . ,  (ei numeroita, vinoviivaa, kaksoispistettä tms.).
const PASTE_UI_WORDS = new Set([
  "rivejä", "rivi", "riviä", "rivit", "per", "sivu", "sivua", "sivulla", "sivut", "sivun",
  "rows", "row", "page", "pages", "of", "näytä", "seuraava", "edellinen", "yhteensä",
  "nimi", "seura", "sarja", "pelaaja", "pelaajat", "osallistuja", "osallistujat", "sija",
  "haku", "total", "next", "previous", "name", "club",
]);
function isPasteJunkText(text) {
  const t = String(text || "").trim();
  if (!t) return true;
  if (!/\p{L}/u.test(t)) return true;
  const words = t.split(/\s+/).map((w) => w.replace(/^[\p{P}\p{S}]+|[\p{P}\p{S}]+$/gu, "").toLocaleLowerCase("fi-FI")).filter(Boolean);
  return words.length > 0 && words.every((w) => PASTE_UI_WORDS.has(w));
}
function isLikelyPersonName(text) {
  const t = String(text || "").trim();
  if (isPasteJunkText(t)) return false;
  return /^[\p{L}][\p{L}\p{M}\s.,'’"-]*$/u.test(t);
}

// REM: Osallistujalistan liitetekstin jäsennys - ohjelman tekijä: Johannes Ketola
// Ihmiset liittävät osallistujalistan usein suoraan jostain toisesta
// taulukosta/sivustosta, esim. muodossa:
//   1
//   Reijo Haltola	Kotka DC
//   2
//   Aatos Viitala	SKT Darts
// eli rivinumero omalla rivillään ja nimi+seura samalla rivillä
// sarkaimella (tab) eroteltuna. Tämä poimii JOKAISESTA rivistä pelkän
// ihmisen nimen: rivit jotka ovat pelkkä numero (rivinumerointi) hylätään
// kokonaan, ja nimen perässä sarkaimella tuleva seura/joukkue (tai muu
// sarake) jätetään pois - vain ensimmäinen sarake/osa jää nimeksi. Tukee
// myös tavallista "yksi nimi per rivi" -muotoa muuttumattomana, ja
// tunnistaa saman-rivin "1. Nimi" / "1) Nimi" -numeroinnin.
function extractNameFromPasteLine(rawLine) {
  let line = (rawLine || "").trim();
  if (!line) return "";
  // Pelkkä rivinumero omalla rivillään ("1", "12.", "3)") - ei nimi lainkaan.
  if (/^\d+[.)]?$/.test(line)) return "";
  // Numero+nimi samalla rivillä ("1. Nimi", "1) Nimi", "1\tNimi") - pudotetaan numero-etuliite.
  line = line.replace(/^\d+[.)]\s+/, "").replace(/^\d+\t+/, "");
  // Nimen jälkeen sarkaimella tuleva seura/joukkue tms. lisäsarake - pidetään vain ensimmäinen osa.
  if (line.includes("\t")) line = line.split("\t")[0];
  line = line.trim();
  // Ihmisen nimessä ei koskaan ole alaviivaa "_" (väliviiva "-" on täysin
  // ok, esim. "Veli-Pekka"). Jos liitetystä tekstistä poimittu "nimi"
  // sisältää alaviivan, kyseessä ei ole oikea ihmisen nimi - esim. jokin
  // tekninen tunniste/slug (kuten "how_to_reg") on tarttunut vahingossa
  // mukaan liitettyyn tekstiin - ja se sivuutetaan roskana, aivan kuten
  // pelkkä rivinumerokin jo sivuutetaan yllä.
  if (line.includes("_")) return "";
  // KORJAUS (ei-nimet pois): taulukoiden alatunnisteet ja otsikot ("Rivejä per
  // sivu", "0 / 0", "Nimi", "Seura" ...) eivät ole ihmisen nimiä eikä niitä
  // saa rekisteröidä pelaajiksi.
  return isLikelyPersonName(line) ? line : "";
}

function defaultBoardRestrictionsForName(name) {
  const key = normalizeRosterName(name);
  if (key === normalizeRosterName("Leo Löytänä")) return [5];
  if (key === normalizeRosterName("Vertti Lehtovuori")) return [4]; // oletus: Vertti ei voi heittää taululla 4
  return [];
}

function normalizeBoardRestrictions(value, name = "") {
  const source = Array.isArray(value) ? value : defaultBoardRestrictionsForName(name);
  return [...new Set(source.map(Number).filter((n) => Number.isInteger(n) && n >= 1 && n <= BOARD_COUNT))].sort((a, b) => a - b);
}

// REM: Rekisterin lataus ja tallennus (localStorage) - ohjelman tekijä: Johannes Ketola
function loadSavedRoster() {
  const builtIn = NAMES.map(([name, skill, speed]) => ({ name, skill, speed, boardRestrictions: defaultBoardRestrictionsForName(name) }));
  try {
    const raw = localStorage.getItem(ROSTER_STORAGE_KEY);
    const saved = raw ? JSON.parse(raw) : [];
    const merged = new Map(builtIn.map((p) => [normalizeRosterName(p.name), p]));
    if (Array.isArray(saved)) {
      saved.forEach((p) => {
        if (!p || !p.name) return;
        const playerName = String(p.name).trim();
        if (isPasteJunkText(playerName)) return; // aiemmin vahingossa tallentunut ei-nimi (esim. "Rivejä per sivu")
        merged.set(normalizeRosterName(playerName), {
          name: playerName,
          skill: p.skill == null ? "" : String(p.skill),
          speed: p.speed == null ? "" : String(p.speed),
          boardRestrictions: normalizeBoardRestrictions(p.boardRestrictions, playerName),
        });
      });
    }
    // Kertaluonteinen päivitys: aiemmin tallennetulle Vertille lisätään oletuskielto (taulu 4).
    // Sen jälkeen pelaajakohtainen taulukielto on käyttäjän muokattavissa normaalisti.
    try {
      if (!localStorage.getItem("darts-parittaja-defaults-v22")) {
        const vk = normalizeRosterName("Vertti Lehtovuori");
        const v = merged.get(vk);
        if (v) {
          const set = new Set(normalizeBoardRestrictions(v.boardRestrictions, v.name));
          set.add(4);
          merged.set(vk, { ...v, boardRestrictions: [...set].sort((a, b) => a - b) });
        }
        localStorage.setItem("darts-parittaja-defaults-v22", "1");
        persistRoster([...merged.values()].sort(rosterSort));
      }
    } catch (e2) { /* ei kriittinen */ }
    return tcLevelsOverlay([...merged.values()].sort(rosterSort));
  } catch (e) {
    return builtIn.sort(rosterSort);
  }
}

function persistRoster(roster) {
  try {
    localStorage.setItem(ROSTER_STORAGE_KEY, JSON.stringify(tcLevelsStrip(roster)));
  } catch (e) {
    // Storage can be unavailable in private/embedded browsing contexts.
  }
}

// Full crash-recovery snapshot: everything needed to resume exactly where
// you left off — setup progress OR an active tournament, including every
// board, the queue, and every player's games/opponents/wins — saved after
// every state-changing action so a power loss or accidental tab close
// never loses the tournament. Player Sets (opponents, forbiddenOpponentNames,
// boardRestrictions) aren't JSON-serializable directly, so they're
// converted to arrays going in and rebuilt as Sets coming back out.
const SESSION_STORAGE_KEY = SWISS_SESSION_KEY;

// REM: OFFLINE TURNAUS - ottelujen keskiarvot (koko peli) ja first 9 -keskiarvot.
// Puhtaita apufunktioita, täysin erillään paritusmoottorista.
function statsParse(v) {
  const t = String(v === undefined || v === null ? "" : v).replace(",", ".").trim();
  if (t === "") return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}
function statsFmt(n) {
  return (Math.round(n * 100) / 100).toFixed(2);
}
// Pelaajan KA / E9KA = pelaajan syötettyjen ottelukohtaisten arvojen keskiarvo
// (tyhjät arvot jätetään pois laskusta).
function offlinePlayerAverages(matchLog) {
  const acc = {};
  const add = (id, key, v) => {
    if (v === null || v === undefined || !Number.isFinite(Number(v))) return;
    const a = acc[id] || (acc[id] = { ka: [], e9: [] });
    a[key].push(Number(v));
  };
  (matchLog || []).forEach((m) => {
    const t = m.stats;
    if (!t) return;
    add(m.p1Id, "ka", t.avg1); add(m.p2Id, "ka", t.avg2);
    add(m.p1Id, "e9", t.f91); add(m.p2Id, "e9", t.f92);
  });
  const mean = (arr) => (arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : null);
  const out = {};
  Object.keys(acc).forEach((id) => { out[id] = { ka: mean(acc[id].ka), e9: mean(acc[id].e9) }; });
  return out;
}
function statsBlankDraft() {
  return { avg1: "", avg2: "", f91: "", f92: "" };
}
function statsDraftFromSaved(m) {
  const t = m.stats || {};
  const str = (v) => (v === null || v === undefined ? "" : statsFmt(v));
  return { avg1: str(t.avg1), avg2: str(t.avg2), f91: str(t.f91), f92: str(t.f92) };
}

// Voittojen näyttö: tasapeli = puoli voittoa (1 piste), esim. 2½
function fmtW(w) {
  const n = Number(w) || 0;
  if (Number.isInteger(n)) return String(n);
  const f = Math.floor(n);
  return f === 0 ? "½" : f + "½";
}

// REM: Istunnon tallennus ja palautus (kaatumissuojaus) - ohjelman tekijä: Johannes Ketola
function serializePlayerForSession(p) {
  if (!p) return null;
  return {
    ...p,
    opponents: [...p.opponents],
    forbiddenOpponentNames: [...p.forbiddenOpponentNames],
    boardRestrictions: [...p.boardRestrictions],
  };
}

function deserializePlayerFromSession(obj) {
  if (!obj) return null;
  return {
    ...obj,
    opponents: new Set(obj.opponents || []),
    forbiddenOpponentNames: new Set(obj.forbiddenOpponentNames || []),
    boardRestrictions: new Set(obj.boardRestrictions || []),
  };
}

function serializeBoardForSession(b) {
  return { ...b, p1: serializePlayerForSession(b.p1), p2: serializePlayerForSession(b.p2) };
}

function deserializeBoardFromSession(obj) {
  return { ...obj, p1: deserializePlayerFromSession(obj.p1), p2: deserializePlayerFromSession(obj.p2) };
}

function loadSavedSession() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    // Player ids must never collide with ids handed out to NEW players
    // created after restoring (e.g. adding someone mid-tournament) — bump
    // the module-level id counter past every restored id.
    const allIds = [
      ...((parsed.players || []).map((p) => p.id)),
      ...((parsed.boards || []).flatMap((b) => [b.p1?.id, b.p2?.id].filter((x) => x != null))),
    ];
    if (allIds.length) idCounter = Math.max(idCounter, ...allIds) + 1;
    return parsed;
  } catch (e) {
    return null;
  }
}

function persistSession(snapshot) {
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(snapshot));
  } catch (e) {
    // Storage can be unavailable in private/embedded browsing contexts.
  }
  pushSavedSoon();
}

function clearSavedSession() {
  try {
    localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch (e) {
    // ignore
  }
}


// REM: Turnausarkisto - ohjelman tekijä: Johannes Ketola
// Täysin erillään paritusmoottorista: tallentaa turnauksen tilannekuvan
// (pelaajat, ottelut, aloitustapa, rajoitteet) selaimen localStorageen omalla
// avaimellaan ja näyttää sen jälkikäteen kierros kierrokselta. Ei koske
// käynnissä olevan turnauksen tilaan eikä paritukseen millään tavalla.
const ARCHIVE_STORAGE_KEY = "darts-parittaja-archive-v1";

function loadArchive() {
  try {
    const a = JSON.parse(localStorage.getItem(ARCHIVE_STORAGE_KEY) || "[]");
    return Array.isArray(a) ? a : [];
  } catch (e) {
    return [];
  }
}

function saveArchive(list) {
  try {
    localStorage.setItem(ARCHIVE_STORAGE_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    return false;
  }
}

function archiveNewId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function archiveFmtDate(ts) {
  if (!ts) return "–";
  try { return new Date(ts).toLocaleString(TCI.locale(), { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return "–"; }
}

function archiveFmtTime(ts) {
  if (!ts) return "–";
  try { return new Date(ts).toLocaleTimeString(TCI.locale(), { hour: "2-digit", minute: "2-digit" }); } catch (e) { return "–"; }
}

function archiveFmtDuration(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return "–";
  const min = Math.round(ms / 60000);
  if (min < 1) return "alle 1 min";
  if (min < 60) return min + " min";
  return Math.floor(min / 60) + " h " + (min % 60) + " min";
}

// Aloitustapa: kone ehdotti / käsin valittu / jonosta (jonoon kone- tai käsin-ehdotuksena).
function archiveOriginInfo(m) {
  const o = m.origin;
  if (o === "auto") return { key: "auto", label: "KONE", cls: "bg-emerald-900 text-emerald-200", desc: "Kone ehdotti, käynnistetty suoraan taululle" };
  if (o === "manual") return { key: "manual", label: "KÄSIN", cls: "bg-amber-900 text-amber-200", desc: "Pari valittu käsin" };
  if (o === "queue") {
    return m.queueBy === "auto"
      ? { key: "queueAuto", label: "KONE → JONO", cls: "bg-sky-900 text-sky-200", desc: "Kone ehdotti, pari odotti jonossa ja käynnistettiin sieltä" }
      : { key: "queueManual", label: "KÄSIN → JONO", cls: "bg-violet-900 text-violet-200", desc: "Pari lisättiin jonoon käsin ja käynnistettiin sieltä" };
  }
  return { key: "unknown", label: "EI TIETOA", cls: "bg-[#2d4a37] text-[#a9c2ae]", desc: "Aloitustapaa ei ole tallennettu (vanha tallenne)" };
}

// Sarjataulukko tiettyyn kierrokseen asti (kierros = ottelun round-kenttä).
function archiveStandings(rec, upToRound) {
  const rows = {};
  const mk = (id, name) => ({ id, name, played: 0, w: 0, d: 0, l: 0, lf: 0, la: 0, opp: [], withdrawn: false });
  (rec.players || []).forEach((p) => { rows[p.id] = { ...mk(p.id, p.name), withdrawn: !!p.withdrawn }; });
  const ms = (rec.matches || []).filter((m) => upToRound == null || (m.round || 0) <= upToRound);
  ms.forEach((m) => {
    const a = rows[m.p1Id] || (rows[m.p1Id] = mk(m.p1Id, m.p1Name));
    const b = rows[m.p2Id] || (rows[m.p2Id] = mk(m.p2Id, m.p2Name));
    a.played++; b.played++; a.opp.push(m.p2Id); b.opp.push(m.p1Id);
    a.lf += m.l1; a.la += m.l2; b.lf += m.l2; b.la += m.l1;
    if (m.l1 > m.l2) { a.w++; b.l++; } else if (m.l1 < m.l2) { b.w++; a.l++; } else { a.d++; b.d++; }
  });
  const list = Object.values(rows).map((r) => ({ ...r, pts: r.w * 2 + r.d, diff: r.lf - r.la,
    wins: r.w + r.d / 2, legsFor: r.lf, legsAgainst: r.la, gamesPlayed: r.played, opponents: r.opp }));
  const tie = swTieCalc(list, ms, rec.tieBreak);
  const out = swTieSort(list, tie);
  out.tie = tie;
  return out;
}

function ArchiveStandingsTable({ rows }) {

      <table className="text-sm w-full">
        <thead>
          <tr className="text-[#a9c2ae] text-xs text-left">
            <th className="py-1 pr-2">#</th><th className="pr-3">Pelaaja</th><th className="pr-2">Pelit</th>
            <th className="pr-2">V</th>{anyDraw && <th className="pr-2">T⁠</th>}<th className="pr-2">H</th>
            <th className="pr-2">Legit</th><th className="pr-2">±</th><th className="pr-2">Pisteet</th><th className="pr-2" title={swTieTitle(rows.tie && rows.tie.mode)}>{swTieHead(rows.tie && rows.tie.mode)}</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={r.id} className={`border-t border-[#2d4a37] ${r.withdrawn ? "opacity-60" : ""}`}>
              <td className="py-1 pr-2 text-[#a9c2ae]">{i + 1}</td>
              <td className="pr-3 font-medium">{r.name}{r.withdrawn ? " (keskeytti)" : ""}</td>
              <td className="pr-2">{r.played}</td>
              <td className="pr-2">{r.w}</td>
              {anyDraw && <td className="pr-2">{r.d}</td>}
              <td className="pr-2">{r.l}</td>
              <td className="pr-2">{r.lf}–{r.la}</td>
              <td className="pr-2">{r.diff > 0 ? "+" : ""}{r.diff}</td>
              <td className="pr-2 font-bold text-[#e7c977]">{r.pts}</td>
              <td className="pr-2 text-[#a9c2ae]">{rows.tie ? swTieFmt(rows.tie, r.id) : ""}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function ArchiveViewer({ rec, onBack }) {
  const matches = rec.matches || [];
  const maxRound = Math.max(Number(rec.roundsTarget) || 0, ...matches.map((m) => m.round || 0), 1);
  const rounds = Array.from({ length: maxRound }, (_, i) => i + 1);
  const [tab, setTab] = useState("summary");
  const [playerId, setPlayerId] = useState("");
  const byTime = (a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0) || a.id - b.id;

  const counts = { auto: 0, manual: 0, queueAuto: 0, queueManual: 0, unknown: 0 };
  matches.forEach((m) => { counts[archiveOriginInfo(m).key]++; });
  const overrides = matches.filter((m) => m.overrideMsg).length;
  const edited = matches.filter((m) => m.edited).length;
  const durs = matches.filter((m) => m.startedAt && m.at).map((m) => m.at - m.startedAt);
  const avgDur = durs.length ? durs.reduce((s, x) => s + x, 0) / durs.length : null;
  const first = matches.reduce((mn, m) => Math.min(mn, m.startedAt || m.at || Infinity), Infinity);
  const last = matches.reduce((mx, m) => Math.max(mx, m.at || 0), 0);
  const tabBtn = (id, label) => (
    <button key={id} onClick={() => setTab(id)} data-testid={`arch-tab-${id}`}
      className={`rounded px-3 py-1.5 text-xs font-semibold border ${tab === id ? "bg-[#e7c977] text-[#0b1f16] border-[#e7c977]" : "border-[#3a5c46] text-[#a9c2ae] hover:bg-[#122a1e]"}`}>
      {label}
    </button>
  );

  let body = null;
  if (tab === "summary") {
    const rows = [
      ["Pelaajia", (rec.players || []).length],
      ["Pelejä per pelaaja", rec.roundsTarget],
      ["Pelattuja otteluita", matches.length],
      ["Kone ehdotti ja käynnistettiin suoraan", counts.auto],
      ["Kone ehdotti → jonosta käynnistetty", counts.queueAuto],
      ["Käsin valittu (taululle)", counts.manual],
      ["Käsin jonoon → jonosta käynnistetty", counts.queueManual],
      ...(counts.unknown ? [["Aloitustapa tuntematon", counts.unknown]] : []),
      ["Ohitettuja varoituksia", overrides],
      ["Muokattuja tuloksia", edited],
      ["Ottelun keskimääräinen kesto", archiveFmtDuration(avgDur)],
      ["Ensimmäinen peli alkoi", first === Infinity ? "–" : archiveFmtDate(first)],
      ["Viimeinen peli päättyi", last ? archiveFmtDate(last) : "–"],
      ["Käytetyt taulut", (rec.boardsUsed || []).join(", ") || "–"],
      ["OFFLINE TURNAUS", rec.offlineMode ? "kyllä" : "ei"],
    ];
    body = (
      <div className="space-y-4">
        <div className="bg-[#122a1e] border border-[#2d4a37] rounded-lg p-4">
          <table className="text-sm w-full"><tbody>
            {rows.map(([k, v]) => (<tr key={k} className="border-b border-[#1d3a29] last:border-0"><td className="py-1 text-[#a9c2ae]">{k}</td><td className="py-1 text-right font-semibold">{v}</td></tr>))}
          </tbody></table>
        </div>
        {(rec.boardRules || []).length > 0 && (
          <div className="bg-[#122a1e] border border-[#2d4a37] rounded-lg p-4 text-sm">
            <div className="text-[#e7c977] font-semibold mb-1">Taulurajoitteet</div>
            {(rec.boardRules || []).map((r, i) => (<div key={i}>Jos {r.a} heittää taululla {r.boardA}, {r.b} ei voi heittää taululla {r.boardB}.</div>))}
          </div>
        )}
        {(rec.forbiddenPairs || []).length > 0 && (
          <div className="bg-[#122a1e] border border-[#2d4a37] rounded-lg p-4 text-sm">
            <div className="text-[#e7c977] font-semibold mb-1">Ei-parit</div>
            {(rec.forbiddenPairs || []).map((r, i) => (<div key={i}>{`${r.p1} ja ${r.p2} eivät kohtaa toisiaan.`}</div>))}
          </div>
        )}
        {(rec.running || []).length > 0 && (
          <div className="bg-[#122a1e] border border-[#2d4a37] rounded-lg p-4 text-sm">
            <div className="text-[#e7c977] font-semibold mb-1">Tallennushetkellä käynnissä</div>
            {rec.running.map((r, i) => (<div key={i}>Taulu {r.board}: {r.p1Name} – {r.p2Name} <ArchiveOriginBadge m={r} /></div>))}
          </div>
        )}
        {(rec.queue || []).length > 0 && (
          <div className="bg-[#122a1e] border border-[#2d4a37] rounded-lg p-4 text-sm">
            <div className="text-[#e7c977] font-semibold mb-1">Tallennushetkellä jonossa</div>
            {rec.queue.map((r, i) => (<div key={i}>{r.p1Name} – {r.p2Name} ({r.by === "auto" ? "kone ehdotti" : "käsin"})</div>))}
          </div>
        )}
        <div>
          <div className="text-[#e7c977] font-semibold mb-2 text-sm">Lopputilanne</div>
          <ArchiveStandingsTable rows={archiveStandings(rec, null)} />
        </div>
      </div>
    );
  } else if (tab === "all") {
    body = (
      <div className="space-y-1" data-testid="arch-all">
        <p className="text-xs text-[#7a9484] mb-2">Kaikki ottelut siinä järjestyksessä kuin ne käynnistettiin.</p>
        {matches.slice().sort(byTime).map((m) => (<ArchiveMatchRow key={m.id} m={m} showRound />))}
      </div>
    );
  } else if (tab === "players") {
    const sel = (rec.players || []).find((p) => String(p.id) === String(playerId));
    const mine = sel ? matches.filter((m) => m.p1Id === sel.id || m.p2Id === sel.id).sort(byTime) : [];
    body = (
      <div>
        <select value={playerId} onChange={(e) => setPlayerId(e.target.value)} data-testid="arch-player-select"
          className="bg-[#0b1f16] border border-[#3a5c46] rounded px-3 py-2 text-sm mb-3">
          <option value="">Valitse pelaaja…</option>
          {(rec.players || []).slice().sort((a, b) => a.name.localeCompare(b.name, "fi-FI")).map((p) => (<option key={p.id} value={p.id}>{p.name}</option>))}
        </select>
        {sel && (
          <div className="space-y-1" data-testid="arch-player-matches">
            {mine.length === 0 && <p className="text-xs text-[#5c7566] italic">Ei pelattuja otteluita.</p>}
            {mine.map((m) => {
              const isP1 = m.p1Id === sel.id;
              const my = isP1 ? m.l1 : m.l2, th = isP1 ? m.l2 : m.l1;
              return (
                <div key={m.id} className="bg-[#122a1e] border border-[#2d4a37] rounded px-3 py-2 text-sm">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-xs text-[#a9c2ae] w-28 shrink-0">{`K${m.round} · Taulu ${m.board}`}</span>
                    <span className="flex-1">vs <b>{isP1 ? m.p2Name : m.p1Name}</b></span>
                    <span className={`font-bold px-2 ${my > th ? "text-[#8fd19e]" : my < th ? "text-[#e8a0a0]" : "text-[#e7c977]"}`}>{my} : {th} {my > th ? "(voitto)" : my < th ? "(tappio)" : "(tasapeli)"}</span>
                  </div>
                  <div className="mt-1 text-[11px] text-[#7a9484] flex flex-wrap gap-2 items-center">
                    <ArchiveOriginBadge m={m} /><span>Alkoi {archiveFmtTime(m.startedAt)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  } else {
    const r = Number(tab.replace("r", ""));
    const ms = matches.filter((m) => m.round === r).sort(byTime);
    const playedIds = new Set();
    ms.forEach((m) => { playedIds.add(m.p1Id); playedIds.add(m.p2Id); });
    const c = { auto: 0, manual: 0, queue: 0 };
    ms.forEach((m) => { const k = archiveOriginInfo(m).key; if (k === "auto") c.auto++; else if (k === "manual") c.manual++; else if (k !== "unknown") c.queue++; });
    body = (
      <div className="space-y-3" data-testid={`arch-round-${r}`}>
        <div className="text-xs text-[#a9c2ae]">
          Kierros {r}: {ms.length} ottelua · kone {c.auto} · käsin {c.manual} · jonosta {c.queue}
          {ms.some((m) => m.overrideMsg) ? ` · varoituksia ohitettu ${ms.filter((m) => m.overrideMsg).length}` : ""}
        </div>
        <p className="text-[11px] text-[#7a9484]">Kierros tarkoittaa pelaajien n:ttä peliä: ottelu kuuluu kierrokseen, joka on sen pelaajien pelimäärä + 1 ottelun alkaessa. Ottelut ovat aloitusjärjestyksessä.</p>
        <div className="space-y-1">
          {ms.length === 0 && <p className="text-xs text-[#5c7566] italic">Tällä kierroksella ei ole pelattuja otteluita.</p>}
          {ms.map((m) => (<ArchiveMatchRow key={m.id} m={m} />))}
        </div>
        <div>
          <div className="text-[#e7c977] font-semibold mb-2 text-sm">Sarjataulukko kierroksen {r} jälkeen</div>
          <ArchiveStandingsTable rows={archiveStandings(rec, r)} />
        </div>
      </div>
    );
  }

  return (
    <div data-testid="arch-viewer">
      <div className="flex items-center justify-between gap-2 flex-wrap mb-3">
        <div>
          <h2 className="text-lg font-bold" style={{ fontFamily: "Georgia, serif" }}>{rec.name}</h2>
          <div className="text-xs text-[#7a9484]">Tallennettu {archiveFmtDate(rec.savedAt)} · {rec.finished ? "turnaus valmis" : "turnaus kesken tallennushetkellä"}</div>
        </div>
        <button onClick={onBack} data-testid="arch-back" className="border border-[#5c7566] text-[#a9c2ae] rounded px-3 py-1.5 text-xs">← Takaisin arkistoon</button>
      </div>
      <div className="flex flex-wrap gap-1.5 mb-4">
        {tabBtn("summary", "Yhteenveto")}
        {rounds.map((r) => tabBtn("r" + r, "Kierros " + r))}
        {tabBtn("all", "Kaikki ottelut")}
        {tabBtn("players", "Pelaajat")}
      </div>
      {body}
    </div>
  );
}

function ArchivePanel({ onClose, onChanged, currentArchiveId }) {
  const [list, setList] = useState(() => loadArchive());
  const [viewId, setViewId] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [msg, setMsg] = useState("");
  const commit = (next) => {
    if (!saveArchive(next)) { setMsg("Tallennus selaimen muistiin epäonnistui."); return false; }
    setList(next);
    if (onChanged) onChanged(next);
    return true;
  };
  const exportRec = (rec) => {
    try {
      const blob = new Blob([JSON.stringify(rec, null, 1)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "turnaus-" + String(rec.name || "arkisto").replace(/[^\wåäöÅÄÖ-]+/g, "_") + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { setMsg("Tiedoston lataus epäonnistui."); }
  };
  const importFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rec = JSON.parse(reader.result);
        if (!rec || rec.format !== "darts-parittaja-archive" || !Array.isArray(rec.matches) || !Array.isArray(rec.players)) {
          setMsg("Tiedosto ei ole turnausarkiston tallenne."); return;
        }
        const copy = { ...rec, id: archiveNewId() };
        if (commit([copy, ...list])) setMsg("Tuotu: " + (copy.name || "turnaus"));
      } catch (e) { setMsg("Tiedoston luku epäonnistui."); }
    };
    reader.readAsText(file);
  };
  const rec = viewId ? list.find((r) => r.id === viewId) : null;
  return (
    <div className="fixed inset-0 z-50 bg-[#0b1f16] overflow-auto" data-testid="arch-panel">
      <div className="max-w-4xl mx-auto px-5 py-6">
        <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
          <h1 className="text-2xl font-bold" style={{ fontFamily: "Georgia, serif" }}>📚 Turnausarkisto</h1>
          <button onClick={onClose} data-testid="arch-close" className="border border-[#5c7566] text-[#a9c2ae] rounded px-3 py-1.5 text-sm">Sulje arkisto</button>
        </div>
        {msg && <div className="mb-3 text-sm bg-[#122a1e] border border-[#3a5c46] rounded px-3 py-2">{msg}</div>}
        {rec ? (
          <ArchiveViewer rec={rec} onBack={() => setViewId(null)} />
        ) : (
          <div>
            <p className="text-xs text-[#7a9484] mb-3">Tallennetut turnaukset säilyvät tässä selaimessa. Voit ladata turnauksen tiedostona (varmuuskopio tai siirto toiselle koneelle) ja tuoda sen takaisin.</p>
            <div className="mb-4">
              <label className="inline-block border border-[#3a5c46] hover:bg-[#122a1e] rounded px-3 py-1.5 text-xs cursor-pointer text-[#a9c2ae]">
                Tuo tiedostosta…
                <input type="file" accept=".json,application/json" className="hidden" data-testid="arch-import"
                  onChange={(e) => { importFile(e.target.files && e.target.files[0]); e.target.value = ""; }} />
              </label>
            </div>
            {list.length === 0 && <p className="text-sm text-[#5c7566] italic" data-testid="arch-empty">Arkistossa ei ole vielä turnauksia. Tallenna turnaus painikkeella "Tallenna turnaus".</p>}
            <div className="space-y-2">
              {list.map((r) => (
                <div key={r.id} data-testid="arch-item" className="bg-[#122a1e] border border-[#2d4a37] rounded-lg px-4 py-3 flex items-center gap-3 flex-wrap">
                  <div className="flex-1 min-w-[200px]">
                    <div className="font-semibold">{r.name}{r.id === currentArchiveId ? <span className="ml-2 text-[10px] text-[#e7c977] border border-[#e7c977] rounded-full px-2">NYKYINEN</span> : null}</div>
                    <div className="text-xs text-[#7a9484]">
                      {archiveFmtDate(r.savedAt)} · {(r.players || []).length} pelaajaa · {r.roundsTarget} peliä · {(r.matches || []).length} ottelua · {r.finished ? "valmis" : "kesken"}
                    </div>
                  </div>
                  <button onClick={() => setViewId(r.id)} data-testid="arch-open" className="bg-[#e7c977] text-[#0b1f16] font-semibold rounded px-3 py-1.5 text-xs">Avaa</button>
                  <button onClick={() => exportRec(r)} className="border border-[#5b9bd5] text-[#5b9bd5] rounded px-3 py-1.5 text-xs">Lataa tiedostona</button>
                  {confirmDel === r.id ? (
                    <span className="flex items-center gap-2">
                      <button onClick={() => { commit(list.filter((x) => x.id !== r.id)); setConfirmDel(null); }} data-testid="arch-del-confirm" className="bg-[#c98080] text-[#0b1f16] font-semibold rounded px-3 py-1.5 text-xs">Poista pysyvästi</button>
                      <button onClick={() => setConfirmDel(null)} className="border border-[#5c7566] text-[#a9c2ae] rounded px-3 py-1.5 text-xs">Peruuta</button>
                    </span>
                  ) : (
                    <button onClick={() => setConfirmDel(r.id)} data-testid="arch-del" className="text-[#c98080] border border-[#5c2d2d] rounded px-3 py-1.5 text-xs">Poista</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// REM: Pelaajien luonti ja apufunktiot - ohjelman tekijä: Johannes Ketola
let idCounter = 1;
const nextId = () => idCounter++;

function makePlayer(name, skill, speed, tick, boardRestrictions = [], forbiddenOpponentNames = []) {
  return {
    id: nextId(),
    name,
    skill,
    speed,
    boardRestrictions: new Set(normalizeBoardRestrictions(boardRestrictions, name)),
    forbiddenOpponentNames: new Set((forbiddenOpponentNames || []).map(normalizeRosterName)),
    difficulty: skill * speed,
    gamesPlayed: 0,
    wins: 0,
    legsFor: 0,
    legsAgainst: 0,
    opponents: new Set(),
    lastActionTick: tick || 0,
    carryOvers: 0,
    withdrawn: false,
  };
}

// REM: Parituksen laskentakertoimet - ohjelman tekijä: Johannes Ketola
function coefficient(a, b) {
  return a.difficulty * b.difficulty;
}

// Speed scale is 1 = nopein (fastest) .. 3 = hitain (slowest), as shown in
// the setup dropdowns. A pair's overall pace is bottlenecked by whichever
// of the two is slower (darts is turn-based, so the slower player sets the
// tempo), so a queued pair's "hitaus" (slowness) is the MAX of the two
// speed values, not the average.
function pairSlowness(a, b) {
  return Math.max(a.speed, b.speed);
}
function speedLabel(n) {
  return n === 1 ? "nopein" : n === 2 ? "normaali" : n === 3 ? "hitain" : "?";
}

// REM: Virhe-/varoitusääni - ohjelman tekijä: Johannes Ketola
// One shared warning sound, synthesised with the Web Audio API (no audio
// file needed, so the app stays a single self-contained HTML file): two
// short descending buzzer beeps. It is played by warn() below whenever the
// user tries something wrong, invalid or impossible. Browsers only allow
// sound after a user interaction, but every warning here is triggered by a
// click, so that is always satisfied; everything is wrapped in try/catch so
// a browser without audio support can never break the app itself.
let warningAudioCtx = null;
function playWarningSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!warningAudioCtx) warningAudioCtx = new AC();
    const ctx = warningAudioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    [[0, 440], [0.2, 330]].forEach(([offset, freq]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.18);
    });
  } catch (e) {
    // Ääni on pelkkä lisä - sen epäonnistuminen ei saa koskaan rikkoa ohjelmaa.
  }
}

// REM: Parin tunniste - ohjelman tekijä: Johannes Ketola
function pairKey(id1, id2) {
  return id1 < id2 ? `${id1}-${id2}` : `${id2}-${id1}`;
}

// REM: TV-näkymä - ohjelman tekijä: Johannes Ketola
// A completely separate, read-only vanilla-JS page (no React, no Babel, no
// build step) that gets written into a brand-new browser tab/window via
// window.open + document.write. It never touches the pairing engine or any
// React state directly — it only reads the SAME localStorage session key
// ("darts-parittaja-session-v1") that the main app already auto-saves to
// after every action (see persistSession/useEffect above), which already
// contains pairQueue (in exact play order), players and boards.
//
// Real-time updates use two layers, both push-free / read-only from the
// engine's point of view:
//   1. The native "storage" event: per the browser spec this fires in
//      OTHER same-origin tabs/windows whenever localStorage changes (it
//      does NOT fire in the tab that made the change) - so the instant the
//      organizer's tab saves a new queue order, this tab is notified
//      automatically, with zero polling delay.
//   2. A 700ms interval as a robustness fallback only, in case some
//      browser/embedding context doesn't deliver the storage event
//      reliably. Both paths just re-run the same render() - neither can
//      ever write anything back, so there is no way for the TV tab to
//      affect the tournament state.
//
// Colour coding (shown as a gradient bar in the on-screen legend too) —
// this is deliberately DIFFERENT from the app's own queue list, which
// keeps showing pairSlowness/speedLabel (pace class 1-3) for the
// organizer, untouched. The pace class is internal planning info for
// whoever is running the tournament, not something the players on the big
// screen need — so here the colour instead answers the players' actual
// question: "how soon do we play?" It is a plain green→red gradient by
// QUEUE POSITION only (nothing about speed/pace enters this calculation):
// the pair at the top of the queue (index 0, next to start) is pure
// green, the pair at the very end of the queue is pure red, and everyone
// in between is linearly interpolated between the two. Recomputed fresh
// on every render() call against the live pairQueue order/length, so a
// reorder or an added/removed pair immediately reflows the whole gradient.
const TV_VIEW_HTML = `<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV-JONO — Seuraavat pelit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; background:#0b1f16; color:#eaf2ec; font-family: Georgia, "Times New Roman", serif; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 4vh 4vw 2vh; }
  h1 { font-size: clamp(2rem, 4.2vw, 3.6rem); letter-spacing: 0.05em; color:#e7c977; margin: 0 0 0.9em 0; text-align:center; text-transform:uppercase; }

// REM: Pääkomponentti DartsParittaja - ohjelman tekijä: Johannes Ketola

    }
    const a = setupPlayers.find((p) => normalizeRosterName(p.name) === normalizeRosterName(forbiddenP1));
    const b = setupPlayers.find((p) => normalizeRosterName(p.name) === normalizeRosterName(forbiddenP2));
    if (!a || !b) return;
    if (forbiddenPairExists(a.name, b.name)) {
      warn("Tämä estetty paritus on jo lisätty.");
      return;
    }
    pushHistory();
    setSetupForbiddenPairs((prev) => [...prev, { p1: a.name, p2: b.name }]);
    setForbiddenP1("");
    setForbiddenP2("");
    setNotice(`${a.name} ja ${b.name} asetettu ei-pariksi.`);
  };

  const removeForbiddenPair = (p1, p2) => {
    pushHistory();
    setSetupForbiddenPairs((prev) => prev.filter((pair) => !(
      (normalizeRosterName(pair.p1) === normalizeRosterName(p1) && normalizeRosterName(pair.p2) === normalizeRosterName(p2)) ||
      (normalizeRosterName(pair.p1) === normalizeRosterName(p2) && normalizeRosterName(pair.p2) === normalizeRosterName(p1))
    )));
  };

  const getForbiddenOpponentNames = (name) => {
    const key = normalizeRosterName(name);
    return setupForbiddenPairs.flatMap((pair) => {
      const a = normalizeRosterName(pair.p1);
      const b = normalizeRosterName(pair.p2);
      if (a === key) return [pair.p2];
      if (b === key) return [pair.p1];
      return [];
    });
  };

  // Permanent player roster. Saved players override built-in values and
  // newly added players stay available in every future tournament on this device.
  const availableRoster = roster
    .filter((p) => !setupPlayers.some((sp) => normalizeRosterName(sp.name) === normalizeRosterName(p.name)))
    .sort(rosterSort);

  const importBulkPlayers = () => {
    const names = [];
    const ignoredLines = [];
    const kis = tcExtractRosterNames(bulkNames);
    if (kis) kis.names.forEach((nm) => names.push(nm));
    else bulkNames.split(/\r?\n/).forEach((line) => {
      const nm = extractNameFromPasteLine(line);
      if (nm) { names.push(nm); return; }
      // Ilmoitetaan ohitetut tekstirivit (ei tyhjät eikä pelkät rivinumerot).
      const first = line.split("\t")[0].trim();
      if (first && !/^\d+[.)]?$/.test(first) && !ignoredLines.includes(first)) ignoredLines.push(first);
    });
    const ignoredText = ignoredLines.length > 0
      ? ` Ohitettu, koska ei ole ihmisen nimi: ${ignoredLines.slice(0, 8).join("; ")}${ignoredLines.length > 8 ? "; ..." : ""}.`
      : "";

    if (names.length === 0) {
      warn("Liitä pelaajien nimet, yksi nimi riville." + ignoredText);
      return;
    }

    const rosterByName = new Map(roster.map((p) => [normalizeRosterName(p.name), p]));
    const existing = new Set(setupPlayers.map((p) => p.name.toLowerCase()));
    const seen = new Set();
    const imported = [];
    const unknown = [];

    for (const rawName of names) {
      const key = rawName.toLowerCase();
      if (seen.has(key) || existing.has(key)) continue;
      seen.add(key);
      const found = rosterByName.get(key);
      if (found) {
        imported.push({ name: found.name, skill: found.skill, speed: found.speed, boardRestrictions: normalizeBoardRestrictions(found.boardRestrictions, found.name) });
      } else {
        imported.push({ name: rawName, skill: "", speed: "", boardRestrictions: defaultBoardRestrictionsForName(rawName) });
        unknown.push(rawName);
      }
    }

    if (imported.length > 0) {
      pushHistory();
      setSetupPlayers((prev) => [...prev, ...imported]);
      imported.forEach((p) => saveRosterPlayer(p.name, p.skill, p.speed));
    }

    setBulkNames("");
    if (unknown.length > 0) {
      setNotice(`${imported.length} pelaajaa tuotu. Näille pelaajille ei löytynyt valmiita arvoja: ${unknown.join(", ")}.${ignoredText}`);
    } else {
      setNotice(`${imported.length} pelaajaa tuotu listasta. Tallennetut taito- ja nopeusarvot täytettiin automaattisesti.${ignoredText}`);
    }
  };

  const addFromRoster = () => {
    if (!rosterPick) return;
    const found = roster.find((p) => p.name === rosterPick);
    if (!found) return;
    const { name, skill, speed, boardRestrictions } = found;
    pushHistory();
    setSetupPlayers((prev) => [...prev, { name, skill, speed, boardRestrictions: normalizeBoardRestrictions(boardRestrictions, name) }]);
    setRosterPick("");
  };

  const addAllSavedPlayers = () => {
    const existing = new Set(setupPlayers.map((p) => normalizeRosterName(p.name)));
    const savedPlayers = roster
      .filter((p) => p.skill && p.speed && !existing.has(normalizeRosterName(p.name)))
      .sort(rosterSort);

    if (savedPlayers.length === 0) {
      warn("Kaikki tallennetut pelaajat, joilla on taito- ja nopeusarvot, ovat jo turnauksessa tai niitä ei ole vielä tallennettu.");
      return;
    }

    const added = savedPlayers.map((p) => ({
      name: p.name,
      skill: p.skill,
      speed: p.speed,
      boardRestrictions: normalizeBoardRestrictions(p.boardRestrictions, p.name),
    }));

    pushHistory();
    setSetupPlayers((prev) => [...prev, ...added].sort(rosterSort));
    setNotice(`${added.length} tallennettua pelaajaa lisätty turnaukseen automaattisesti.`);
  };

  // Satunnaisten pelaajien tuonti (testaukseen): arpoo N pelaajaa tallennetuista,
  // joilla on taito- ja nopeusarvot, eikä lisää jo mukana olevia.
  const addRandomSavedPlayers = () => {
    const wanted = parseInt(randomCount, 10);
    if (!Number.isFinite(wanted) || wanted < 1) {
      warn("Anna satunnaisten pelaajien määrä (1 tai enemmän).");
      return;
    }
    const existing = new Set(setupPlayers.map((p) => normalizeRosterName(p.name)));
    const pool = roster.filter((p) => p.skill && p.speed && !existing.has(normalizeRosterName(p.name)));
    const room = Math.max(0, 32 - setupPlayers.length);
    if (room === 0) {
      warn("Turnauksessa on jo 32 pelaajaa, enempää ei voi lisätä.");
      return;
    }
    if (pool.length === 0) {
      warn("Ei yhtään tallennettua pelaajaa, jota ei olisi jo turnauksessa.");
      return;
    }
    const arr = pool.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    const take = Math.min(wanted, arr.length, room);
    const added = arr.slice(0, take).map((p) => ({
      name: p.name,
      skill: p.skill,
      speed: p.speed,
      boardRestrictions: normalizeBoardRestrictions(p.boardRestrictions, p.name),
    }));
    pushHistory();
    setSetupPlayers((prev) => [...prev, ...added].sort(rosterSort));
    const short = take < wanted
      ? (arr.length <= room
          ? ` (pyydettiin ${wanted}, mutta vapaita tallennettuja pelaajia oli vain ${arr.length})`
          : ` (pyydettiin ${wanted}, mutta turnaukseen mahtuu enintään 32 pelaajaa)`)
      : "";
    setNotice(`${take} satunnaista pelaajaa lisätty turnaukseen${short}.`);
  };

  const addSetupPlayer = () => {
    const trimmed = newSetupName.trim();
    if (!trimmed) return;
    if (setupPlayers.some((p) => normalizeRosterName(p.name) === normalizeRosterName(trimmed))) return;
    const skill = newSetupSkill;
    const speed = newSetupSpeed;
    const boardRestrictions = defaultBoardRestrictionsForName(trimmed);
    pushHistory();
    setSetupPlayers((prev) => [...prev, { name: trimmed, skill, speed, boardRestrictions }]);
    saveRosterPlayer(trimmed, skill, speed, boardRestrictions);
    setNewSetupName("");
    setNewSetupSkill("");
    setNewSetupSpeed("");
  };

  useTcLevels();
  const allSetupComplete = setupPlayers.length >= 2 && setupPlayers.every((p) => { const l = tcLevelsFor(p.name, p.skill, p.speed); return l.skill && l.speed; });
  const isOddCount = setupPlayers.length % 2 === 1;
  const roundsTargetNum = Number(roundsTarget);

  const toggleSetupBoard = (num) => {
    pushHistory();
    setActiveBoardNumbers((prev) => {
      const next = new Set(prev);
      if (next.has(num)) {
        if (next.size <= 2) return prev;
        next.delete(num);
      } else {
        next.add(num);
      }
      return next;
    });
  };

  const toggleBoardInTournament = (id) => {
    pushHistory();
    setBoards((prev) => {
      const activeCount = prev.filter((b) => !b.disabled).length;
      const target = prev.find((b) => b.id === id);
      if (!target.disabled && activeCount <= 1) {
        warn("Vähintään yhden taulun on oltava käytössä.");
        return prev;
      }
      return prev.map((b) => (b.id === id ? { ...b, disabled: !b.disabled } : b));
    });
    setPreviewBoardOrder((prev) => prev.filter((bId) => bId !== id));
  };

  // DYNAMIC SWISS pairing with a mathematical look-ahead safety net (v3).
  //
  // v1 built a fixed opponent graph and picked from it greedily by score —
  // that greedy choice could strand the last two players needing a game as
  // a pair who had already met, causing a genuine automatic-pairing
  // deadlock in a third to over half of realistic tournaments.
  //
  // v2 "fixed" this by precomputing the ENTIRE tournament as a rigid
  // round-by-round schedule up front. That is deadlock-proof, but it threw
  // out the actual point of the tool: Swiss pairing has to react to results
  // as they come in (nobody wants a 0-win player thrown against a 3-win
  // player), and a schedule fixed before a single dart is thrown cannot do
  // that. Wrong trade-off.
  //
  // v3 (this version) keeps pairing fully dynamic — always pick, among the
  // players free right now, the pair with the closest win/loss record
  // (falling back to a wider gap only if nothing tighter is safe) — but
  // before committing to ANY pair, it asks a hard mathematical question:
  // "if these two play each other now, can every remaining player still be
  // given the rest of their distinct-opponent games afterwards?" Only if
  // the answer is a proven yes does the pair start. If no safe pair exists
  // among the currently free players, the engine does exactly what you
  // described: it does nothing and waits for more players to free up in
  // the pool, instead of forcing a bad pairing.
  //
  // The "can this still be finished?" question is a classic degree-
  // constrained subgraph existence problem (an f-factor / regular-graph
  // realization with certain pairs forbidden). It's answered constructively
  // — the same technique real random-regular-graph generators use: greedily
  // connect the most-constrained remaining player to their most-constrained
  // available partner, and if a partial construction ever gets stuck,
  // restart with a new random tie-break order (cheap, and it succeeds
  // almost immediately in practice on graphs this dense). This has been
  // stress-tested over 1850+ simulated tournaments (every player/board/
  // round combination that used to deadlock, plus 600 extra repeats of the
  // worst offenders) with zero deadlocks, zero rule violations, and ~96%
  // of all pairings kept within a 1-win gap of each other.

  // REM: Paritusalgoritmi (ei toistuvia vastustajia) - ohjelman tekijä: Johannes Ketola
  function scheduleKey(id1, id2) {
    return id1 < id2 ? `${id1}-${id2}` : `${id2}-${id1}`;
  }

  function getBoardBusyIds(boardsIn) {
    const busy = new Set();
    boardsIn.forEach((b) => {
      if (b.status === "playing") {
        busy.add(b.p1.id);
        busy.add(b.p2.id);
      }
    });
    return busy;
  }

  function getBusyIds(boardsIn) {
    const busy = getBoardBusyIds(boardsIn);
    // Players who are reserved in the manual "pair queue" (including pairs
    // deferred straight from an automatic suggestion, e.g. to give someone
    // rest time) are unavailable for any OTHER pairing until the queued
    // game actually starts or is removed from the queue — exactly like
    // someone who is already mid-game.
    // KORJAUS (jonobugi): pelaaja joka on SEKÄ pelaamassa taululla ETTÄ jonossa
    // on aloittanut kaksi peliä (nykyinen + jonossa odottava). Aiemmin hänet
    // laskettiin vain kerran (+1), jolloin jäljellä olevien pelien summa meni
    // pariton ja automaattiparitus ei löytänyt yhtään paria ennen kuin hänen
    // taulupelinsä päättyi. Lisälasku koskee VAIN tätä tilannetta; kun kukaan ei
    // ole yhtä aikaa taululla ja jonossa, joukko on tyhjä eikä mikään muutu.
    const boardBusy = new Set(busy);
    const alsoQueued = new Set();
    pairQueue.forEach((q) => {
      if (boardBusy.has(q.p1Id)) alsoQueued.add(q.p1Id);
      if (boardBusy.has(q.p2Id)) alsoQueued.add(q.p2Id);
      busy.add(q.p1Id);
      busy.add(q.p2Id);
    });
    busy.alsoQueuedIds = alsoQueued;
    return busy;
  }

  function startedCount(p, busyIds) {
    return p.gamesPlayed + (busyIds.has(p.id) ? 1 : 0) + (busyIds.alsoQueuedIds && busyIds.alsoQueuedIds.has(p.id) ? 1 : 0);
  }

  function buildUsedPairSet(playersIn, boardsIn) {
    const used = new Set();
    playersIn.forEach((p) => p.opponents.forEach((oppId) => used.add(scheduleKey(p.id, oppId))));
    boardsIn.forEach((bd) => {
      if (bd.status === "playing") used.add(scheduleKey(bd.p1.id, bd.p2.id));
    });
    // A queued pair's matchup is already decided — treat it as a used edge
    // for feasibility purposes too, same as a game already in progress.
    pairQueue.forEach((q) => used.add(scheduleKey(q.p1Id, q.p2Id)));
    return used;
  }

  // Players who still need games, and how many, after optionally also
  // pretending `tentativePair` (an [idA, idB] array) has just been played.
  function activeNeedList(playersIn, boardsIn, tentativePair, roundsOverride) {
    // Withdrawn (DNF) players are excluded entirely — they no longer need
    // any more games, regardless of how many they'd actually played. This
    // is the ONE place that matters for the whole engine: everything else
    // (findBestPair, canCompleteRemaining, the feasibility oracle) already
    // treats "need <= 0" as "not part of the remaining problem", so a
    // withdrawn player simply stops being considered anywhere, exactly
    // like a player who already reached their target game count.
    //
    // roundsOverride is OPTIONAL and used ONLY by the "muuta kierrosmäärää"
    // feature to trial-check a hypothetical different round count before
    // committing to it. Every existing caller omits it, so R falls back to
    // the live roundsTargetNum exactly as before — this parameter changes
    // nothing about normal operation (verified: identical results whether
    // this line exists or not, when the 4th argument is omitted).
    const R = roundsOverride != null ? roundsOverride : roundsTargetNum;
    const active = playersIn.filter((p) => !p.withdrawn);
    const busy = getBusyIds(boardsIn);
    const need = new Map(active.map((p) => [p.id, R - startedCount(p, busy)]));
    if (tentativePair) {
      if (need.has(tentativePair[0])) need.set(tentativePair[0], need.get(tentativePair[0]) - 1);
      if (need.has(tentativePair[1])) need.set(tentativePair[1], need.get(tentativePair[1]) - 1);
    }
    return active.map((p) => ({ id: p.id, need: need.get(p.id) })).filter((p) => p.need > 0);
  }

  function seededRandom(seed) {
    let s = (seed >>> 0) || 1;
    return () => {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  // One randomized attempt to construct a full completion: repeatedly
  // connect the currently most-constrained player to their most-constrained
  // still-available partner (ties broken randomly). Returns true/false.
  function tryConstructCompletion(active0, used0, rand) {
    let active = active0.map((p) => ({ ...p }));
    let used = new Set(used0);
    while (active.length > 0) {
      active.sort((a, b) => a.need - b.need || rand() - 0.5);
      const u = active[0];
      const candidates = active.slice(1).filter((v) => !used.has(scheduleKey(u.id, v.id)));
      if (candidates.length < u.need) return false;
      candidates.sort((a, b) => b.need - a.need || rand() - 0.5);
      const chosen = candidates.slice(0, u.need);
      for (const c of chosen) {
        used.add(scheduleKey(u.id, c.id));
        c.need -= 1;
      }
      active = active.filter((v) => v.id !== u.id && v.need > 0);
    }
    return true;
  }

  // The safety net: can the tournament still be fully completed (everyone
  // gets exactly roundsTargetNum distinct opponents) if `tentativePair`
  // plays now? Also respects the "ei-pari" forbidden-pair list.
  // roundsOverride: see activeNeedList — optional, only used to trial-check
  // a hypothetical round count before committing to it.
  function canCompleteRemaining(playersIn, boardsIn, tentativePair, seedHint, roundsOverride) {
    const active = activeNeedList(playersIn, boardsIn, tentativePair, roundsOverride);
    if (active.some((p) => p.need < 0)) return false;
    if (active.length === 0) return true;
    const used = buildUsedPairSet(playersIn, boardsIn);
    if (tentativePair) used.add(scheduleKey(tentativePair[0], tentativePair[1]));
    const byId = new Map(playersIn.map((p) => [p.id, p]));
    for (let i = 0; i < active.length; i++) {
      for (let j = i + 1; j < active.length; j++) {
        const pa = byId.get(active[i].id), pb = byId.get(active[j].id);
        if (pa && pb && pairRestrictionMessage(pa, pb)) used.add(scheduleKey(active[i].id, active[j].id));
      }
    }
    const rand = seededRandom((seedHint || 1) * 2654435761 + active.length);
    const RETRIES = 60;
    for (let attempt = 0; attempt < RETRIES; attempt++) {
      if (tryConstructCompletion(active, used, rand)) return true;
    }
    return false;
  }

  let feasibilitySeedCounter = 1;


  function normalizePlayerName(name) {
    return String(name || "").trim().toLocaleLowerCase("fi-FI");
  }

  function boardRestrictionMessage(player, boardId) {
    if (!player || !boardId) return "";
    const restrictions = player.boardRestrictions instanceof Set
      ? player.boardRestrictions
      : new Set(normalizeBoardRestrictions(player.boardRestrictions, player.name));
    if (!restrictions.has(boardId)) return "";
    return `${player.name.toUpperCase()} EI VOI HEITTÄÄ TAULULLA ${boardId}.`;
  }

  function pairBoardRestriction(a, b, boardId) {
    return boardRestrictionMessage(a, boardId) || boardRestrictionMessage(b, boardId);
  }

  function pairRestrictionMessage(a, b) {
    if (!a || !b) return "";
    const aForbidden = a.forbiddenOpponentNames instanceof Set ? a.forbiddenOpponentNames : new Set(a.forbiddenOpponentNames || []);
    const bForbidden = b.forbiddenOpponentNames instanceof Set ? b.forbiddenOpponentNames : new Set(b.forbiddenOpponentNames || []);
    if (aForbidden.has(normalizeRosterName(b.name)) || bForbidden.has(normalizeRosterName(a.name))) {
      return `${a.name.toUpperCase()} JA ${b.name.toUpperCase()} EIVÄT VOI HEITTÄÄ TOISIAAN VASTAAN.`;
    }
    return "";
  }

  // REM: Parin sallittavuuden tarkistus - ohjelman tekijä: Johannes Ketola
  function canStartPair(a, b, playersIn, boardsIn) {
    if (!a || !b || a.id === b.id) return { ok: false, reason: "Valitse kaksi eri pelaajaa." };
    if (a.withdrawn || b.withdrawn) return { ok: false, reason: "Pelaaja on keskeyttänyt turnauksen (DNF) eikä voi enää pelata." };
    const busy = getBusyIds(boardsIn);
    if (busy.has(a.id) || busy.has(b.id)) return { ok: false, reason: "Pelaaja on jo käynnissä olevassa pelissä." };
    if (a.gamesPlayed >= roundsTargetNum || b.gamesPlayed >= roundsTargetNum) {
      return { ok: false, reason: "Pelaaja on jo saanut kaikki turnauksen pelinsä." };
    }
    if (a.opponents.has(b.id)) return { ok: false, reason: "Tämä pari on jo heittänyt toisiaan vastaan — samaa vastustajaa ei saa kohdata kahdesti." };
    const pairRestriction = pairRestrictionMessage(a, b);
    if (pairRestriction) return { ok: false, reason: pairRestriction };
    if (!canCompleteRemaining(playersIn, boardsIn, [a.id, b.id], feasibilitySeedCounter++)) {
      return { ok: false, reason: `${a.name} vs ${b.name}: tämä pari juuri nyt voisi estää jonkun toisen pelaajan jäljellä olevat eri vastustajat. Odota pooliin lisää vapaita pelaajia tai valitse toinen pari.` };
    }
    return { ok: true };
  }

  // REM: Parhaan parin haku - ohjelman tekijä: Johannes Ketola
  // Picks the pair to start next: among currently free, legal (no rematch,
  // not forbidden) players, prefer the closest win/loss record (classic
  // Swiss), then prefer players who are furthest behind on games started so
  // nobody gets stuck waiting too long. Every candidate is verified against
  // the look-ahead safety net before it's accepted — the first one that
  // passes is used. If nothing within a 1-win gap is currently safe, the
  // gap is widened as a last resort rather than starting nothing at all
  // when a wider-gap game would have kept things moving; a true stall (no
  // safe pair at any gap) means the board correctly waits for the pool.
  // REM: requirePlayerId - ohjelman tekijä: Johannes Ketola
  // Also purely additive (6th parameter, default null, so every existing
  // call — including the two above — is unaffected). When set, only pairs
  // where ONE of the two members is exactly this player are considered at
  // all; the other slot is picked completely freely by the same scoring
  // and canCompleteRemaining feasibility check as always. This is what
  // powers "ehdota <pelaajalle> uutta vastustajaa": it pins one named
  // player in place and lets the untouched engine pick their best (still
  // fully turnaus-safe) replacement opponent.
  function findBestPair(playersIn, boardsIn, boardId = null, extraExcludeIds = null, excludePairKeys = null, requirePlayerId = null) {
    const busy = getBusyIds(boardsIn);
    const freeActive = playersIn.filter((p) =>
      !p.withdrawn && p.gamesPlayed < roundsTargetNum && !busy.has(p.id) && !(extraExcludeIds && extraExcludeIds.has(p.id))
    );
    if (freeActive.length < 2) return null;
    const counts = playersIn.map((p) => startedCount(p, busy));
    const minStarted = Math.min(...counts);

    function collectCandidates(strictGap) {
      const candidates = [];
      for (let i = 0; i < freeActive.length; i++) {
        for (let j = i + 1; j < freeActive.length; j++) {
          const a = freeActive[i], b = freeActive[j];
          if (requirePlayerId && a.id !== requirePlayerId && b.id !== requirePlayerId) continue;
          if (excludePairKeys && excludePairKeys.has(pairKey(a.id, b.id))) continue;
          if (boardId && pairBoardRestriction(a, b, boardId)) continue;
          if (a.opponents.has(b.id)) continue;
          if (pairRestrictionMessage(a, b)) continue;
          const winDiff = Math.abs(a.wins - b.wins);
          if (strictGap && winDiff > 1) continue;
          if (!strictGap && winDiff <= 1) continue; // already covered by the strict pass
          const ca = startedCount(a, busy), cb = startedCount(b, busy);
          const sameMin = (ca === minStarted ? 100000 : 0) + (cb === minStarted ? 100000 : 0);
          // True Swiss tiebreak: among players with an equal/near-equal win
          // count, prefer the pair that is currently closest together in
          // the actual standings — wins first, leg difference (legiero)
          // as the standings tiebreaker, exactly like the results table.
          // This replaces the old skill/speed-coefficient tiebreak, which
          // wasn't Swiss-based at all — it just tended to match strong
          // players together regardless of where they actually stood.
          const legDiffA = (a.legsFor || 0) - (a.legsAgainst || 0);
          const legDiffB = (b.legsFor || 0) - (b.legsAgainst || 0);
          const rankGap = Math.abs(legDiffA - legDiffB);
          candidates.push({ a, b, winDiff, score: sameMin - winDiff * 1000 - rankGap * 5 });
        }
      }
      candidates.sort((x, y) => y.score - x.score);
      return candidates;
    }

    for (const c of collectCandidates(true)) {
      if (canCompleteRemaining(playersIn, boardsIn, [c.a.id, c.b.id], feasibilitySeedCounter++)) return [c.a, c.b];
    }
    for (const c of collectCandidates(false)) {
      if (canCompleteRemaining(playersIn, boardsIn, [c.a.id, c.b.id], feasibilitySeedCounter++)) return [c.a, c.b];
    }
    return null;
  }

  function waveNotice(playersIn, boardsIn) {
    const busy = getBusyIds(boardsIn);
    const freeActive = playersIn.filter((p) => p.gamesPlayed < roundsTargetNum && !busy.has(p.id));

    if (freeActive.length < 2) {
      return "Vapaana ei ole kahta tarvittavaa pelaajaa. Odota nykyisten pelien päättymistä.";
    }
    const unfinished = playersIn.filter((p) => p.gamesPlayed < roundsTargetNum);
    if (unfinished.length === 0) {
      return "Kaikki turnauksen pelit on käynnistetty.";
    }
    return `Turvallista uutta paria ei löytynyt juuri nyt ${freeActive.length} vapaan pelaajan joukosta (kaikki mahdolliset parit joko toistaisivat aiemman kohtaamisen tai vaarantaisivat jonkun muun pelaajan loput pelit). Odota pooliin lisää vapaita pelaajia.`;
  }


  // REM: Pariteettivarmistus (yksi pelaaja jää yhden pelin vajaaksi) - ohjelman tekijä: Johannes Ketola
  // PURELY ADDITIVE: findBestPair / canStartPair / canCompleteRemaining above are
  // NOT modified. These wrappers only differ from them in ONE situation: when the
  // sum of every active player's remaining games is ODD (handshake lemma: then NO
  // algorithm can give everyone their full game count, e.g. after a DNF). In that
  // case the untouched oracle says "no" to every pair, so the board would stall.
  // Instead we let ONE player end a game short: the player (lowest wins first, so
  // the top of the standings is hurt least) is "bumped" (gamesPlayed + 1 on a
  // CLONE, original objects are never changed) and the untouched engine is asked
  // as usual - so no rematches, no forbidden pairs, no deadlocks for the others.
  // When the sum is EVEN these wrappers just call the original functions.
  function remainingNeedParityOdd(playersIn, boardsIn) {
    return activeNeedList(playersIn, boardsIn, null).reduce((s, x) => s + x.need, 0) % 2 !== 0;
  }

  function shortCandidateOrder(playersIn, boardsIn) {
    const needs = new Map(activeNeedList(playersIn, boardsIn, null).map((x) => [x.id, x.need]));
    return playersIn
      .filter((p) => needs.has(p.id))
      .sort((a, b) =>
        a.wins - b.wins ||
        ((a.legsFor || 0) - (a.legsAgainst || 0)) - ((b.legsFor || 0) - (b.legsAgainst || 0)) ||
        a.name.localeCompare(b.name, "fi-FI")
      )
      .map((p) => ({ p, need: needs.get(p.id) }));
  }

  function bumpPlayer(playersIn, id) {
    return playersIn.map((p) => (p.id === id ? { ...p, gamesPlayed: p.gamesPlayed + 1 } : p));
  }

  function findBestPairOrShort(playersIn, boardsIn, boardId = null, extraExcludeIds = null, excludePairKeys = null, requirePlayerId = null) {
    if (!remainingNeedParityOdd(playersIn, boardsIn)) {
      return findBestPair(playersIn, boardsIn, boardId, extraExcludeIds, excludePairKeys, requirePlayerId);
    }
    const byId = new Map(playersIn.map((p) => [p.id, p]));
    let tried = 0;
    for (const { p: s } of shortCandidateOrder(playersIn, boardsIn)) {
      const bumped = bumpPlayer(playersIn, s.id);
      if (!canCompleteRemaining(bumped, boardsIn, null, feasibilitySeedCounter++)) continue;
      const pair = findBestPair(bumped, boardsIn, boardId, extraExcludeIds, excludePairKeys, requirePlayerId);
      if (pair) return pair.map((p) => byId.get(p.id));
      if (++tried >= 8) break;
    }
    return null;
  }

  function canStartPairOrShort(a, b, playersIn, boardsIn) {
    const check = canStartPair(a, b, playersIn, boardsIn);
    if (check.ok) return check;
    if (!a || !b || a.id === b.id || a.withdrawn || b.withdrawn) return check;
    if (!remainingNeedParityOdd(playersIn, boardsIn)) return check;
    const busy = getBusyIds(boardsIn);
    if (busy.has(a.id) || busy.has(b.id)) return check;
    if (a.gamesPlayed >= roundsTargetNum || b.gamesPlayed >= roundsTargetNum) return check;
    if (a.opponents.has(b.id) || pairRestrictionMessage(a, b)) return check;
    for (const { p: s, need } of shortCandidateOrder(playersIn, boardsIn)) {
      if ((s.id === a.id || s.id === b.id) && need < 2) continue;
      if (canCompleteRemaining(bumpPlayer(playersIn, s.id), boardsIn, [a.id, b.id], feasibilitySeedCounter++)) {
        return { ok: true, short: true };
      }
    }
    return check;
  }

  // Käytetään jonovaroituksessa kun jäljellä olevien pelien summa on jo pariton
  // (esim. keskeytyksen jälkeen): onko turnaus vielä pelattavissa loppuun niin,
  // että VAIN YKSI pelaaja jää yhden pelin vajaaksi? Käyttää samaa "bump"-
  // tekniikkaa kuin findBestPairOrShort, eikä muuta moottoria.
  function canCompleteWithOneShort(playersIn, boardsIn, tentativePair) {
    for (const { p: s, need } of shortCandidateOrder(playersIn, boardsIn)) {
      if (tentativePair && (s.id === tentativePair[0] || s.id === tentativePair[1]) && need < 2) continue;
      if (canCompleteRemaining(bumpPlayer(playersIn, s.id), boardsIn, tentativePair, feasibilitySeedCounter++)) return true;
    }
    return false;
  }

  // REM: Turnauksen aloitus - ohjelman tekijä: Johannes Ketola
  const startTournament = () => {
    if (setupPlayers.length < 2) {
      warn("Lisää vähintään 2 pelaajaa ennen aloitusta.");
      return;
    }
    if (setupPlayers.length < roundsTargetNum + 1) {
      warn(`${roundsTargetNum} pelin turnaukseen tarvitaan vähintään ${roundsTargetNum + 1} pelaajaa, jotta jokaiselle voidaan taata eri vastustaja joka pelissä.`);
      return;
    }
    if (setupPlayers.length % 2 === 1 && roundsTargetNum % 2 === 1) {
      warn(`${setupPlayers.length} pelaajan ja ${roundsTargetNum} pelin yhdistelmä ei ole matemaattisesti mahdollinen: jokaiselle pitäisi tulla pariton määrä pelejä, mutta pelaajia on pariton määrä. Valitse parillinen pelimäärä tai parillinen pelaajamäärä.`);
      return;
    }
    if (!allSetupComplete) {
      warn("Anna jokaiselle pelaajalle sekä taito että nopeus ennen aloitusta.");
      return;
    }

    setupPlayers.forEach((p) => saveRosterPlayer(p.name, p.skill, p.speed, p.boardRestrictions));
    const basePlayers = setupPlayers.map((p) => { const l = tcLevelsFor(p.name, p.skill, p.speed); return makePlayer(p.name, Number(l.skill), Number(l.speed), 0, p.boardRestrictions, getForbiddenOpponentNames(p.name)); });
    const freshBoards = Array.from({ length: BOARD_COUNT }, (_, i) => ({
      id: i + 1,
      status: "free",
      p1: null,
      p2: null,
      disabled: !activeBoardNumbers.has(i + 1),
    }));

    pushHistory();
    setTourInfo((t) => ({ ...t, id: TCLink.randCode(10), date: t.date || tcToday() }));
    try { localStorage.setItem("triplacup-paikka", tourInfo.place || ""); } catch (e) {}
    setPlayers(basePlayers);
    setMatchLog([]);
    setBoards(freshBoards);
    setNotice("");
    setPhase("tournament");
  };

  const busyIds = useMemo(() => {
    return getBusyIds(boards);
  }, [boards, pairQueue]);

  // REM: Pelin päättäminen ja tuloksen kirjaus - ohjelman tekijä: Johannes Ketola
  // winnerSlot: 1 or 2 (which player won). legsFor/legsAgainst are the
  // WINNER's legs, so a 2-0 win is (2,0) and a 2-1 win is (2,1) — the loser
  // gets the mirror image. This gives every player a running leg
  // difference (legsWon - legsLost across all their games), used as the
  // tiebreaker in the standings exactly like goal difference in football:
  // same win count, higher leg difference ranks higher.
  const parseLegInput = (v) => {
    const t = String(v === undefined || v === null ? "" : v).trim();
    if (!/^\d{1,3}$/.test(t)) return null;
    return Number(t);
  };

  // Tuloksen kirjaus käsin: l1 = taulun p1:n legivoitot, l2 = p2:n legivoitot.
  // Mikä tahansa ei-negatiivinen tulos kelpaa. Voitto = 1 v (2 p), tasapeli =
  // 0,5 v (1 p) kummallekin, tappio = 0. wins-kenttä pysyy numerona, jota
  // paritusmoottori jo käyttää sellaisenaan.
  const finishGame = (boardId, l1, l2, tablet) => {
    const board = boards.find((b) => b.id === boardId);
    if (!board || board.status !== "playing") return;
    if (!Number.isInteger(l1) || !Number.isInteger(l2) || l1 < 0 || l2 < 0) {
      warn("Syötä kummallekin pelaajalle legivoitot (kokonaisluku 0 tai suurempi).");
      return;
    }
    if (l1 === 0 && l2 === 0) {
      warn("Tulos 0–0 ei kelpaa — syötä pelatut legit.");
      return;
    }
    const { p1, p2 } = board;
    const newTick = tick + 1;
    const updatedPlayers = players.map((p) => {
      if (p.id !== p1.id && p.id !== p2.id) return p;
      const isP1 = p.id === p1.id;
      const opponentId = isP1 ? p2.id : p1.id;
      const mine = isP1 ? l1 : l2;
      const theirs = isP1 ? l2 : l1;
      const newOpponents = new Set(p.opponents);
      newOpponents.add(opponentId);
      return {
        ...p,
        gamesPlayed: p.gamesPlayed + 1,
        wins: p.wins + (mine > theirs ? 1 : mine === theirs ? 0.5 : 0),
        legsFor: (p.legsFor || 0) + mine,
        legsAgainst: (p.legsAgainst || 0) + theirs,
        opponents: newOpponents,
        lastActionTick: newTick,
      };
    });
    const cur1 = players.find((p) => p.id === p1.id);
    const cur2 = players.find((p) => p.id === p2.id);
    const entry = {
      id: matchLog.reduce((m, e) => Math.max(m, e.id), 0) + 1,
      board: boardId,
      round: Math.max(cur1 ? cur1.gamesPlayed : 0, cur2 ? cur2.gamesPlayed : 0) + 1,
      p1Id: p1.id, p1Name: p1.name, p2Id: p2.id, p2Name: p2.name,
      l1, l2, at: Date.now(), edited: false,
      origin: board.origin || null, queueBy: board.queueBy || null, startedAt: board.startedAt || null,
      overrideMsg: board.overrideMsg || null, short: !!board.short,
      gameNo: board.gameNo || null,
    };
    if (tablet && Array.isArray(tablet.stats) && tablet.stats.length === 2) {
      const av = (x) => (x && x.darts > 0 ? Math.round((x.pts / x.darts) * 300) / 100 : null);
      const f9 = (x) => (x && x.f9d > 0 ? Math.round((x.f9p / x.f9d) * 300) / 100 : null);
      entry.stats = { avg1: av(tablet.stats[0]), avg2: av(tablet.stats[1]), f91: f9(tablet.stats[0]), f92: f9(tablet.stats[1]) };
      entry.tstats = tablet.stats;
    }
    if (tablet && tablet.sk) entry.sk = tablet.sk;
    if (tablet && tablet.tm) entry.tm = tablet.tm;
    if (tablet) entry.tablet = true;
    const freedBoards = boards.map((b) => (b.id === boardId ? { ...b, status: "free", p1: null, p2: null } : b));
    pushHistory();
    setPlayers(updatedPlayers);
    setBoards(freedBoards);
    setMatchLog((prev) => [...prev, entry]);
    if (offlineMode && !(tablet && entry.stats)) setStatsOpenId(entry.id);
    setScoreInputs((prev) => { const n = { ...prev }; delete n[boardId]; return n; });
    setTick(newTick);
    const activeLeft = updatedPlayers.filter((p) => p.gamesPlayed < roundsTargetNum);
    setNotice(activeLeft.length === 0 ? "Turnaus valmis — kaikki pelit pelattu." : "");
  };

  const submitBoardScore = (boardId) => {
    const inp = scoreInputs[boardId] || {};
    finishGame(boardId, parseLegInput(inp.a), parseLegInput(inp.b));
  };

  // OFFLINE TURNAUS: ottelun keskiarvojen syöttö ja tallennus ottelulokiin.
  const getStatsDraft = (m) => statsDrafts[m.id] || (m.stats ? statsDraftFromSaved(m) : statsBlankDraft());
  const changeStatsDraft = (m, field, value) => {
    setStatsDrafts((prev) => {
      const base = prev[m.id] || (m.stats ? statsDraftFromSaved(m) : statsBlankDraft());
      return { ...prev, [m.id]: { ...base, [field]: value } };
    });
  };
  const openStatsFor = (m) => setStatsOpenId(m.id);
  const closeStats = () => setStatsOpenId(null);
  const saveStats = (m) => {
    const d = getStatsDraft(m);
    const vals = { avg1: statsParse(d.avg1), avg2: statsParse(d.avg2), f91: statsParse(d.f91), f92: statsParse(d.f92) };
    const invalid = Object.keys(d).some((k) => String(d[k]).trim() !== "" && (vals[k] === null || vals[k] < 0 || vals[k] > 180));
    if (invalid) {
      warn("Keskiarvon pitää olla luku väliltä 0–180 (tai tyhjä).");
      return;
    }
    const hasAny = Object.values(vals).some((v) => v !== null);
    pushHistory();
    setMatchLog((prev) => prev.map((e) => {
      if (e.id !== m.id) return e;
      const { stats, ...rest } = e;
      return hasAny ? { ...rest, stats: vals } : rest;
    }));
    setStatsDrafts((prev) => { const n = { ...prev }; delete n[m.id]; return n; });
    setStatsOpenId(null);
    setNotice(hasAny ? "Keskiarvot tallennettu: " + m.p1Name + " – " + m.p2Name + "." : "");
  };

  // Ottelun tuloksen jälkikäteismuutos: korjataan pelaajien yhteissummat
  // erotuksena (vanha tulos pois, uusi sisään). Pelimäärät ja vastustajat
  // eivät muutu, joten paritusmoottorin tila pysyy ehjänä.
  const saveEditedMatch = (matchId) => {
    const m = matchLog.find((e) => e.id === matchId);
    if (!m) return;
    const n1 = parseLegInput(editScore.a);
    const n2 = parseLegInput(editScore.b);
    if (n1 === null || n2 === null || (n1 === 0 && n2 === 0)) {
      warn("Syötä kelvolliset legivoitot (kokonaisluvut, ei 0–0).");
      return;
    }
    const pTxt = [String(editScore.pa == null ? "" : editScore.pa).trim(), String(editScore.pb == null ? "" : editScore.pb).trim()];
    let mpts = m.mpts || null;
    if (!(m.tstats && swMatchPts(m))) {
      if (pTxt[0] === "" && pTxt[1] === "") mpts = null;
      else {
        const pnum = (t) => (/^\d{1,5}$/.test(t) ? Number(t) : null), pa = pnum(pTxt[0]), pb = pnum(pTxt[1]);
        if (pa === null || pb === null || pa > 99999 || pb > 99999) {
          warn("Syötä heitetyt pisteet kummallekin pelaajalle (kokonaisluvut) tai jätä molemmat tyhjiksi.");
          return;
        }
        mpts = [pa, pb];
      }
    }
    const legsChanged = n1 !== m.l1 || n2 !== m.l2;
    const w = (x, y) => (x > y ? 1 : x === y ? 0.5 : 0);
    pushHistory();
    setPlayers((prev) => prev.map((p) => {
      if (p.id !== m.p1Id && p.id !== m.p2Id) return p;
      const isP1 = p.id === m.p1Id;
      const oldM = isP1 ? m.l1 : m.l2, oldT = isP1 ? m.l2 : m.l1;
      const newM = isP1 ? n1 : n2, newT = isP1 ? n2 : n1;
      return {
        ...p,
        wins: p.wins - w(oldM, oldT) + w(newM, newT),
