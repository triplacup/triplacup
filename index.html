        legsFor: (p.legsFor || 0) - oldM + newM,
        legsAgainst: (p.legsAgainst || 0) - oldT + newT,
      };
    }));
    setMatchLog((prev) => prev.map((e) => {
      if (e.id !== matchId) return e;
      const { mpts: _old, ...rest } = e;
      const out = legsChanged ? { ...rest, l1: n1, l2: n2, edited: true, orig: e.orig || { l1: e.l1, l2: e.l2 } } : rest;
      return mpts ? { ...out, mpts } : out;
    }));
    setEditingMatchId(null);
    setNotice(legsChanged ? `Ottelun ${m.p1Name} – ${m.p2Name} tulos päivitetty: ${n1}–${n2}.` : `Ottelun ${m.p1Name} – ${m.p2Name} tiedot tallennettu.`);
  };

  // REM: Taulun määritys parille - ohjelman tekijä: Johannes Ketola
  // A game is started only by a human click. No automatic chain reaction.
  // The selected pair must satisfy the same hard constraints as every other
  // pairing; the manual mode cannot be used to create rematches or to break
  // the <=1 started-game gap. `knownPair`, when given, is the exact pair the
  // human was just shown (from the on-demand suggestion) — using it instead
  // of recomputing avoids ever starting a DIFFERENT pair than what was on
  // screen (which could otherwise happen if this board's suggestion had
  // been computed excluding a pair already shown on another board).
  // REM: Taulurajoitteet - ohjelman tekijä: Johannes Ketola
  // Täysin erillään paritusmoottorista: tarkistaa vain, estääkö jokin sääntö
  // parin käynnistämisen TÄLLE taululle juuri nyt (toinen pelaaja pelaa jo
  // sääntöön kuuluvalla toisella taululla). Moottoria ei muuteta; automaattiset
  // ehdotukset suodatetaan alla olevalla findBestPairForBoard()-kääreellä.
  // Oletustaulurajoite: voimassa oletuksena aina kun molemmat pelaajat ovat samassa turnauksessa
  // (vaikuttaa vain jos kumpikin pelaa). Turnauksen vetäjä voi poistaa sen paneelista.
  const DEFAULT_BOARD_CONFLICTS_ALL = [
    { id: "perm-leo-vertti", a: "Leo Löytänä", boardA: 1, b: "Vertti Lehtovuori", boardB: 2 },
    { id: "default-leo-otto", a: "Leo Löytänä", boardA: 1, b: "Otto Sjöström", boardB: 2 },
  ];
  const DEFAULT_BOARD_CONFLICTS = DEFAULT_BOARD_CONFLICTS_ALL.filter((r) => !disabledDefaultRules.includes(r.id));
  function crossBoardConflictMessage(a, b, boardId, boardsNow) {
    if (!boardId) return "";
    const key = (n) => normalizeRosterName(n);
    for (const r of [...DEFAULT_BOARD_CONFLICTS, ...boardConflicts]) {
      for (const p of [a, b]) {
        if (!p) continue;
        const pk = key(p.name);
        let otherKey, otherBoard, otherLabel;
        if (pk === key(r.a) && boardId === r.boardA) { otherKey = key(r.b); otherBoard = r.boardB; otherLabel = r.b; }
        else if (pk === key(r.b) && boardId === r.boardB) { otherKey = key(r.a); otherBoard = r.boardA; otherLabel = r.a; }
        else continue;
        const ob = boardsNow.find((x) => x.id === otherBoard);
        if (ob && ob.status === "playing" && [ob.p1, ob.p2].some((q) => q && key(q.name) === otherKey)) {
          return `${p.name.toUpperCase()} EI VOI HEITTÄÄ TAULULLA ${boardId}, KOSKA ${otherLabel.toUpperCase()} HEITTÄÄ TAULULLA ${otherBoard}.`;
        }
      }
    }
    return "";
  }

  // Kääre: kysyy moottorilta parasta paria ja jos se rikkoisi taulurajoitteen,
  // pyytää seuraavaa parasta (excludePairKeys on moottorin oma, jo olemassa oleva
  // parametri). Jokainen palautettu pari on siis edelleen moottorin oman
  // toteutettavuustarkistuksen läpäissyt. Jos kaikki jäljelle jäävät parit
  // rikkoisivat rajoitteen, ehdotusta ei anneta ennen kuin vapautuu taulu.
  // note.blocked = viesti jos ehdotus puuttuu juuri rajoitteen takia.
  function findBestPairForBoard(playersIn, boardsIn, boardId, extraExcludeIds = null, note = null) {
    const excluded = new Set();
    let firstBlocked = "";
    for (let i = 0; i < 80; i++) {
      const pair = findBestPairOrShort(playersIn, boardsIn, boardId, extraExcludeIds, excluded.size ? excluded : null);
      if (!pair) break;
      const msg = crossBoardConflictMessage(pair[0], pair[1], boardId, boardsIn);
      if (!msg) return pair;
      if (!firstBlocked) firstBlocked = msg;
      excluded.add(pairKey(pair[0].id, pair[1].id));
    }
    if (note && firstBlocked) note.blocked = firstBlocked;
    return null;
  }

  const addBoardConflict = () => {
    if (!ruleA || !ruleB || !ruleBoardA || !ruleBoardB) {
      warn("Valitse molemmat pelaajat ja molemmat taulut.");
      return;
    }
    if (normalizeRosterName(ruleA) === normalizeRosterName(ruleB)) {
      warn("Valitse kaksi eri pelaajaa.");
      return;
    }
    if (ruleBoardA === ruleBoardB) {
      warn("Taulujen pitää olla eri taulut (samalla taululla ei voi muutenkaan heittää kaksi peliä yhtä aikaa).");
      return;
    }
    const bA = Number(ruleBoardA), bB = Number(ruleBoardB);
    const exists = boardConflicts.some((r) =>
      (normalizeRosterName(r.a) === normalizeRosterName(ruleA) && r.boardA === bA && normalizeRosterName(r.b) === normalizeRosterName(ruleB) && r.boardB === bB) ||
      (normalizeRosterName(r.a) === normalizeRosterName(ruleB) && r.boardA === bB && normalizeRosterName(r.b) === normalizeRosterName(ruleA) && r.boardB === bA)
    );
    if (exists) {
      warn("Tämä taulurajoite on jo lisätty.");
      return;
    }
    pushHistory();
    setBoardConflicts((prev) => [...prev, { id: Date.now() + Math.random(), a: ruleA, boardA: bA, b: ruleB, boardB: bB }]);
    setNotice(`Taulurajoite lisätty: ${ruleA} taululla ${bA} ja ${ruleB} taululla ${bB} eivät voi heittää yhtä aikaa.`);
    setRuleA(""); setRuleB(""); setRuleBoardA(""); setRuleBoardB("");
  };
  const removeBoardConflict = (id) => {
    pushHistory();
    setBoardConflicts((prev) => prev.filter((r) => r.id !== id));
  };

  const renderBoardRules = (names) => {
    const sorted = [...names].sort((x, y) => x.localeCompare(y, "fi-FI", { sensitivity: "base" }));
    const boardOptions = [1, 2, 3, 4, 5, 6, 7];
    return (
      <div className="bg-[#122a1e] border border-[#2d4a37] rounded-lg p-4" data-testid="board-rules">
        <label className="text-sm font-semibold text-[#e7c977] block mb-1">Taulurajoitteet (kaksi pelaajaa ei voi heittää yhtä aikaa)</label>
        <p className="text-xs text-[#7a9484] mb-3">
          Esimerkiksi kun toinen heittää vasemmalta ja toinen oikealta. Täytä lause: jos ensimmäinen pelaaja heittää valitulla taululla, toinen pelaaja ei voi heittää toisella valitulla taululla. Sääntö toimii molempiin suuntiin. Muilla tauluilla ja muiden pelaajien kanssa mikään ei rajoitu.
        </p>
        <div className="space-y-2 text-sm">
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-[#a9c2ae] w-12">Jos</span>
            <select value={ruleA} onChange={(e) => setRuleA(e.target.value)} className={`${selectClass} flex-1 min-w-[10rem]`} data-testid="rule-a">
              <option value="">Pelaaja…</option>
              {sorted.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            <span className="text-[#a9c2ae]">heittää taululla</span>
            <select value={ruleBoardA} onChange={(e) => setRuleBoardA(e.target.value)} className={`${selectClass} w-24`} data-testid="rule-board-a">
              <option value="">Taulu</option>
              {boardOptions.map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-[#a9c2ae] w-12">niin</span>
            <select value={ruleB} onChange={(e) => setRuleB(e.target.value)} className={`${selectClass} flex-1 min-w-[10rem]`} data-testid="rule-b">
              <option value="">Pelaaja…</option>
              {sorted.filter((n) => n !== ruleA).map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            <span className="text-[#a9c2ae]">ei voi heittää taululla</span>
            <select value={ruleBoardB} onChange={(e) => setRuleBoardB(e.target.value)} className={`${selectClass} w-24`} data-testid="rule-board-b">
              <option value="">Taulu</option>
              {boardOptions.filter((n) => String(n) !== ruleBoardA).map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>
        </div>
        <button onClick={addBoardConflict} data-testid="rule-add"
          className="mt-3 bg-[#e7c977] text-[#0b1f16] font-semibold rounded px-4 py-2 text-xs hover:bg-[#f0da9c]">
          Lisää taulurajoite
        </button>
        {(boardConflicts.length > 0 || true) && (
          <div className="mt-3 space-y-1.5" data-testid="rule-list">
            {DEFAULT_BOARD_CONFLICTS.map((r) => (
              <div key={r.id} data-testid="rule-default" className="flex items-center justify-between gap-2 bg-[#0f2419] rounded px-3 py-2 text-sm">
                <span>
                  Jos <b>{r.a}</b> heittää taululla <b>{r.boardA}</b>, <b>{r.b}</b> ei voi heittää taululla <b>{r.boardB}</b>
                  <span className="text-[#7a9484]"> (ja päinvastoin)</span>
                  <span className="ml-2 text-[#e7c977] text-[10px] uppercase tracking-wide">Oletus</span>
                </span>
                <button onClick={() => { pushHistory(); setDisabledDefaultRules((prev) => [...prev, r.id]); }} data-testid="rule-default-remove" className="shrink-0 text-[#c98080] hover:text-[#e8a0a0] text-xs">Poista</button>
              </div>
            ))}
            {DEFAULT_BOARD_CONFLICTS_ALL.filter((r) => disabledDefaultRules.includes(r.id)).map((r) => (
              <div key={r.id} data-testid="rule-default-disabled" className="flex items-center justify-between gap-2 bg-[#0f2419] rounded px-3 py-2 text-xs text-[#7a9484]">
                <span>Oletusrajoite poistettu tästä turnauksesta: {r.a} (taulu {r.boardA}) / {r.b} (taulu {r.boardB})</span>
                <button onClick={() => { pushHistory(); setDisabledDefaultRules((prev) => prev.filter((x) => x !== r.id)); }} data-testid="rule-default-restore" className="shrink-0 text-[#8fd19e] text-xs">Palauta</button>
              </div>
            ))}
            {boardConflicts.map((r) => (
              <div key={r.id} className="flex items-center justify-between gap-2 bg-[#0f2419] rounded px-3 py-2 text-sm">
                <span>
                  Jos <b>{r.a}</b> heittää taululla <b>{r.boardA}</b>, <b>{r.b}</b> ei voi heittää taululla <b>{r.boardB}</b>
                  <span className="text-[#7a9484]"> (ja päinvastoin)</span>
                </span>
                <button onClick={() => removeBoardConflict(r.id)} className="shrink-0 text-[#c98080] hover:text-[#e8a0a0] text-xs">Poista</button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  const assignBoard = (boardId, knownPair = null) => {
    const board = boards.find((b) => b.id === boardId);
    if (!board || board.disabled || board.status !== "free") return;

    const pair = knownPair || findBestPairForBoard(players, boards, boardId);
    if (!pair) {
      warn(waveNotice(players, boards));
      return;
    }

    const [a, b] = pair;
    const restriction = pairBoardRestriction(a, b, boardId);
    if (restriction) {
      warn(restriction);
      return;
    }
    const crossMsg = crossBoardConflictMessage(a, b, boardId, boards);
    if (crossMsg) {
      setRestrictionOverride({ source: "manual", origin: "auto", boardId, aId: a.id, bId: b.id, message: crossMsg });
      warn(crossMsg);
      return;
    }
    const check = canStartPairOrShort(a, b, players, boards);
    if (!check.ok) {
      warn(check.reason);
      return;
    }

    const newBoards = boards.map((bd) => (bd.id === boardId ? { ...bd, status: "playing", p1: a, p2: b, origin: "auto", queueBy: null, startedAt: Date.now(), gameNo: swNextGameNo(boards, matchLog), overrideMsg: null, short: !!check.short } : bd));
    pushHistory();
    setPlayers((prev) => prev.map((p) =>
      p.id === a.id || p.id === b.id ? { ...p, lastActionTick: tick + 1 } : p
    ));
    setBoards(newBoards);
    setTick((t) => t + 1);
    setPreviewBoardOrder((prev) => prev.filter((id) => id !== boardId));
    if (check.short) {
      warn(`HUOM: yksi pelaaja jää tässä turnauksessa yhden pelin vajaaksi (${roundsTargetNum - 1}/${roundsTargetNum} peliä) — jäljellä olevien pelien määrä ei mene enää tasan. Kaikki muut pelaavat täyden pelimäärän.`);
    } else {
      setNotice("");
    }
  };

  // Instead of starting the automatically suggested pair right away, push
  // it into the pair queue for later — e.g. to give a player who just
  // finished a rest before throwing again. The engine's look-ahead safety
  // net treats a queued pair exactly like a game already in progress (see
  // getBusyIds/buildUsedPairSet above), so it will suggest someone else for
  // this board instead and will not try to pair either resting player with
  // anyone else until the queued game is started or removed.
  const deferSuggestedPair = (boardId, knownPair = null) => {
    const board = boards.find((b) => b.id === boardId);
    if (!board || board.disabled || board.status !== "free") return;
    const pair = knownPair || findBestPairForBoard(players, boards, boardId);
    if (!pair) {
      warn(waveNotice(players, boards));
      return;
    }
    const [a, b] = pair;
    const key = pairKey(a.id, b.id);
    if (pairQueue.some((q) => q.key === key)) {
      warn("Tämä pari on jo jonossa.");
      return;
    }
    pushHistory();
    setPairQueue((prev) => [...prev, { key, p1Id: a.id, p2Id: b.id, addedTick: tick, by: "auto" }]);
    setPreviewBoardOrder((prev) => prev.filter((id) => id !== boardId));
    setNotice(`${a.name} vs ${b.name} siirretty jonoon lepäämään. Automaattiparitus ehdottaa nyt jotain muuta paria tälle taululle.`);
  };

  // Explicitly ask for a suggestion on a specific free board — nothing is
  // computed or shown before this. This is the actual control that lets you
  // wait for the pool: a board with no request pending just says "Vapaa"
  // and does nothing on its own.
  const requestSuggestion = (boardId) => {
    setPreviewBoardOrder((prev) => (prev.includes(boardId) ? prev : [...prev, boardId]));
  };

  const cancelSuggestion = (boardId) => {
    setPreviewBoardOrder((prev) => prev.filter((id) => id !== boardId));
  };

  // Computes a suggestion for every board that currently has a pending
  // request, in the order they were requested — each later board excludes
  // the players already claimed by an earlier one in this same batch, so
  // checking several idle boards at once never shows the identical pair
  // repeated on all of them.
  const batchSuggestions = useMemo(() => {
    const result = new Map();
    result.notes = new Map();
    const claimed = new Set();
    previewBoardOrder.forEach((boardId) => {
      const board = boards.find((bd) => bd.id === boardId);
      if (!board || board.disabled || board.status !== "free") {
        result.set(boardId, undefined); // stale request, board no longer eligible
        return;
      }
      const note = {};
      const pair = findBestPairForBoard(players, boards, boardId, claimed, note);
      if (note.blocked) result.notes.set(boardId, note.blocked);
      result.set(boardId, pair);
      if (pair) {
        claimed.add(pair[0].id);
        claimed.add(pair[1].id);
      }
    });
    return result;
  }, [previewBoardOrder, players, boards, pairQueue, roundsTargetNum, boardConflicts]);

  const skipGame = (boardId) => {
    const board = boards.find((b) => b.id === boardId);
    if (!board || board.status !== "playing") return;
    const { p1, p2 } = board;
    const freedBoards = boards.map((b) => (b.id === boardId ? { ...b, status: "free", p1: null, p2: null } : b));
    pushHistory();
    setBoards(freedBoards);
    setNotice(`${p1.name} vs ${p2.name} siirretty myöhemmäksi. Käynnistä uusi peli "Peli tähän" -napista kun haluat.`);
  };

  // REM: Pelaajan lisäys kesken turnauksen - ohjelman tekijä: Johannes Ketola
  const addPlayerMidTournament = () => {
    const trimmed = newName.trim();
    if (!trimmed) {
      warn("Anna pelaajan nimi.");
      return;
    }
    if (!newSkill || !newSpeed) {
      warn("Anna sekä taito että nopeus uudelle pelaajalle.");
      return;
    }
    const saved = roster.find((r) => normalizeRosterName(r.name) === normalizeRosterName(trimmed));
    // REM: Korjaus (Johannes Ketola): uudelle pelaajalle annettava kieltoparitiedot,
    // REM: jotta esim. sukulaiskiellot toimivat myös kun pelaaja lisätään kesken turnauksen.
    const p = makePlayer(trimmed, Number(newSkill), Number(newSpeed), tick, saved?.boardRestrictions ?? defaultBoardRestrictionsForName(trimmed), getForbiddenOpponentNames(trimmed));
    saveRosterPlayer(trimmed, newSkill, newSpeed, saved?.boardRestrictions ?? defaultBoardRestrictionsForName(trimmed));
    saveRosterPlayer(trimmed, newSkill, newSpeed);
    // Pairing is fully dynamic now, so adding a player needs no schedule
    // rebuild — the look-ahead safety net simply takes the new player into
    // account on every future pairing decision automatically. We just do a
    // quick sanity check right away so a genuinely impossible addition (far
    // too late, with too few games left for everyone else) is reported
    // immediately instead of silently stalling later.
    const next = [...players, p];
    if (!canCompleteRemaining(next, boards, null, feasibilitySeedCounter++)) {
      warn("Uutta pelaajaa ei voitu lisätä turvallisesti kesken turnauksen tällä pelaajamäärällä ilman että turnauksen nykyinen paritusvarmuus rikkoutuisi.");
      return;
    }
    pushHistory();
    setPlayers(next);
    setNotice(`${trimmed} lisätty turvalliseen parituspooliin.`);
    setNewName("");
    setNewSkill("");
    setNewSpeed("");
  };

  // REM: Pelaajan poisto kesken turnauksen - ohjelman tekijä: Johannes Ketola
  const removePlayerMidTournament = (id) => {
    if (busyIds.has(id)) {
      warn("Pelaaja on kesken pelin — merkitse peli päättyneeksi tai ohita peli ennen poistoa.");
      return;
    }
    if (queuedPlayerIds.has(id)) {
      warn("Pelaaja on odottavassa parissa — poista pari ensin vuorojonosta.");
      return;
    }
    const removed = players.find((p) => p.id === id);
    if (!removed) return;
    pushHistory();
    setPlayers((prev) => prev.filter((p) => p.id !== id));
    setNotice(`${removed.name} poistettu turnauksesta.`);
  };

  // REM: Pelaajan keskeytys - ohjelman tekijä: Johannes Ketola
  // Player withdraws from the tournament (DNF). Unlike
  // removePlayerMidTournament (which fully deletes someone, e.g. to
  // correct a setup mistake), this KEEPS the player and their played
  // games/results — it just marks them so they never appear as a pairing
  // candidate again. This is intentionally the ONLY thing the flag does to
  // the engine: activeNeedList (the single source of truth every pairing
  // decision and the deadlock-proof feasibility oracle are built on)
  // excludes withdrawn players outright, exactly the same way it already
  // excludes anyone who has reached their target game count. Every other
  // guarantee (no rematches, no deadlocks) is completely unaffected for
  // the remaining players — see the withdrawal test suite.
  //
  // One thing withdrawal can genuinely do — not a bug, a hard mathematical
  // fact — is break the parity that guarantees everyone can still reach
  // their full target game count. Handshake lemma: the sum of every active
  // player's remaining games-needed must be EVEN for a complete pairing to
  // exist at all, no matter how clever the algorithm. Every completed game
  // reduces that sum by exactly 2, so it stays even by itself — but
  // withdrawal removes a player's remaining need from the sum in one go,
  // and if THAT need was odd, the sum flips to odd. When that happens no
  // algorithm can give 100% of the remaining players their full target;
  // some remaining player will end a game short unless another player in
  // the same odd-need situation also leaves. This is exactly why the
  // "UUSI PELAAJA TURNAUKSEEN" button exists right next to this one — but
  // it only actually restores parity when roundsTargetNum itself is ODD
  // (a fresh player's need is roundsTargetNum, so it only flips the sum's
  // parity when that number is odd). When roundsTargetNum is EVEN, adding
  // fresh players can never fix a parity break on its own (even + odd is
  // always odd) — this was verified directly (see withdrawal test suite).
  // So the honest, non-disruptive thing to do is detect this precisely and
  // say so, rather than pretend a fix is possible when it mathematically
  // isn't.
  const withdrawPlayer = (id) => {
    if (busyIds.has(id)) {
      warn("Pelaaja on kesken pelin — merkitse peli päättyneeksi tai ohita peli ennen keskeytystä.");
      return;
    }
    if (queuedPlayerIds.has(id)) {
      warn("Pelaaja on odottavassa parissa — poista pari ensin vuorojonosta ennen keskeytystä.");
      return;
    }
    const target = players.find((p) => p.id === id);
    if (!target) return;
    if (target.withdrawn) {
      warn(`${target.name} on jo merkitty keskeyttäneeksi.`);
      return;
    }
    pushHistory();
    const updatedPlayers = players.map((p) => (p.id === id ? { ...p, withdrawn: true } : p));
    setPlayers(updatedPlayers);
    setShowWithdrawPanel(false);

    const remainingNeeds = activeNeedList(updatedPlayers, boards, null);
    const sumNeed = remainingNeeds.reduce((sum, x) => sum + x.need, 0);
    if (sumNeed % 2 !== 0) {
      const rOdd = roundsTargetNum % 2 === 1;
      const guidance = rOdd
        ? " Koska kierrosmäärä on pariton, yhden UUDEN PELAAJAN lisääminen (UUSI PELAAJA TURNAUKSEEN) korjaa tilanteen todennäköisesti."
        : " Koska kierrosmäärä on parillinen, pelkkä yhden uuden pelaajan lisääminen EI korjaa tätä matemaattisesti — todennäköisesti yksi pelaaja jää lopulta yhden pelin vajaaksi, ellei myös toinen samanlaisessa tilanteessa oleva pelaaja poistu.";
      warn(`${target.name} merkitty keskeyttäneeksi (DNF). HUOM: yksi pelaaja jää lopulta yhden pelin vajaaksi (${roundsTargetNum - 1}/${roundsTargetNum} peliä) — muut pelaavat täyden pelimäärän, eikä sama vastustaja toistu. Paritus jatkuu normaalisti.${guidance}`);
    } else {
      setNotice(`${target.name} merkitty keskeyttäneeksi (DNF). Hän ei enää osallistu paritukseen — muihin pelaajiin tämä ei vaikuta.`);
    }
  };

  // REM: Kierrosmäärän muutos - ohjelman tekijä: Johannes Ketola
  // Changing the round count mid-tournament. This is safe by construction
  // for a reason worth spelling out: roundsTargetNum is derived fresh every
  // render from the roundsTarget piece of state (see `const roundsTargetNum
  // = Number(roundsTarget)` below), and EVERY engine function (findBestPair,
  // canStartPair, activeNeedList, canCompleteRemaining, startedCount) reads
  // it live from that same render's closure rather than having it baked in
  // anywhere. So simply calling setRoundsTarget() is enough to make every
  // future pairing decision use the new value — no engine code needed to
  // change at all for the "apply" half of this feature.
  //
  // The only thing actually built here is an HONEST feasibility check
  // BEFORE committing, using canCompleteRemaining/activeNeedList's new
  // optional roundsOverride parameter to trial the hypothetical new value
  // without touching live state first. Exactly like withdrawal, changing R
  // (especially lowering it) can break the handshake-lemma parity that
  // guarantees a full completion exists — this is checked and reported
  // honestly, but the change is never blocked: it's the operator's call,
  // consistent with how withdrawal works. Existing safeguards already
  // handle every downstream edge case for free: a player whose gamesPlayed
  // now exceeds/meets the new target is simply excluded from consideration
  // (identical code path to "already finished"/withdrawn), and a stale
  // queued pair referencing such a player is already cleaned up the next
  // time it's attempted (startQueuedPair's existing "already finished"
  // branch) — no new code needed for either.
  const changeRoundsTarget = (newValueStr) => {
    const newValue = Number(newValueStr);
    if (newValue === roundsTargetNum) {
      warn(`Kierrosmäärä on jo ${newValue}.`);
      return;
    }
    const feasible = canCompleteRemaining(players, boards, null, feasibilitySeedCounter++, newValue);
    const sumNeed = activeNeedList(players, boards, null, newValue).reduce((sum, x) => sum + x.need, 0);

    pushHistory();
    setRoundsTarget(newValueStr);
    setShowRoundsPanel(false);

    if (feasible) {
      setNotice(`Kierrosmäärä vaihdettu ${roundsTargetNum} → ${newValue}. Kaikki pelaajat voivat yhä turvallisesti saada täyden pelimäärän eri vastustajia vastaan.`);
      return;
    }
    if (sumNeed % 2 !== 0) {
      const rOdd = newValue % 2 === 1;
      const guidance = rOdd
        ? " Yhden pelaajan lisääminen (UUSI PELAAJA TURNAUKSEEN) korjaisi tämän todennäköisesti, koska uusi kierrosmäärä on pariton."
        : " Pelkkä yhden pelaajan lisääminen ei korjaa tätä matemaattisesti, koska uusi kierrosmäärä on parillinen — jonkun kannattaa varautua jäämään yhden pelin vajaaksi tai ylitse.";
      warn(`Kierrosmäärä vaihdettu ${roundsTargetNum} → ${newValue}. HUOM: tällä pelaajajoukolla ja nykytilanteella yksi pelaaja jää yhden pelin vajaaksi (${newValue - 1}/${newValue} peliä), koska jäljellä olevien pelien yhteissumma on pariton. Paritus jatkuu silti.${guidance}`);
    } else {
      warn(`Kierrosmäärä vaihdettu ${roundsTargetNum} → ${newValue}. HUOM: nykytilanteessa (esim. liian vähän jäljellä olevia eri vastustajia jollekulle) kaikkia pelaajia ei voida taata pääsevän tasan ${newValue} peliin — automaattiparitus tekee silti aina turvallisia päätöksiä, mutta joku saattaa jäädä vajaaksi.`);
    }
  };

  // REM: Pelaajan arvojen (taito/nopeus) muutos - ohjelman tekijä: Johannes Ketola
  // Temporarily change a player's skill/speed for THIS tournament only —
  // e.g. someone having a noticeably worse or better day than their usual
  // roster rating. Deliberately does NOT call saveRosterPlayer (the
  // function that writes to the persistent roster in localStorage), so the
  // roster itself is completely untouched — next time a fresh tournament
  // is started, players are built from setupPlayers/roster exactly as
  // before, with the original values. The only thing this touches is the
  // live `players` array for the CURRENT tournament, and it only lasts as
  // long as that array does: it naturally survives a crash-recovery reload
  // (same tournament resuming, which is desired) but disappears the moment
  // "Aloita täysin uusi turnaus" is used (fresh players array).
  //
  // Why this can't disturb the pairing engine: skill, speed and the
  // difficulty they combine into (skill * speed) are not read by
  // findBestPair, canStartPair, activeNeedList or canCompleteRemaining
  // anywhere — pairing is driven entirely by wins/legiero/opponents/
  // availability. skill/speed are purely informational at this point (the
  // T/N chips on a board, and the queue's "hitausluokka" indicator) — this
  // was verified directly (grepped every use in the file) and confirmed
  // with a dedicated test that pairing decisions are byte-identical before
  // and after a value change with everything else held equal.
  const changePlayerValues = (id, newSkillStr, newSpeedStr) => {
    const newSkill = Number(newSkillStr);
    const newSpeed = Number(newSpeedStr);
    if (!newSkill || !newSpeed) {
      warn("Valitse sekä taito että nopeus.");
      return;
    }
    const target = players.find((p) => p.id === id);
    if (!target) return;
    if (target.withdrawn) {
      warn(`${target.name} on keskeyttänyt eikä osallistu enää turnaukseen.`);
      return;
    }
    if (target.skill === newSkill && target.speed === newSpeed) {
      warn(`${target.name}: arvot ovat jo taito ${newSkill}, nopeus ${newSpeed}.`);
      return;
    }
    pushHistory();
    setPlayers((prev) => prev.map((p) =>
      p.id === id ? { ...p, skill: newSkill, speed: newSpeed, difficulty: newSkill * newSpeed, valOverride: true } : p
    ));
    setNotice(`${target.name}: taito ${target.skill}→${newSkill}, nopeus ${target.speed}→${newSpeed} tälle turnaukselle. Ei tallennu pysyvästi — seuraavassa turnauksessa arvot ovat taas alkuperäiset.`);
  };

  // Manual override: pick any two waiting players yourself and start that
  // exact game. This is the escape hatch for the rare case where the
  // automatic rules (games-diff max 1, no repeats) genuinely can't find a
  // valid pair — you decide, exactly like a human running the tournament
  // would.
  // REM: Käsin parittaminen ja jono - ohjelman tekijä: Johannes Ketola
  const [manualBoardId, setManualBoardId] = useState(null);
  // Suggestions are opt-in: nothing is proposed for a free board until the
  const [manualP1, setManualP1] = useState("");
  const [manualP2, setManualP2] = useState("");
  const [restrictionOverride, setRestrictionOverride] = useState(null);

  // Manuaalisesti rakennettu FIFO-jono tuleville peleille. Jonossa oleva
  // pelaaja varataan kyseiseen pariin, mutta peli ei vielä laske
  // käynnistetyksi ennen kuin pari siirretään vapautuneelle taululle.
  const [queueP1, setQueueP1] = useState("");
  const [queueP2, setQueueP2] = useState("");
  const [dragQueueKey, setDragQueueKey] = useState(null);
  const [dragOverQueueKey, setDragOverQueueKey] = useState(null);
  const [dragOverPosition, setDragOverPosition] = useState(null); // "before" | "after"

  // REM: Jonoehdotus - ohjelman tekijä: Johannes Ketola
  // "Ehdota paria jonoon" is a pure UI convenience layered on top of the
  // existing queue: it asks the SAME untouched findBestPair() engine (the
  // one boards already use for on-board suggestions) for its top pick,
  // shows it, and only ever adds it to pairQueue via the normal
  // addPairToQueue-style path if the person explicitly accepts it. It never
  // calls findBestPair with a boardId, so it's asking "what's the best pair
  // overall right now" — exactly the same question a free board with no
  // restrictions would ask. Nothing here changes findBestPair, boards, or
  // any other pairing logic; it only reads their output.
  // Holds either null (no active suggestion), the string "none" (a fresh
  // search found no safe pair at all), the string "none-more" ("ehdota
  // uutta paria" ran out of *different* safe pairs to offer), or { aId, bId }.
  const [queueSuggestion, setQueueSuggestion] = useState(null);
  // The exact a+b combinations already shown in this suggestion browsing
  // session (accumulated across repeated "ehdota uutta paria" clicks), as
  // pairKey strings — so the next pick is never the exact same combo again,
  // while either player individually can still reappear paired with
  // someone else. Passed as findBestPair's new, purely additive
  // `excludePairKeys` parameter (see findBestPair itself for details).
  const [queueSuggestionSeenPairKeys, setQueueSuggestionSeenPairKeys] = useState(null);

  const queuedPlayerIds = useMemo(() => {
    const ids = new Set();
    pairQueue.forEach((q) => {
      ids.add(q.p1Id);
      ids.add(q.p2Id);
    });
    return ids;
  }, [pairQueue]);

  // REM: Pariteettivaroitus (banneri) - ohjelman tekijä: Johannes Ketola
  const parityBroken = phase === "tournament" && remainingNeedParityOdd(players, boards);
  const unfinishedActive = players.filter((p) => !p.withdrawn && p.gamesPlayed < roundsTargetNum);
  const nothingRunning = !boards.some((b) => b.status === "playing") && pairQueue.length === 0;

  const queueWaitingPlayers = players
    .filter((p) => !p.withdrawn && !busyIds.has(p.id) && !queuedPlayerIds.has(p.id) && p.gamesPlayed < roundsTargetNum)
    .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.lastActionTick - b.lastActionTick || a.name.localeCompare(b.name, "fi-FI"));

  // "Kaikki heittäjät" — a deliberate escape hatch so the queue can be
  // pre-planned ahead of time: a pair can be queued even while one or both
  // players still have a game in progress right now. This is ONLY a manual
  // selection option (a submenu in the dropdown) — it never changes what
  // automatic pairing considers "free", and the default dropdown above
  // keeps showing only currently-free players exactly as before, so this
  // doesn't affect the normal flow at all. Only players not already queued
  // and not yet at their target game count (accounting for a game they're
  // CURRENTLY mid-way through, via startedCount) are offered — someone
  // already queued or already fully done never appears here either.
  const allThrowersForQueue = players
    .filter((p) => !p.withdrawn && !queuedPlayerIds.has(p.id) && startedCount(p, busyIds) < roundsTargetNum && busyIds.has(p.id))
    .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.lastActionTick - b.lastActionTick || a.name.localeCompare(b.name, "fi-FI"));

  // REM: Parijono - ohjelman tekijä: Johannes Ketola
  // Jaettu validointi sekä käsin valitulle parille (addPairToQueue) että
  // "TUO PELIPARIT" -tekstintuonnille (importGamePairsFromPaste) - täysin
  // samat turvatarkistukset molemmissa, joten kumpikaan reitti ei voi
  // koskaan lisätä jonoon paria jota manuaalinen "Lisää pari jonoon" ei
  // itsekin hyväksyisi. extraBusyIds on lisäjoukko pelaaja-id:itä jotka on
  // JO varattu SAMAN tuontierän aiemmissa pareissa (jotta yksi liitetty
  // teksti ei voi vahingossa varata samaa pelaajaa kahdesti, ennen kuin
  // pairQueue-tila on edes päivittynyt).
  function pairQueueRejectionReason(a, b, extraBusyIds) {
    if (!a || !b || a.id === b.id) return "Valitse kaksi eri pelaajaa.";
    if (queuedPlayerIds.has(a.id) || queuedPlayerIds.has(b.id) || (extraBusyIds && (extraBusyIds.has(a.id) || extraBusyIds.has(b.id)))) {
      return "Jonossa oleva pelaaja on jo varattu toiseen odottavaan pariin.";
    }
    // A pair currently playing EACH OTHER live on a board right now can't
    // also be queued as if it were a separate future match — opponents
    // only get recorded as "played" once the game finishes, so this needs
    // its own check against boards, not just a.opponents.
    const alreadyPlayingEachOther = boards.some((bd) =>
      bd.status === "playing" &&
      ((bd.p1.id === a.id && bd.p2.id === b.id) || (bd.p1.id === b.id && bd.p2.id === a.id))
    );
    if (alreadyPlayingEachOther) return "Tämä pari pelaa jo parhaillaan toisiaan vastaan.";
    // Busy players (mid-game right now) CAN be queued on purpose via the
    // "Kaikki heittäjät" option — that's exactly what lets you pre-plan
    // someone's next match while their current one is still running. Their
    // in-progress game still counts toward their target, so this uses
    // startedCount (gamesPlayed + 1 if currently playing), not the raw
    // gamesPlayed, to correctly catch someone who's about to reach their
    // target via the game they're currently playing.
    const busy = getBusyIds(boards);
    if (startedCount(a, busy) >= roundsTargetNum || startedCount(b, busy) >= roundsTargetNum) {
      return "Pelaaja on jo saanut (tai saamassa käynnissä olevasta pelistä) kaikki turnauksen pelinsä.";
    }
    if (a.opponents.has(b.id)) return "Tämä pari on jo pelannut toisiaan vastaan — samaa paria ei voi lisätä jonoon.";
    const pairRestriction = pairRestrictionMessage(a, b);
    if (pairRestriction) return pairRestriction;
    const key = pairKey(a.id, b.id);
    if (pairQueue.some((q) => q.key === key)) return "Tämä pari on jo jonossa.";
    return "";
  }

  const addPairToQueue = () => {
    if (!queueP1 || !queueP2 || queueP1 === queueP2) {
      warn("Valitse jonoon kaksi eri pelaajaa.");
      return;
    }
    const a = players.find((p) => p.id === Number(queueP1));
    const b = players.find((p) => p.id === Number(queueP2));
    if (!a || !b) return;

    const rejection = pairQueueRejectionReason(a, b);
    if (rejection) {
      // Kielletty pari (pairRestrictionMessage) on ainoa "pehmeä" este jonka
      // ihminen voi tietoisesti ohittaa - sama periaate kuin manuaalisessa
      // taulun parituksessa jo toimii. Muut esteet (jo jonossa, jo
      // pelannut, pelit täynnä) ovat kovia esteitä eikä niille näytetä
      // ohitusmahdollisuutta.
      if (rejection === pairRestrictionMessage(a, b)) {
        setRestrictionOverride({ source: "queueAdd", aId: a.id, bId: b.id, message: rejection });
      }
      warn(rejection);
      return;
    }
    // REM: Varoitus jos pari tekee turnauksesta mahdottoman - ohjelman tekijä: Johannes Ketola
    // Käyttää paritusmoottorin ENNALLAAN olevaa canCompleteRemaining()-funktiota
    // (ei muuta sitä): varoitetaan vain jos turnaus oli ennen lisäystä
    // pelattavissa loppuun täydellä pelimäärällä, mutta lisäyksen jälkeen ei.
    // Jos tilanne oli jo rikki (esim. keskeytys), banneri kertoo siitä jo.
    // Varoituksen voi ohittaa samalla painikkeella kuin kielletyn parin.
    const parityAlreadyBroken = remainingNeedParityOdd(players, boards);
    const okNow = parityAlreadyBroken
      ? canCompleteWithOneShort(players, boards, null)
      : canCompleteRemaining(players, boards, null, feasibilitySeedCounter++);
    const okWithPair = okNow && (parityAlreadyBroken
      ? canCompleteWithOneShort(players, boards, [a.id, b.id])
      : canCompleteRemaining(players, boards, [a.id, b.id], feasibilitySeedCounter++));
    if (okNow && !okWithPair) {
      const infeasibleMsg = parityAlreadyBroken
        ? `VAROITUS: pari ${a.name} vs ${b.name} saisi useamman kuin yhden pelaajan jäämään vajaaksi tai pysäyttäisi automaattiparituksen.`
        : `VAROITUS: pari ${a.name} vs ${b.name} tekisi turnauksen loppuunpelaamisesta mahdottoman — joku jäisi yhden pelin vajaaksi tai automaattiparitus pysähtyisi.`;
      setRestrictionOverride({ source: "queueAdd", kind: "infeasible", aId: a.id, bId: b.id, message: infeasibleMsg });
      warn(infeasibleMsg);
      return;
    }
    const key = pairKey(a.id, b.id);

    pushHistory();
    setPairQueue((prev) => [...prev, { key, p1Id: a.id, p2Id: b.id, addedTick: tick }]);
    setQueueP1("");
    setQueueP2("");
    setNotice("Pari lisätty vuorojonoon.");
  };

  // REM: Tuo peliparit liitetystä tekstistä - ohjelman tekijä: Johannes Ketola
  // Käyttää moduulitason findPlayersInPastedText()-funktiota (yllä, täysin
  // erillinen paritusmoottorista) löytääkseen liitetystä roskatekstistä
  // pelkät turnaukseen osallistuvat pelaajat ilmestymisjärjestyksessä,
  // muodostaa niistä peräkkäiset parit (1.+2., 3.+4., ...), ja ajaa JOKAISEN
  // parin läpi TÄSMÄLLEEN saman pairQueueRejectionReason()-tarkistuksen kuin
  // manuaalinen "Lisää pari jonoon" - eli mikään tämän kautta jonoon
  // päätyvä pari ei voi koskaan olla sellainen jota käsin lisääminen ei
  // hyväksyisi. Koko tuonti on yksi ainoa PERUUTA-askel.
  const importGamePairsFromPaste = () => {
    const { rowMode, groups } = findPlayerGroupsInPastedText(importPairsText, players);
    const matchedTotal = groups.reduce((s, g) => s + g.length, 0);
    if (matchedTotal === 0) {
      warn("Liitetystä tekstistä ei tunnistettu yhtään turnaukseen osallistuvaa pelaajaa.");
      return;
    }

    const accepted = [];
    const skipped = [];
    const leftovers = [];
    const stagedIds = new Set();
    groups.forEach((g) => {
      for (let i = 0; i + 1 < g.length; i += 2) {
        const a = g[i];
        const b = g[i + 1];
        const rejection = pairQueueRejectionReason(a, b, stagedIds);
        if (rejection) {
          skipped.push(`${a.name} vs ${b.name} (${rejection})`);
          continue;
        }
        accepted.push({ key: pairKey(a.id, b.id), p1Id: a.id, p2Id: b.id, addedTick: tick });
        stagedIds.add(a.id);
        stagedIds.add(b.id);
      }
      if (g.length % 2 === 1) leftovers.push(g[g.length - 1]);
    });

    if (accepted.length > 0) {
      pushHistory();
      setPairQueue((prev) => [...prev, ...accepted]);
    }
    setImportPairsText("");
    setShowImportPairsPanel(false);

    const parts = [];
    parts.push(`${accepted.length} paria lisätty vuorojonoon tuonnista.`);
    if (leftovers.length > 0) {
      const names = leftovers.map((p) => p.name).join(", ");
      parts.push(
        rowMode
          ? `${names} jäi ilman paria (rivillä tunnistettiin vain yksi turnauksen pelaaja — vastustaja ei ole mukana turnauksessa tai nimi ei täsmää).`
          : `${names} jäi ilman paria (pariton määrä tunnistettuja pelaajia).`
      );
    }
    if (skipped.length > 0) parts.push(`${skipped.length} paria ohitettiin: ${skipped.join("; ")}`);
    const summary = parts.join(" ");
    if (accepted.length === 0 || skipped.length > 0 || leftovers.length > 0) {
      warn(summary);
    } else {
      setNotice(summary);
    }
  };

  const removePairFromQueue = (queueKey) => {
    pushHistory();
    setPairQueue((prev) => prev.filter((q) => q.key !== queueKey));
  };

  // REM: Jonoehdotuksen pyyntö/hyväksyntä/hylkäys - ohjelman tekijä: Johannes Ketola
  // Asks the untouched findBestPair() engine for its top pick for the
  // queue (no boardId → same "best pair overall" question a free board
  // without board restrictions would ask). getBusyIds()/findBestPair()
  // already treat every player currently in pairQueue as busy (see
  // getBusyIds above), so this automatically avoids double-booking anyone
  // already queued — no separate exclusion logic needed here.
  const clearQueueSuggestion = () => {
    setQueueSuggestion(null);
    setQueueSuggestionSeenPairKeys(null);
  };

  const requestQueueSuggestion = () => {
    const pair = findBestPairOrShort(players, boards, null);
    if (!pair) {
      setQueueSuggestion("none");
      setQueueSuggestionSeenPairKeys(null);
      return;
    }
    const [a, b] = pair;
    setQueueSuggestion({ aId: a.id, bId: b.id });
    setQueueSuggestionSeenPairKeys(null);
  };

  // REM: Ehdota uutta paria / Ehdota <pelaajalle> uutta vastustajaa - ohjelman tekijä: Johannes Ketola
  // One shared helper for all three "give me something different" actions:
  // still the exact same findBestPair() call as the initial suggestion —
  // same engine, same underlying question — just with the exact a+b
  // combination already shown added to findBestPair's `excludePairKeys`
  // argument (so that precise combo is never repeated), and optionally a
  // `requirePlayerId` to pin one specific player in place while the engine
  // freely finds their best remaining opponent. Passing requirePlayerId as
  // null (the generic "Ehdota uutta paria" button) lets both sides change.
  // findBestPair's own matching, scoring and canCompleteRemaining
  // safety-feasibility check are 100% untouched by any of this — every
  // pair it can still return is just as guaranteed-safe as the first
  // suggestion was.
  //
  // findBestPair returns its pair in whatever internal order it found them
  // in — it has no notion of "left" or "right" on screen. When a specific
  // player is being kept (requirePlayerId), we place THAT player back into
  // the exact same slot (aId/bId, i.e. left/right) they already occupied,
  // so the kept player visually stays put and only the replaced player's
  // side changes — this is purely how the result is written into display
  // state, not a change to which pair the engine picks.
  const requestQueueSuggestionVariant = (requirePlayerId = null) => {
    if (!queueSuggestion || queueSuggestion === "none" || queueSuggestion === "none-more") return;
    const seenPairKeys = new Set(queueSuggestionSeenPairKeys || []);
    seenPairKeys.add(pairKey(queueSuggestion.aId, queueSuggestion.bId));
    const pair = findBestPairOrShort(players, boards, null, null, seenPairKeys, requirePlayerId);
    if (!pair) {
      setQueueSuggestion("none-more");
      setQueueSuggestionSeenPairKeys(null);
      return;
    }
    const [x, y] = pair;
    let newAId, newBId;
    if (requirePlayerId && queueSuggestion.aId === requirePlayerId) {
      newAId = requirePlayerId;
      newBId = x.id === requirePlayerId ? y.id : x.id;
    } else if (requirePlayerId && queueSuggestion.bId === requirePlayerId) {
      newBId = requirePlayerId;
      newAId = x.id === requirePlayerId ? y.id : x.id;
    } else {
      newAId = x.id;
      newBId = y.id;
    }
    setQueueSuggestion({ aId: newAId, bId: newBId });
    setQueueSuggestionSeenPairKeys(seenPairKeys);
  };
  const requestAnotherQueueSuggestion = () => requestQueueSuggestionVariant(null);
  const requestNewOpponentForQueueSuggestion = (keepPlayerId) => requestQueueSuggestionVariant(keepPlayerId);


  const rejectQueueSuggestion = () => {
    clearQueueSuggestion();
  };

  // Accepting a suggestion pushes it into pairQueue through the exact same
  // guard checks addPairToQueue uses for a manually-picked pair (re-checked
  // fresh here, in case something changed in the moment between the
  // suggestion being computed and accepted) — it does not bypass any of
  // the existing safety checks, it just fills them in from the suggestion
  // instead of from the two dropdowns.
  const acceptQueueSuggestion = () => {
    if (!queueSuggestion || queueSuggestion === "none" || queueSuggestion === "none-more") return;
    const a = players.find((p) => p.id === queueSuggestion.aId);
    const b = players.find((p) => p.id === queueSuggestion.bId);
    if (!a || !b) {
      clearQueueSuggestion();
      return;
    }
    const busy = getBusyIds(boards);
    if (queuedPlayerIds.has(a.id) || queuedPlayerIds.has(b.id)) {
      warn("Ehdotettu pelaaja on ehditty jo varata toiseen pariin — pyydä uusi ehdotus.");
      clearQueueSuggestion();
      return;
    }
    const alreadyPlayingEachOther = boards.some((bd) =>
      bd.status === "playing" &&
      ((bd.p1.id === a.id && bd.p2.id === b.id) || (bd.p1.id === b.id && bd.p2.id === a.id))
    );
    if (alreadyPlayingEachOther) {
      warn("Tämä pari pelaa jo parhaillaan toisiaan vastaan.");
      clearQueueSuggestion();
      return;
    }
    if (startedCount(a, busy) >= roundsTargetNum || startedCount(b, busy) >= roundsTargetNum) {
      warn("Pelaaja on jo saanut (tai saamassa käynnissä olevasta pelistä) kaikki turnauksen pelinsä.");
      clearQueueSuggestion();
      return;
    }
    if (a.opponents.has(b.id)) {
      warn("Tämä pari on jo pelannut toisiaan vastaan.");
      clearQueueSuggestion();
      return;
    }
    const pairRestriction = pairRestrictionMessage(a, b);
    if (pairRestriction) {
      warn(pairRestriction);
      clearQueueSuggestion();
      return;
    }
    const key = pairKey(a.id, b.id);
    if (pairQueue.some((q) => q.key === key)) {
      warn("Tämä pari on jo jonossa.");
      clearQueueSuggestion();
      return;
    }

    pushHistory();
    setPairQueue((prev) => [...prev, { key, p1Id: a.id, p2Id: b.id, addedTick: tick, by: "auto" }]);
    clearQueueSuggestion();
    setNotice(`${a.name} vs ${b.name} lisätty vuorojonoon ehdotuksesta.`);
  };

  // Drag-and-drop reorder. Laptop-only feature (native HTML5 drag and
  // drop — no touch support needed, this app is only used on laptops).
  // `position` is "before" or "after" the target row, decided by which
  // half of the row the cursor is over when dropped — this is what makes
  // it possible to drop something as the actual LAST item (drop on the
  // bottom half of the last row), not just always "above" the target.
  // Reuses the exact same pairQueue state and pushHistory() as the
  // button-based reorder above, so undo behaves identically either way.
  const reorderQueuePairByDrag = (draggedKey, targetKey, position) => {
    if (!draggedKey || draggedKey === targetKey) return;
    pushHistory();
    setPairQueue((prev) => {
      const fromIdx = prev.findIndex((q) => q.key === draggedKey);
      if (fromIdx === -1) return prev;
      const next = [...prev];
      const [item] = next.splice(fromIdx, 1);
      let toIdx = next.findIndex((q) => q.key === targetKey);
      if (toIdx === -1) return prev;
      if (position === "after") toIdx += 1;
      next.splice(toIdx, 0, item);
      return next;
    });
  };

  const startQueuedPair = (boardId) => {
    const board = boards.find((b) => b.id === boardId);
    const queued = pairQueue[0];
    if (!board || board.disabled || board.status !== "free" || !queued) return;

    const a = players.find((p) => p.id === queued.p1Id);
    const b = players.find((p) => p.id === queued.p2Id);
    if (!a || !b) {
      pushHistory();
      setPairQueue((prev) => prev.slice(1));
      warn("Jonon ensimmäinen pari ei ollut enää saatavilla ja poistettiin jonosta.");
      return;
    }

    const boardBusy = getBoardBusyIds(boards);
    if (boardBusy.has(a.id) || boardBusy.has(b.id)) {
      warn("Jonon ensimmäinen pari ei ole vielä kokonaan vapaa.");
      return;
    }
    if (a.gamesPlayed >= roundsTargetNum || b.gamesPlayed >= roundsTargetNum) {
      pushHistory();
      setPairQueue((prev) => prev.slice(1));
      warn("Jonon ensimmäinen pari on jo pelannut kaikki turnauksen pelinsä ja poistettiin jonosta.");
      return;
    }
    if (a.opponents.has(b.id)) {
      pushHistory();
      setPairQueue((prev) => prev.slice(1));
      warn("Jonon ensimmäinen pari oli jo kohdannut toisensa ja poistettiin jonosta.");
      return;
    }
    const pairRestriction = pairRestrictionMessage(a, b);
    if (pairRestriction) {
      setRestrictionOverride({ source: "queuePair", boardId, aId: a.id, bId: b.id, message: pairRestriction });
      warn(pairRestriction);
      return;
    }

    const restriction = pairBoardRestriction(a, b, boardId);
    if (restriction) {
      setRestrictionOverride({ source: "queue", boardId, aId: a.id, bId: b.id, message: restriction });
      warn(restriction);
      return;
    }
    const crossMsgQ = crossBoardConflictMessage(a, b, boardId, boards);
    if (crossMsgQ) {
      setRestrictionOverride({ source: "queue", boardId, aId: a.id, bId: b.id, message: crossMsgQ });
      warn(crossMsgQ);
      return;
    }

    const newBoards = boards.map((bd) =>
      bd.id === boardId ? { ...bd, status: "playing", p1: a, p2: b, origin: "queue", queueBy: queued.by || "manual", startedAt: Date.now(), gameNo: swNextGameNo(boards, matchLog), overrideMsg: null, short: false } : bd
    );
    pushHistory();
    setPlayers((prev) => prev.map((p) =>
      p.id === a.id || p.id === b.id ? { ...p, lastActionTick: tick + 1 } : p
    ));
    setBoards(newBoards);
    setPairQueue((prev) => prev.slice(1));
    setPreviewBoardOrder((prev) => prev.filter((id) => id !== boardId));
    setTick((t) => t + 1);
    setNotice("Jonon ensimmäinen pari käynnistetty.");
  };

  // Undoes a game that was just started — puts the pair back at the FRONT
  // of the queue instead of losing the fact that they were about to play.
  // Safe to do at any point before a winner is picked: starting a game
  // doesn't touch gamesPlayed/opponents/wins at all (those only change in
  // finishGame), so there is nothing to roll back on the player side —
  // this just frees the board again and re-queues the exact same pair.
  const undoBoardToQueue = (boardId) => {
    const board = boards.find((b) => b.id === boardId);
    if (!board || board.status !== "playing") return;
    const { p1, p2 } = board;
    const key = pairKey(p1.id, p2.id);
    pushHistory();
    setBoards((prev) => prev.map((b) => (b.id === boardId ? { ...b, status: "free", p1: null, p2: null } : b)));
    setPairQueue((prev) => (prev.some((q) => q.key === key) ? prev : [{ key, p1Id: p1.id, p2Id: p2.id, addedTick: tick, by: (board.origin === "auto" || board.queueBy === "auto") ? "auto" : "manual" }, ...prev]));
    setNotice(`${p1.name} vs ${p2.name} peruttu — pari on nyt jonon kärjessä.`);
  };

  // REM: Käsin valittu pari - ohjelman tekijä: Johannes Ketola
  const startManualPair = () => {
    if (!manualP1 || !manualP2 || manualP1 === manualP2) {
      warn("Valitse kaksi eri pelaajaa.");
      return;
    }
    const a = players.find((p) => p.id === Number(manualP1));
    const b = players.find((p) => p.id === Number(manualP2));
    if (!a || !b) return;

    // MANUAALINEN PARI = ihmisen päätös.
    // Tässä tilassa ei käytetä automaattisen parittajan kierros-, Swiss-,
    // suunniteltu pari- tai tulevaisuuskelpoisuusrajoitteita.
    // Ainoat ehdottomat säännöt: kaksi eri pelaajaa, molemmat vapaina,
    // pelaajalla ei ole pelit täynnä, eikä sama pari ole kohdannut aiemmin.
    const busy = getBusyIds(boards);
    if (busy.has(a.id) || busy.has(b.id)) {
      warn("Pelaaja on jo käynnissä olevassa pelissä.");
      return;
    }
    if (a.gamesPlayed >= roundsTargetNum || b.gamesPlayed >= roundsTargetNum) {
      warn("Pelaaja on jo saanut kaikki turnauksen pelinsä.");
      return;
    }
    if (a.opponents.has(b.id)) {
      warn("Tämä pari on jo pelannut toisiaan vastaan — samaa paria ei voi käynnistää uudelleen.");
      return;
    }

    const pairRestriction = pairRestrictionMessage(a, b);
    if (pairRestriction) {
      setRestrictionOverride({ source: "manualPair", boardId: manualBoardId, aId: a.id, bId: b.id, message: pairRestriction });
      warn(pairRestriction);
      return;
    }

    const restriction = pairBoardRestriction(a, b, manualBoardId);
    if (restriction) {
      setRestrictionOverride({ source: "manual", boardId: manualBoardId, aId: a.id, bId: b.id, message: restriction });
      warn(restriction);
      return;
    }
    const crossMsgM = crossBoardConflictMessage(a, b, manualBoardId, boards);
    if (crossMsgM) {
      setRestrictionOverride({ source: "manual", boardId: manualBoardId, aId: a.id, bId: b.id, message: crossMsgM });
      warn(crossMsgM);
      return;
    }

    const newBoards = boards.map((bd) =>
      bd.id === manualBoardId ? { ...bd, status: "playing", p1: a, p2: b, origin: "manual", queueBy: null, startedAt: Date.now(), gameNo: swNextGameNo(boards, matchLog), overrideMsg: null, short: false } : bd
    );
    pushHistory();
    setPlayers((prev) => prev.map((p) =>
      p.id === a.id || p.id === b.id ? { ...p, lastActionTick: tick + 1 } : p
    ));
    setBoards(newBoards);
    setTick((t) => t + 1);
    setManualBoardId(null);
    setManualP1("");
    setManualP2("");
    setNotice("");
  };

  const applyRestrictionOverride = () => {
    if (!restrictionOverride) return;
    const { boardId, aId, bId, source } = restrictionOverride;

    // REM: Kielletyn parin ohitus jonoon lisättäessä - ohjelman tekijä: Johannes Ketola
    // Oma haara "queueAdd"-lähteelle: TÄMÄ EI koske mitään taulua, joten se
    // käsitellään erikseen ennen alla olevaa taulu-pohjaista logiikkaa (joka
    // on vain manuaaliselle SUORAAN TAULULLE käynnistämiselle). Kaikki muut
    // esteet kuin juuri se kielletty-pari-viesti, jonka ihminen näki ja
    // tietoisesti hyväksyi, tarkistetaan TUOREENA uudelleen samalla
    // pairQueueRejectionReason()-funktiolla kuin tavallinen "Lisää pari
    // jonoon" - jos jokin MUU este on ilmaantunut sillä välin (esim.
    // pelaaja ehti varautua toiseen pariin), ohitus hylätään ja käyttäjä
    // saa nähdä sen uuden, oikean syyn. Tämä ei koske paritusmoottoria
    // (findBestPair/canCompleteRemaining) millään tavalla - moottori
    // välttää edelleen aina kiellettyjä pareja omissa ehdotuksissaan.
    if (source === "queueAdd") {
      const a = players.find((p) => p.id === aId);
      const b = players.find((p) => p.id === bId);
      if (!a || !b) {
        setRestrictionOverride(null);
        warn("Rajoituksen ohitusta ei voitu tehdä, koska pelaaja ei ole enää käytettävissä.");
        return;
      }
      const rejection = pairQueueRejectionReason(a, b);
      if (rejection && rejection !== restrictionOverride.message) {
        setRestrictionOverride(null);
        warn(rejection);
        return;
      }
      pushHistory();
      setPairQueue((prev) => [...prev, { key: pairKey(a.id, b.id), p1Id: a.id, p2Id: b.id, addedTick: tick }]);
      setQueueP1("");
      setQueueP2("");
      setRestrictionOverride(null);
      setNotice(`Rajoitus ohitettu: ${a.name} vs ${b.name} lisätty vuorojonoon.`);
      return;
    }

    const board = boards.find((b) => b.id === boardId);
    const a = players.find((p) => p.id === aId);
    const b = players.find((p) => p.id === bId);
    if (!board || board.disabled || board.status !== "free" || !a || !b) {
      setRestrictionOverride(null);
      warn("Rajoituksen ohitusta ei voitu tehdä, koska taulu tai pelaaja ei ole enää käytettävissä.");
      return;
    }

    // KORJAUS (jonosta käynnistys): kun pari käynnistetään JONOSTA (source
    // "queue" / "queuePair"), pari on itse jonossa, joten getBusyIds() (joka
    // laskee myös jonossa olevat varatuiksi) hylkäsi sen aina "pelaaja on jo
    // käynnissä olevassa pelissä" -> peli ei käynnistynyt ja pari jäi jonoon.
    // Jonolähteellä tarkistetaan siksi vain TAULUILLA pelaavat (kuten
    // startQueuedPair tekee), ja pari poistetaan jonosta vain jos se on yhä siellä.
    const fromQueue = source === "queue" || source === "queuePair";
    const sameQueuedPair = (q) => (q.p1Id === a.id && q.p2Id === b.id) || (q.p1Id === b.id && q.p2Id === a.id);
    if (fromQueue && !pairQueue.some(sameQueuedPair)) {
      setRestrictionOverride(null);
      warn("Pari ei ole enää jonossa, joten sitä ei käynnistetty.");
      return;
    }
    const busy = fromQueue ? getBoardBusyIds(boards) : getBusyIds(boards);
    if (busy.has(a.id) || busy.has(b.id)) {
      setRestrictionOverride(null);
      warn("Pelaaja on jo käynnissä olevassa pelissä.");
      return;
    }
    if (a.gamesPlayed >= roundsTargetNum || b.gamesPlayed >= roundsTargetNum) {
      setRestrictionOverride(null);
      warn("Pelaaja on jo saanut kaikki turnauksen pelinsä.");
      return;
    }
    if (a.opponents.has(b.id)) {
      setRestrictionOverride(null);
      warn("Tämä pari on jo pelannut toisiaan vastaan — samaa paria ei voi käynnistää uudelleen.");
      return;
    }

    const ovOrigin = restrictionOverride.origin || (fromQueue ? "queue" : "manual");
    const ovQueued = fromQueue ? pairQueue.find(sameQueuedPair) : null;
    const ovQueueBy = fromQueue ? ((ovQueued && ovQueued.by) || "manual") : null;
    const newBoards = boards.map((bd) =>
      bd.id === boardId ? { ...bd, status: "playing", p1: a, p2: b, origin: ovOrigin, queueBy: ovQueueBy, startedAt: Date.now(), gameNo: swNextGameNo(boards, matchLog), overrideMsg: restrictionOverride.message || null, short: false } : bd
    );
    pushHistory();
    setPlayers((prev) => prev.map((p) =>
      p.id === a.id || p.id === b.id ? { ...p, lastActionTick: tick + 1 } : p
    ));
    setBoards(newBoards);
    if (fromQueue) setPairQueue((prev) => prev.filter((q) => !sameQueuedPair(q)));
    setTick((t) => t + 1);
    setRestrictionOverride(null);
    setManualBoardId(null);
    setManualP1("");
    setManualP2("");
    setNotice(`Rajoitus ohitettu: ${a.name} vs ${b.name} käynnistetty taululla ${boardId}.`);
  };

  // REM: Odottavat pelaajat ja tulostaulukko - ohjelman tekijä: Johannes Ketola
  const waitingPlayers = players
    .filter((p) => !p.withdrawn && !busyIds.has(p.id) && p.gamesPlayed < roundsTargetNum)
    .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.lastActionTick - b.lastActionTick);

  // MANUAALISEN PARIN VALINTA: nimet aina aakkosjärjestyksessä etunimen
  // mukaan, riippumatta pelimäärästä, voittojen määrästä tai siitä milloin
  // pelaaja vapautui.
  const manualWaitingPlayers = [...waitingPlayers].sort((a, b) =>
    a.name.localeCompare(b.name, "fi-FI", { sensitivity: "base" })
  );

  const finishedPlayers = players.filter((p) => !p.withdrawn && p.gamesPlayed >= roundsTargetNum);
  const showAvgs = offlineMode || matchLog.some((m) => m.stats);
  const offlineAvgs = showAvgs ? offlinePlayerAverages(matchLog) : null;
  // Tasapelit johdetaan ottelulokista; wins sisältää niistä puoli voittoa (1 piste)
  // paritusmoottoria varten, mutta näytetään aina kokonaisina voittoina + T-sarakkeena.
  const drawsByPlayer = {};
  matchLog.forEach((m) => {
    if (m.l1 === m.l2) {
      drawsByPlayer[m.p1Id] = (drawsByPlayer[m.p1Id] || 0) + 1;
      drawsByPlayer[m.p2Id] = (drawsByPlayer[m.p2Id] || 0) + 1;
    }
  });
  const anyDraw = Object.keys(drawsByPlayer).length > 0;
  const winsOf = (p) => (p.wins || 0) - (drawsByPlayer[p.id] || 0) / 2;
  // REM: Turnausarkiston tallennus - ohjelman tekijä: Johannes Ketola
  const tournamentFinished = players.length > 0 && matchLog.length > 0
    && !boards.some((b) => b.status === "playing")
    && pairQueue.length === 0 && swAllDone(players, roundsTargetNum);

  const buildArchiveRecord = (name, existing) => ({
    format: "darts-parittaja-archive",
    version: 1,
    id: existing ? existing.id : archiveNewId(),
    name,
    savedAt: Date.now(),
    finished: tournamentFinished,
    roundsTarget: roundsTargetNum,
    offlineMode,
    tieBreak: tieMode,
    tid: tourInfo.id, tname: tcTourName(tourInfo), tourDate: tourInfo.date || "", place: tourInfo.place || "",
    boardsUsed: [...activeBoardNumbers].sort((a, b) => a - b),
    forbiddenPairs: setupForbiddenPairs
      .filter((x) => players.some((p) => normalizeRosterName(p.name) === normalizeRosterName(x.p1)) && players.some((p) => normalizeRosterName(p.name) === normalizeRosterName(x.p2)))
      .map((x) => ({ p1: x.p1, p2: x.p2 })),
    boardRules: [...DEFAULT_BOARD_CONFLICTS, ...boardConflicts].map((r) => ({ a: r.a, boardA: r.boardA, b: r.b, boardB: r.boardB })),
    players: players.map((p) => ({
      id: p.id, name: p.name, skill: p.skill, speed: p.speed, gamesPlayed: p.gamesPlayed,
      wins: p.wins, legsFor: p.legsFor || 0, legsAgainst: p.legsAgainst || 0, withdrawn: !!p.withdrawn,
    })),
    matches: matchLog.map((m) => ({ ...m })),
    running: boards.filter((b) => b.status === "playing" && b.p1 && b.p2).map((b) => ({
      board: b.id, p1Name: b.p1.name, p2Name: b.p2.name, origin: b.origin || null, queueBy: b.queueBy || null,
      startedAt: b.startedAt || null, overrideMsg: b.overrideMsg || null, short: !!b.short,
    })),
    queue: pairQueue.map((q) => {
      const x = players.find((p) => p.id === q.p1Id), y = players.find((p) => p.id === q.p2Id);
      return { p1Name: x ? x.name : "?", p2Name: y ? y.name : "?", by: q.by || "manual" };
    }),
  });

  const defaultArchiveName = () => {
    if (tourInfo.name && tourInfo.name.trim()) return tourInfo.name.trim() + (tourInfo.date ? " " + tcFmtDate(tourInfo.date) : "");
    const d = new Date();
    return TCI.tr(`Turnaus ${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()} (${players.length} pelaajaa)`);
  };

  // Tallentaa (tai päivittää saman turnauksen aiemman tallenteen). Palauttaa true jos onnistui.
  const saveToArchive = (name, silent) => {
    if (players.length === 0) return false;
    // Käyttäjä on poistanut tämän turnauksen arkistosta: ei luoda sitä uudelleen
    // automaattisesti (vain käsin Tallenna-painikkeella).
    if (silent && archiveId === "deleted") return false;
    const list = loadArchive();
    const existing = archiveId && archiveId !== "deleted" ? list.find((r) => r.id === archiveId) : null;
    const rec = buildArchiveRecord((name || (existing && existing.name) || defaultArchiveName()).trim(), existing);
    const next = existing ? list.map((r) => (r.id === existing.id ? rec : r)) : [rec, ...list];
    if (!saveArchive(next)) {
      if (!silent) warn("Arkistointi epäonnistui: selaimen muisti ei ole käytettävissä.");
      return false;
    }
    setArchiveId(rec.id);
    setArchiveCount(next.length);
    if (!silent) setNotice(`Turnaus tallennettu arkistoon: "${rec.name}". Löydät sen painikkeesta Turnausarkisto.`);
    return true;
  };

  // Valmistuessaan turnaus tallentuu arkistoon automaattisesti (päivittää saman tallenteen jos sellainen on).
  const prevFinishedRef = React.useRef(tournamentFinished);
  useEffect(() => {
    const was = prevFinishedRef.current;
    prevFinishedRef.current = tournamentFinished;
    if (!tournamentFinished) return;
    const recordExists = archiveId && archiveId !== "deleted" && loadArchive().some((r) => r.id === archiveId);
    if (!was || recordExists) saveToArchive(null, true);
  }, [tournamentFinished, matchLog, tieMode]);

  // Sarjataulukko: pisteet, legiero, valittu vertailu (Buchholz / Sonneborn-Berger / piste-ero), voitetut legit,
  // pelimäärä, nimi. Vain näyttöjärjestys, ei vaikuta paritukseen (ks. tb_calc.js).
  const tieCalc = swTieCalc(players, matchLog, tieMode);
  const standings = swTieSort(players, tieCalc);


  // REM: Triplacup-liitos: tabletit, isot näytöt, tilastot ja palkinnot - ohjelman tekijä: Johannes Ketola
  // Tabletti saa taululle käynnistetyn pelin (pelaajat ja ottelusäännöt) ja lähettää vahvistetun tuloksen,
  // joka kirjataan täsmälleen kuten käsin syötetty tulos (finishGame). Keskiarvot menevät ottelulokiin.
  useEffect(() => { try { localStorage.setItem(SW_RULES_KEY, JSON.stringify(tcRules)); } catch (e) {} }, [tcRules]);
  const [pilvi, setPilvi] = useState(() => loadPilvi());
  useEffect(() => { try { localStorage.setItem(PILVI_KEY, JSON.stringify(pilvi)); } catch (e) {} }, [pilvi]);
  const [srvInfo, setSrvInfo] = useState(null);
  useEffect(() => {
    if (!onLocalServer()) return;
    fetch("/api/info", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((i) => { if (i && i.port) setSrvInfo(i); }).catch(() => {});
  }, []);
  const swLink = useMemo(() => makeLink(pilvi, srvInfo), [pilvi.mode, pilvi.code, srvInfo]);
  useEffect(() => { CUR_LINK = swLink; if (swLink) pushSavedSoon(); }, [swLink]);
  const swLang = useTcLang();
  const [swState, swOk] = useLinkState(swLink, phase === "tournament");
  const [swMsg, setSwMsg] = useState("");
  const [swMsv, setSwMsv] = useState(null);
  useEffect(() => { if (pilvi.mode === "pilvi") TCMirror.start(pilvi.code, pilvi.view); }, [pilvi.mode, pilvi.code, pilvi.view]);
  useEffect(() => { if (pilvi.mode === "pilvi" && phase === "tournament") TCMirror.k(swState); }, [swState, phase, pilvi.mode]);
  const swAssign = useMemo(() => {
    const bs = {};
    boards.forEach((b) => {
      if (b.status !== "playing" || !b.p1 || !b.p2) return;
      bs[b.id] = { key: swKey(b), matchId: b.gameNo || 0, no: b.gameNo || "", p1: b.p1.name, p2: b.p2.name, label: "", at: b.startedAt || null,
        start: tcRules.start, bo: tcRules.bo, tb: tcRules.tb ? tcRules.tbDarts : 0 };
    });
    const cfg = { start: tcRules.start, tb: tcRules.tb ? tcRules.tbDarts : 0, lang: swLang, mode: "swiss" };
    return { cfg, boards: bs, v: TCLink.hash(JSON.stringify({ cfg, boards: bs })) };
  }, [boards, tcRules, swLang]);
  const swLastPush = React.useRef(0);
  // turnaus ei ole käynnissä: tableteilta pois edellisen turnauksen pelit
  useEffect(() => {
    if (!swLink || phase === "tournament" || tcModeRunning("tripla")) return;
    const cfg = { start: tcRules.start, tb: tcRules.tb ? tcRules.tbDarts : 0, lang: swLang, mode: "swiss" };
    swLink.reset({ cfg, boards: {}, v: TCLink.hash(JSON.stringify({ cfg, boards: {} })) }).catch(() => {});
  }, [swLink, phase, swLang]);
  useEffect(() => {
    if (!swLink || phase !== "tournament") return;
    swLastPush.current = Date.now();
    swLink.assign(swAssign).catch(() => {});
  }, [swAssign.v, swLink, phase]);
  useEffect(() => {
    if (!swState || !swLink || phase !== "tournament") return;
    if ((!swState.assign || swState.assign.v !== swAssign.v) && Date.now() - swLastPush.current > 4000) {
      swLastPush.current = Date.now();
      swLink.assign(swAssign).catch(() => {});
    }
    // yksi tulos kerrallaan: kirjaus päivittää pelaajien tilan, seuraava tulos käsitellään sen jälkeen
    const results = swState.result || {};
    let done = false;
    Object.keys(results).forEach((bid) => {
      const res = results[bid];
      const b = boards.find((x) => x.id === Number(bid));
      const ok = b && b.status === "playing" && b.p1 && b.p2 && res && res.key === swKey(b) && (res.winner === 0 || res.winner === 1);
      if (ok) {
        if (done) return;
        done = true;
        const legs = res.legs || [0, 0];
        const l1 = Number(legs[0]) || 0, l2 = Number(legs[1]) || 0;
        finishGame(b.id, l1, l2, { stats: res.stats, sk: res.me || res.msk ? res.key : null, tm: res.tm || null });
        if (TcLevels.addMatch(res)) {
          setRoster((prev) => tcLevelsOverlay(prev));
          setPlayers((prev) => prev.map((p) => {
            if (p.valOverride || p.withdrawn) return p;
            const l = tcLevelsFor(p.name, p.skill, p.speed), sk = Number(l.skill), sp = Number(l.speed);
            return sk && sp && (sk !== p.skill || sp !== p.speed) ? { ...p, skill: sk, speed: sp, difficulty: sk * sp } : p;
          }));
        }
        TCMS.fromResult(res, swLink);
        setSwMsg(`📱 Taulu ${b.id}: ${res.winner === 0 ? b.p1.name : b.p2.name} voitti ${Math.max(l1, l2)}–${Math.min(l1, l2)}`);
      }
      swLink.ack(bid).catch(() => {});
    });
  }, [swState]);
  const swDevDot = (b) => {
    if (b.disabled || !swLink || swLink.mode !== "pilvi") return null;
    const d = swState && swState.dev && swState.dev[String(b.id)];
    const on = d && Date.now() - (Number(d.t) || 0) < 60000;
    return <span className={`text-[10px] ${on ? "text-[#8fd19e]" : "text-[#5c7566]"}`} title={on ? "Taulun tabletti on yhteydessä" : "Taululle ei ole valittu tablettia"}>{on ? "📱 ●" : "📱 ○"}</span>;
  };
  // REM: Kausi: valmiin turnauksen tulokset kauden listaan (päivittyy, jos tuloksia muokataan; kumottu valmistuminen poistaa)
  useEffect(() => { try { localStorage.setItem("triplacup-kausi-viimeisin", seasonId || ""); } catch (e) {} }, [seasonId]);
  useEffect(() => {
    if (phase !== "tournament" || !tourInfo || !tourInfo.id) return;
    if (!tournamentFinished || !seasonId) { TcSeasons.removeTour(tourInfo.id); return; }
    const rows = tcSwissSeasonRows(players, matchLog, tieMode);
    TcSeasons.record(seasonId, { tid: tourInfo.id, name: tcTourName(tourInfo), date: tourInfo.date || tcToday(), place: tourInfo.place || "", at: tcLastMatchAt(matchLog) || Date.now(), n: rows.length, rows });
  }, [tournamentFinished, matchLog, seasonId, tieMode, players, phase, tourInfo]);
  const swTopPanels = (
    <>
      <SeasonPicker seasonId={seasonId} setSeasonId={setSeasonId} compact finished={tournamentFinished} tid={tourInfo.id} />
      <details className="mb-4 bg-[#122a1e] border border-[#2d4a37] rounded-lg">
        <summary className="cursor-pointer select-none px-3 py-2.5 text-sm font-semibold text-[#e7c977]">⚙ Ottelusäännöt <span className="font-normal text-xs text-[#a9c2ae] ml-2">{swRulesLine(tcRules)} · muuta tästä</span></summary>
        <div className="px-3 pb-3"><SwissRulesEditor rules={tcRules} setRules={setTcRules} running /></div>
      </details>
      <TabletPanel link={swLink} srvOk={swOk} srvInfo={srvInfo} pilvi={pilvi} setPilvi={setPilvi} kirjaus={tcRules} srvMsg={swMsg} swiss />
    </>
  );
  const swStatsPanel = (
    <SwissStatsSection players={players} matchLog={matchLog} roundsTarget={roundsTargetNum} finished={tournamentFinished} />
  );

  // REM: Ulkoasun apuluokat - ohjelman tekijä: Johannes Ketola
  const chipClass = (val) => {
    const base = "inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold";
    const colors = { 1: "bg-emerald-900 text-emerald-200", 2: "bg-amber-900 text-amber-200", 3: "bg-rose-900 text-rose-200" };
    return `${base} ${colors[val]}`;
  };

  const selectClass =
    "bg-[#0b1f16] border border-[#3a5c46] rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-[#e7c977] w-full";

  // REM: Käyttöliittymä (JSX) alkaa - ohjelman tekijä: Johannes Ketola
  return (
    <div className="min-h-screen bg-[#0b1f16] text-[#f2ede1] font-sans">
      <div className="max-w-5xl mx-auto px-5 py-8">
        {/* REM: Ylätunniste - ohjelman tekijä: Johannes Ketola */}
        <header className="mb-6 border-b border-[#2d4a37] pb-5">
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <div className="flex items-baseline gap-3">
              <span className="text-3xl">🎯</span>
              <h1 className="text-2xl font-bold tracking-tight" style={{ fontFamily: "Georgia, serif" }}>
                Triplacup
              </h1>
              <LangSwitch className="self-center" />
              <span className="self-center text-[11px] font-semibold uppercase tracking-wider text-[#8fd19e] border border-[#2d6a45] rounded px-2 py-1">🔄 Kiihdytetty sveitsiläinen</span>
              <button onClick={() => setShowArchive(true)} data-testid="arch-open-btn"
                className="text-xs text-[#e7c977] border border-[#6b5a2a] hover:bg-[#2a2410] rounded px-2 py-1">
                📚 Turnausarkisto{archiveCount > 0 ? ` (${archiveCount})` : ""}
              </button>
              {phase === "tournament" && (
                <button onClick={() => { setSaveName(((loadArchive().find((r) => r.id === archiveId) || {}).name) || defaultArchiveName()); setSaveDialogOpen((v) => !v); }} data-testid="arch-save-btn"
                  className={`text-xs rounded px-2 py-1 border ${tournamentFinished ? "bg-[#e7c977] text-[#0b1f16] border-[#e7c977] font-semibold" : "text-[#8fd19e] border-[#2d6a45] hover:bg-[#12301f]"}`}>
                  💾 Tallenna turnaus
                </button>
              )}
            </div>
            {(phase === "tournament" || setupPlayers.length > 0) && (
              <div className="flex items-center gap-2">
                <button
                  onClick={undoLastAction}
                  disabled={history.length === 0}
                  className="text-xs text-[#5b9bd5] hover:text-[#7fb4e3] border border-[#2c4a63] hover:bg-[#132537] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent rounded px-2 py-1"
                  title="Peruuta viimeisin toiminto (esim. väärä voittotulos)"
                >
                  ↩ Peruuta
                </button>
                {!confirmReset ? (
                  <button
                    onClick={() => setConfirmReset(true)}
                    className="text-xs text-[#c98080] hover:text-[#e8a0a0] border border-[#5c2d2d] hover:bg-[#2a1414] rounded px-2 py-1"
                  >
                    Aloita täysin uusi turnaus
                  </button>
                ) : (
                  <div className="flex items-center gap-2 bg-[#2a1414] border border-[#c98080] rounded px-2 py-1">
                    <span className="text-xs text-[#e8a0a0]">Poistetaanko käynnissä oleva turnaus? (Se tallentuu ensin arkistoon.)</span>
                    <button
                      onClick={() => {
                        if (matchLog.length > 0) saveToArchive(null, true);
                        clearSavedSession();
                        window.location.reload();
                      }}
                      data-testid="reset-confirm"
                      className="text-xs font-semibold bg-[#c98080] text-[#0b1f16] rounded px-2 py-1"
                    >
                      Kyllä, aloita uusi
                    </button>
                    <button
                      onClick={() => setConfirmReset(false)}
                      className="text-xs text-[#a9c2ae] border border-[#5c7566] rounded px-2 py-1"
                    >
                      Peruuta
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>
          {phase === "tournament" && (
            <div className="mt-3 pt-3 border-t border-[#2d4a37] flex items-center gap-2 flex-wrap">
              <button
                onClick={() => { setShowImportPairsPanel((v) => !v); setShowWithdrawPanel(false); setShowAddPlayerPanel(false); setShowRoundsPanel(false); setShowValuesPanel(false); }}
                title="Liitä esim. tulospalvelun raakatekstiä - ohjelma poimii siitä turnauksen pelaajien nimet ja muodostaa niistä parit jonoon. Tarkoitettu pääasiassa ensimmäisen kierroksen käynnistämiseen."
                className="bg-[#8a6d1f] hover:bg-[#a17f24] text-white font-bold rounded px-3 py-2 text-xs tracking-wide"
              >
                TUO PELIPARIT
              </button>
              <button
                onClick={() => { setShowWithdrawPanel((v) => !v); setShowAddPlayerPanel(false); setShowRoundsPanel(false); setShowValuesPanel(false); setShowImportPairsPanel(false); }}
                className="bg-[#7a2e2e] hover:bg-[#8f3838] text-white font-bold rounded px-3 py-2 text-xs tracking-wide"
              >
                PELAAJA KESKEYTTÄÄ
              </button>
              <button
                onClick={() => { setShowAddPlayerPanel((v) => !v); setShowWithdrawPanel(false); setShowRoundsPanel(false); setShowValuesPanel(false); setShowImportPairsPanel(false); }}
                className="bg-[#2d5a3a] hover:bg-[#356b46] text-white font-bold rounded px-3 py-2 text-xs tracking-wide"
              >
                UUSI PELAAJA TURNAUKSEEN
              </button>
              <button
                onClick={() => { setShowRoundsPanel((v) => !v); setShowWithdrawPanel(false); setShowAddPlayerPanel(false); setShowValuesPanel(false); setShowImportPairsPanel(false); }}
                className="bg-[#2c4a63] hover:bg-[#355a78] text-white font-bold rounded px-3 py-2 text-xs tracking-wide"
              >
                MUUTA KIERROSMÄÄRÄÄ
              </button>
              <button

                    const slownessColor = slowness === 3 ? "text-[#e8a0a0]" : slowness === 2 ? "text-[#e7c977]" : "text-[#8fd19e]";

                    const showDropLineBefore = q.key === dragOverQueueKey && dragOverPosition === "before" && dragQueueKey && dragQueueKey !== q.key;

                          setDragQueueKey(q.key);

                          // Some browsers need data set to allow the drag to start at all.
                          e.dataTransfer.setData("text/plain", q.key);
                        }}
                        onDragOver={(e) => {
                          e.preventDefault();
                          e.dataTransfer.dropEffect = "move";
                          // Which half of the row the cursor is over decides
                          // whether the dragged pair lands above or below
                          // this row — this is what makes dropping on the
                          // BOTTOM half of the last row correctly place it
                          // last, instead of always landing above the target.
                          const rect = e.currentTarget.getBoundingClientRect();
                          const position = e.clientY < rect.top + rect.height / 2 ? "before" : "after";
                          if (dragOverQueueKey !== q.key) setDragOverQueueKey(q.key);
                          if (dragOverPosition !== position) setDragOverPosition(position);
                        }}
                        onDragLeave={() => {
                          setDragOverQueueKey((prev) => (prev === q.key ? null : prev));

                        onDrop={(e) => {

                          setDragOverQueueKey(null);
                          setDragOverPosition(null);

                          setDragOverPosition(null);
