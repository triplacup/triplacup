                    <tbody>
                      {standings.map((p, i) => {
                        const legDiff = (p.legsFor || 0) - (p.legsAgainst || 0);
                        return (
                          <tr key={p.id} className={`${i % 2 === 0 ? "bg-[#0f2419]" : "bg-[#0b1f16]"} ${p.withdrawn ? "opacity-60" : ""}`}>
                            <td className="px-3 py-1.5 whitespace-nowrap">
                              {p.name}
                              {p.withdrawn && (
                                <span className="ml-2 inline-block bg-[#5c2d2d] text-[#e8a0a0] text-[10px] font-semibold rounded px-1.5 py-0.5">DNF</span>
                              )}
                            </td>
                            <td className="px-2 py-1.5 text-right font-semibold text-[#e7c977]">{fmtW(winsOf(p))}</td>
                            {anyDraw && <td className="px-2 py-1.5 text-right text-[#a9c2ae]" data-testid={`draw-${p.id}`}>{drawsByPlayer[p.id] || 0}</td>}
                            <td className="px-2 py-1.5 text-right text-[#a9c2ae]">{p.legsFor || 0}</td>
                            <td className="px-2 py-1.5 text-right text-[#a9c2ae]">{p.legsAgainst || 0}</td>
                            <td className="px-2 py-1.5 text-right text-[#a9c2ae]">{legDiff > 0 ? `+${legDiff}` : legDiff}</td>
                            <td className="px-2 py-1.5 text-right font-semibold text-[#e7c977]">{p.wins * 2}</td>
                            <td className="px-2 py-1.5 text-right text-[#a9c2ae]" data-testid={`bh-${p.id}`}>{swTieFmt(tieCalc, p.id)}</td>
                            <td className="px-3 py-1.5 text-right text-[#a9c2ae]">{p.gamesPlayed}/{roundsTargetNum}</td>
                            {showAvgs && <td className="px-2 py-1.5 text-right text-[#a9c2ae]" data-testid={`ka-${p.id}`}>{offlineAvgs[p.id] && offlineAvgs[p.id].ka != null ? statsFmt(offlineAvgs[p.id].ka) : "–"}</td>}
                            {showAvgs && <td className="px-2 py-1.5 text-right text-[#a9c2ae]" data-testid={`e9-${p.id}`}>{offlineAvgs[p.id] && offlineAvgs[p.id].e9 != null ? statsFmt(offlineAvgs[p.id].e9) : "–"}</td>}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {tieMode === "pd" && tieCalc.missing > 0 && (
                  <p className="text-[11px] text-[#c9a86a] mt-1.5" data-testid="pd-missing">{`Piste-ero: pisteet puuttuvat ${tieCalc.missing} peliltä (käsin kirjatut). Lisää ne kohdasta Muokkaa tulosta.`}</p>
                )}
              </div>
            </div>

            {swStatsPanel}
            {swMsv && <TcMatchStatsModal sk={swMsv.sk} title={swMsv.title} onClose={() => setSwMsv(null)} />}
            <div className="mt-6" data-testid="match-log">
              <h3 className="text-sm font-semibold text-[#e7c977] mb-2">Pelatut ottelut ({matchLog.length})</h3>
              {matchLog.length === 0 ? (
                <p className="text-xs text-[#5c7566] italic">Ei vielä kirjattuja tuloksia.</p>
              ) : (
                <div className="space-y-1">
                  {matchLog.slice().reverse().map((m) => (
                    <div key={m.id} data-testid={`match-${m.id}`} className="bg-[#122a1e] border border-[#2d4a37] rounded px-3 py-2 text-sm">
                      {editingMatchId === m.id ? (
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-xs text-[#a9c2ae]">#{m.id} · Taulu {m.board}</span>
                          <span className="font-medium">{m.p1Name}</span>
                          <input type="number" min="0" data-testid="edit-a" value={editScore.a}
                            onChange={(e) => setEditScore((p) => ({ ...p, a: e.target.value }))}
                            className="w-16 bg-[#0b1f16] border border-[#3a5c46] rounded px-2 py-1 text-center" />
                          <span>:</span>
                          <input type="number" min="0" data-testid="edit-b" value={editScore.b}
                            onChange={(e) => setEditScore((p) => ({ ...p, b: e.target.value }))}
                            className="w-16 bg-[#0b1f16] border border-[#3a5c46] rounded px-2 py-1 text-center" />
                          <span className="font-medium">{m.p2Name}</span>
                          {!(m.tstats && swMatchPts(m)) && (
                            <span className="inline-flex items-center gap-1.5 text-xs text-[#a9c2ae] basis-full sm:basis-auto" title="Heitetyt pisteet yhteensä koko ottelussa (piste-eroa varten). Voi jättää tyhjäksi.">
                              Heitetyt pisteet
                              <input type="number" min="0" data-testid="edit-pa" value={editScore.pa || ""} placeholder="–"
                                onChange={(e) => setEditScore((p) => ({ ...p, pa: e.target.value }))}
                                className="w-20 bg-[#0b1f16] border border-[#3a5c46] rounded px-2 py-1 text-center text-sm text-[#f2ede1]" />
                              –
                              <input type="number" min="0" data-testid="edit-pb" value={editScore.pb || ""} placeholder="–"
                                onChange={(e) => setEditScore((p) => ({ ...p, pb: e.target.value }))}
                                className="w-20 bg-[#0b1f16] border border-[#3a5c46] rounded px-2 py-1 text-center text-sm text-[#f2ede1]" />
                            </span>
                          )}
                          <button onClick={() => saveEditedMatch(m.id)} data-testid="edit-save"
                            className="bg-[#e7c977] text-[#0b1f16] font-semibold rounded px-3 py-1 text-xs">Tallenna</button>
                          <button onClick={() => setEditingMatchId(null)}
                            className="border border-[#5c7566] text-[#a9c2ae] rounded px-3 py-1 text-xs">Peruuta</button>
                        </div>
                      ) : (
                        <div className="flex flex-wrap items-center gap-2">
                          <span className="text-xs text-[#a9c2ae] w-24">#{m.id} · Taulu {m.board}{m.tablet ? " 📱" : ""}</span>
                          <span className={`flex-1 text-right ${m.l1 > m.l2 ? "font-bold text-[#e7c977]" : ""}`}>{m.p1Name}</span>
                          <span className="font-bold text-[#e7c977] px-2">{m.l1} : {m.l2}</span>
                          <span className={`flex-1 ${m.l2 > m.l1 ? "font-bold text-[#e7c977]" : ""}`}>{m.p2Name}</span>
                          {m.edited && <span className="text-[10px] text-[#a9c2ae]">muokattu</span>}
                          {m.tm && m.tm.dur != null && <span className="text-[11px] text-[#a9c2ae] tabular-nums" data-testid={`tm-${m.id}`} title="Ottelun kesto (aloittajan valinnasta viimeisen legin loppuun) · odotus (peli taululle → ensimmäinen heitto)">{"⏱ " + tcDur(m.tm.dur) + (m.tm.wait != null ? " · odotus " + tcDur(m.tm.wait) : "")}</span>}
                          {tieMode === "pd" && (swMatchPts(m)
                            ? <span className="text-[11px] text-[#a9c2ae] tabular-nums" data-testid={`pts-${m.id}`}>{`Pisteet ${swMatchPts(m)[0]}–${swMatchPts(m)[1]}`}</span>
                            : <span className="text-[11px] text-[#c9a86a]">{"Pisteet –"}</span>)}
                          {m.stats && (
                            <span className="text-[11px] text-[#8fd19e]" data-testid={`stats-summary-${m.id}`}>
                              KA {m.stats.avg1 == null ? "–" : statsFmt(m.stats.avg1)} / {m.stats.avg2 == null ? "–" : statsFmt(m.stats.avg2)}
                              {" · "}{"E9 " + (m.stats.f91 == null ? "–" : statsFmt(m.stats.f91)) + " / " + (m.stats.f92 == null ? "–" : statsFmt(m.stats.f92))}
                            </span>
                          )}
                          {offlineMode && (
                            <button onClick={() => openStatsFor(m)} data-testid={`stats-open-${m.id}`}
                              className="border border-[#8fd19e] text-[#8fd19e] hover:bg-[#12301f] rounded px-3 py-1 text-xs">
                              {m.stats ? "Muokkaa keskiarvoja" : "Keskiarvot"}
                            </button>
                          )}
                          <button
                            onClick={() => { setEditingMatchId(m.id); setEditScore({ a: String(m.l1), b: String(m.l2), pa: m.mpts ? String(m.mpts[0]) : "", pb: m.mpts ? String(m.mpts[1]) : "" }); }}
                            data-testid={`edit-${m.id}`}
                            className="border border-[#5b9bd5] text-[#5b9bd5] hover:bg-[#132537] rounded px-3 py-1 text-xs"
                          >
                            Muokkaa tulosta
                          </button>
                          <TcMatchStatsButton sk={m.sk} onOpen={() => setSwMsv({ sk: m.sk, title: "#" + m.id + " · " + m.p1Name + " – " + m.p2Name })} />
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </section>
        )}
      </div>
    </div>
  );
}

return { App: DartsParittaja, TV: { sjono: TV_VIEW_HTML, stulos: TV_SCOREBOARD_HTML, skombo: TV_COMBO_HTML, skombo2: TV_COMBO_COMPACT_HTML, sottelut: TV_MATCHES_HTML } };
})();


// REM: Sovelluksen käynnistys - ohjelman tekijä: Johannes Ketola
// ?view=boards tai ?view=bracket avaa erillisen, ei-interaktiivisen
// näyttönäkymän isolle näytölle - se ei ole eri sivu, vaan samasta
// tiedostosta avattu toinen välilehti, joka lukee samaa istuntoa reaaliajassa.
const __urlParams = new URLSearchParams(window.location.search);
const __view = __urlParams.get("view");
const __appRoot = ReactDOM.createRoot(document.getElementById("root"));
if (__urlParams.get("kausi")) {
  __appRoot.render(<SeasonView id={__urlParams.get("kausi")} />);
} else if (__urlParams.get("raportti") === "sveitsi") {
  __appRoot.render(<SwissReportView />);
} else if (__urlParams.get("raportti")) {
  __appRoot.render(<ReportView source={__urlParams.get("raportti")} />);
} else if (__urlParams.get("arkisto")) {
  __appRoot.render(<ArchiveView />);
} else if (TCLink.validCode(__urlParams.get("jatka"))) {
  __appRoot.render(<JatkaView code={__urlParams.get("jatka")} />);
} else if (["boards", "bracket", "all", "stv", "sjono", "stulos", "skombo", "skombo2", "sottelut"].includes(__view)) {
  __appRoot.render(<DisplayView view={__view} />);
} else {
  __appRoot.render(<AppRoot />);
}
// REM: Ohjelman loppu - tekijä: Johannes Ketola
</script>
