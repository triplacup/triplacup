      outline: isWin ? `${Math.max(2, u * 0.35)}px solid #e7c977` : "none" }}>
      <div style={{ background: active ? "#e7c977" : "transparent", borderRadius: u }} />
      <div style={{ minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center", gap: u * 0.6 }}>
        <div style={{ fontFamily: TB_FONT, fontSize: u * 6.2, lineHeight: 1, letterSpacing: ".02em", color: active ? "#fff" : "#e8e2d4", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
          {active && <span style={{ color: "#e7c977", marginRight: u * 1.2 }}>▶</span>}{isWin && "🏆 "}{name}
        </div>
        <div style={{ display: "flex", gap: u * 2.4, flexWrap: "wrap", fontSize: u * 2.5, color: "#a9c2ae", letterSpacing: ".04em" }}>
          <span>KA <b style={{ color: "#f2ede1", fontSize: u * 3.2 }}>{tbNum(st.avg != null ? st.avg : live && tbArr(live.avg, 2)[i])}</b></span>
          <span>LEGIN KA <b style={{ color: "#f2ede1", fontSize: u * 3.2 }}>{tbNum(st.lavg)}</b></span>
          <span>TIKAT <b style={{ color: "#f2ede1", fontSize: u * 3.2 }}>{st.ld != null ? st.ld : "–"}</b></span>
        </div>

.tb-pop{animation:tbPop 2.5s ease-out forwards}
@keyframes tbLeg{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}

@keyframes tbWait{0%,100%{opacity:.45}50%{opacity:1}}

      <div style={{ height: headH, display: "flex", alignItems: "center", gap: 18, borderBottom: "1px solid rgba(231,201,119,.25)", marginBottom: 14 }}>

function TbSrcLabel(src) {

function TbBracketCell({ id, m, r, h, w, live, board, score, ready, note }) {
  const sec = TB_SEC[m.sec] || TB_SEC.WB;
  const fs = Math.max(9, Math.min(h * 0.3, w * 0.085));
  const onBoard = !!board;
  const decided = r && r.decided && !r.isBye;
  const wSlot = decided ? r.winnerSlot : null;
  const names = [r && r.p1 ? r.p1.name : null, r && r.p2 ? r.p2.name : null];
  const pend = [r && r.p1 && r.p1.pending, r && r.p2 && r.p2.pending];
  const legs = live ? tbArr(live.legs, 2) : null;
  const scOk = score && decided && score.w === (wSlot === 1 ? 0 : 1) && (!score.names || (score.names[0] === names[0] && score.names[1] === names[1]));
  const wo = scOk && score.wo;
  const sc = scOk && !wo && score.l ? score.l : null;
  const bye = r && r.isBye;
  return (
    <div className={onBoard ? "tb-live" : ""} style={{ height: h, width: w, boxSizing: "border-box", display: "flex", alignItems: "stretch", borderRadius: Math.max(3, h * 0.1), overflow: "hidden",
      background: onBoard ? "rgba(231,201,119,.12)" : decided ? "rgba(255,255,255,.04)" : "rgba(255,255,255,.025)",
      border: `1px solid ${onBoard ? "#e7c977" : ready ? "rgba(74,222,128,.55)" : "rgba(255,255,255,.08)"}`, opacity: bye ? 0.4 : 1 }}>
      <div style={{ width: Math.max(3, h * 0.07), background: sec.c, opacity: decided ? 0.5 : 1, flex: "none" }} />
      <div style={{ flex: "none", width: fs * 2.1, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: TB_FONT, fontSize: fs * 0.9, color: "#8fa396", borderRight: "1px solid rgba(255,255,255,.06)" }}>{id}</div>
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: `0 ${fs * 0.4}px`, gap: 1 }}>
        {[0, 1].map((i) => {
          const win = wSlot === i + 1, lose = decided && !win;
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: fs * 0.3, fontSize: fs, lineHeight: 1.12, minWidth: 0 }}>
              <span style={{ flex: 1, minWidth: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                color: win ? "#e7c977" : lose ? "#5c7566" : names[i] ? "#ece6d8" : "#4b6355", fontWeight: win ? 700 : 500, textDecoration: lose ? "line-through" : "none" }}>
                {names[i] || (pend[i] ? <span style={{ color: "#5c7566", fontStyle: "italic" }}>{TbSrcLabel(i ? m.p2 : m.p1)}</span> : bye ? "vapaa" : "—")}
              </span>
              {onBoard && legs && <b style={{ fontFamily: TB_FONT, fontSize: fs * 1.1, color: "#e7c977" }}>{legs[i] || 0}</b>}
              {sc && <b style={{ fontFamily: TB_FONT, fontSize: fs * 1.05, color: win ? "#e7c977" : "#5c7566" }}>{sc[i]}</b>}
              {wo && lose && <b style={{ fontFamily: TB_FONT, fontSize: fs * 0.9, color: "#e8a0a0", letterSpacing: ".04em" }}>W.O.</b>}
            </div>
          );
        })}
      </div>
      {note && !onBoard && (
        <div style={{ flex: "none", display: "flex", alignItems: "center", padding: `0 ${fs * 0.4}px`, fontFamily: "Inter,system-ui,sans-serif", fontSize: fs * 0.78, fontWeight: 600,
          color: "#9fb5a6", borderLeft: "1px solid rgba(255,255,255,.06)", whiteSpace: "nowrap" }}>{note}</div>
      )}
      {(onBoard || ready) && (
        <div style={{ flex: "none", display: "flex", alignItems: "center", padding: `0 ${fs * 0.35}px`, background: onBoard ? "#e7c977" : "rgba(74,222,128,.16)",
          fontFamily: TB_FONT, fontSize: fs * (onBoard ? 1.05 : 0.8), color: onBoard ? "#0b1f16" : "#86efac", writingMode: onBoard ? "horizontal-tb" : "vertical-rl", letterSpacing: ".06em" }}>
          {onBoard ? `T${board}` : "VALMIS"}
        </div>
      )}
    </div>
  );
}

// Yksi kaavion osa: kierrokset sarakkeina, ottelut tasaisesti pystysuunnassa ja yhdysviivat voittajan
// seuraavaan otteluun. Toiseen kaavioon siirtyminen merkitään otteluun (H→17 / V→43).
function TbBracketSection({ secs, title, color, def, results, w, h, extra, fixedH, targets }) {
  const cols = [];
  secs.forEach((sec) => {
    const rounds = {};
    def.filter((m) => m.sec === sec).forEach((m) => (rounds[m.roundIndex] = rounds[m.roundIndex] || []).push(m));
    Object.keys(rounds).map(Number).sort((a, b) => a - b).forEach((ri) => cols.push({ sec, ri, ms: rounds[ri].sort((a, b) => a.id - b.id) }));
  });
  const maxN = Math.max(1, ...cols.map((c) => c.ms.length));
  const titleH = Math.min(26, fixedH ? Math.max(14, fixedH * 0.5) : Math.max(14, h * 0.05));
  const gap = Math.max(14, w * 0.018);
  const colW = (w - gap * (cols.length - 1)) / Math.max(1, cols.length);
  const inner = h - titleH;
  const cellH = fixedH || Math.min(inner / maxN - 3, colW * 0.36);
  const cw = colW * 0.94;
  const pos = {};
  cols.forEach((c, ci) => {
    const x = ci * (colW + gap), n = c.ms.length;
    c.ms.forEach((m, k) => (pos[m.id] = { x, y: ((k + 0.5) * inner) / n - cellH / 2 }));
  });
  const wt = (targets && targets.winnerTargetOf) || {}, lt = (targets && targets.loserTargetOf) || {};
  const lines = [];
  const notes = {};
  cols.forEach((c) => c.ms.forEach((m) => {
    const t = wt[m.id], r = results[m.id];
    const n = [];
    if (t != null && pos[t]) {
      const x1 = pos[m.id].x + cw, y1 = pos[m.id].y + cellH / 2, x2 = pos[t].x, y2 = pos[t].y + cellH / 2, mx = x1 + (x2 - x1) / 2;
      const done = r && r.decided;
      lines.push(<path key={m.id} d={`M${x1},${y1} H${mx} V${y2} H${x2}`} fill="none" stroke={done ? color : "rgba(169,194,174,.35)"} strokeOpacity={done ? 0.85 : 1} strokeWidth={done ? 2 : 1.4} />);
    } else if (t != null) n.push("V→" + t);
    if (lt[m.id] != null) n.push("H→" + lt[m.id]);
    if (n.length) notes[m.id] = n.join(" ");
  }));
  return (
    <div style={{ width: w, height: h, display: "flex", flexDirection: "column" }}>
      <div style={{ height: titleH, display: "flex", alignItems: "center", gap: 10, fontFamily: TB_FONT, fontSize: titleH * 0.78, letterSpacing: ".1em", color }}>{title}</div>
      <div style={{ position: "relative", height: inner }}>
        <svg width={w} height={inner} style={{ position: "absolute", left: 0, top: 0, overflow: "visible", pointerEvents: "none" }}>{lines}</svg>
        {cols.map((c) => c.ms.map((m) => (
          <div key={m.id} style={{ position: "absolute", left: pos[m.id].x, top: pos[m.id].y }}>{extra(m, cellH, cw, notes[m.id])}</div>
        )))}
      </div>
    </div>
  );
}

function TriplaAllDisplay({ session, srvState }) {
  return tbIsFinished(session) ? <TbFinalScreen session={session} /> : <TriplaAllLive session={session} srvState={srvState} />;
}
function TriplaAllLive({ session, srvState }) {
  const def = session.bracketDef || [];
  const { bracketMatchesById, bracketResults, bracketTargets } = deriveTriplaBracketState(def, session.bracketWinners || {}, session.bracketSeeds || []);
  const boards = (session.triplaBoards || []).filter((b) => !b.disabled);
  const rules = normRules(session.rules || null);
  const totalRounds = session.bracketTotalRounds || {};
  const scores = session.bracketScores || {};
  const onBoard = {};
  boards.forEach((b) => { if (b.status === "playing" && b.matchId != null) onBoard[b.matchId] = b; });
  const clock = useTbClock();
  const { w, h } = useTbSize();
  const pad = 18;
  const headH = Math.max(40, h * 0.06);
  const stripH = h * 0.22;
  const hasNext = tbNextMatches(session).length > 0;
  const nextH = hasNext ? Math.max(28, h * 0.042) : 0;
  const brH = h - headH - stripH - nextH - (hasNext ? 8 : 0) - pad * 2 - 34;
  const W = w - pad * 2;
  const nb = Math.max(1, boards.length);
  const u = Math.max(3, Math.min((W - (nb - 1) * 12) / nb / 50, stripH / 32));
  const decided = def.filter((m) => bracketResults[m.id] && bracketResults[m.id].decided && !bracketResults[m.id].isBye).length;
  const total = def.filter((m) => bracketResults[m.id] && !bracketResults[m.id].isBye).length;
  const big = def.length > 50;
  const pages = big ? ["A", "B", "C"] : ["ALL"];
  const [pi, setPi] = useState(0);
  useEffect(() => { if (pages.length < 2) return undefined; const t = setInterval(() => setPi((i) => (i + 1) % pages.length), 20000); return () => clearInterval(t); }, [pages.length]);
  const page = pages[pi % pages.length];
  const cell = (m, ch, cw, note) => {
    const r = bracketResults[m.id];
    const b = onBoard[m.id];
    const ready = !b && r && r.ready && !r.decided && !r.isBye;
    return <TbBracketCell key={m.id} id={m.id} m={m} r={r} h={ch} w={cw} board={b ? b.id : null} live={b ? liveForBoard(srvState, b) : null} score={scores[m.id]} ready={ready} note={note} />;
  };
  const sect = (secs, title, color, sw, sh, fh) => <TbBracketSection key={title} secs={secs} title={title} color={color} def={def} results={bracketResults} w={sw} h={sh} extra={cell} fixedH={fh} targets={bracketTargets} />;
  const maxOf = (sec) => { const c = {}; def.filter((m) => m.sec === sec).forEach((m) => (c[m.roundIndex] = (c[m.roundIndex] || 0) + 1)); return Math.max(1, ...Object.values(c)); };
  let bracket;
  if (page === "ALL") {
    // 1) voittajien kaavio + välierä ja finaali  2) 1. hävinneiden  3) 2. hävinneiden
    // korkeus jaetaan otteluiden määrän mukaan, ja kaikissa osissa on sama ottelukoko
    const g = 10, n1 = maxOf("WB"), n2 = maxOf("LB1"), n3 = maxOf("LB2");
    const unit = Math.min(64, (brH - g * 2) / (n1 + n2 + n3 + 1.5));
    const fh = unit - 4, r1 = n1 * unit + unit * 0.5, r2 = n2 * unit + unit * 0.5, r3 = n3 * unit + unit * 0.5;
    bracket = (
      <div style={{ display: "flex", flexDirection: "column", gap: g }}>
        <div style={{ display: "flex", gap: 24 }}>
          {sect(["WB"], "VOITTAJIEN KAAVIO", TB_SEC.WB.c, W * 0.62, r1, fh)}
          {sect(["SF", "F"], "VÄLIERÄ · FINAALI", TB_SEC.F.c, W * 0.38 - 24, r1, fh)}
        </div>
        {sect(["LB1"], "1. HÄVINNEIDEN KAAVIO", TB_SEC.LB1.c, W, r2, fh)}
        {sect(["LB2"], "2. HÄVINNEIDEN KAAVIO", TB_SEC.LB2.c, W, r3, fh)}
      </div>
    );
  } else if (page === "A") {
    bracket = (
      <div style={{ display: "flex", gap: 24 }}>
        {sect(["WB"], "VOITTAJIEN KAAVIO", TB_SEC.WB.c, W * 0.68, brH, Math.min(64, (brH - 26) / maxOf("WB") - 3))}
        {sect(["SF", "F"], "VÄLIERÄ · FINAALI", TB_SEC.F.c, W * 0.32 - 24, brH, Math.min(64, (brH - 26) / maxOf("WB") - 3))}
      </div>
    );
  } else if (page === "B") bracket = sect(["LB1"], "1. HÄVINNEIDEN KAAVIO", TB_SEC.LB1.c, W, brH, Math.min(64, (brH - 26) / maxOf("LB1") - 3));
  else bracket = sect(["LB2"], "2. HÄVINNEIDEN KAAVIO", TB_SEC.LB2.c, W, brH, Math.min(64, (brH - 26) / maxOf("LB2") - 3));
  return (
    <div style={{ height: "100vh", width: "100vw", overflow: "hidden", boxSizing: "border-box", padding: `10px ${pad}px 24px`, color: "#f2ede1",
      background: "radial-gradient(ellipse at 30% 0%,#173626 0%,#0b1f16 45%,#06110c 100%)", fontFamily: "Inter,system-ui,sans-serif", display: "flex", flexDirection: "column" }}>
      <style>{`@keyframes tbPop{0%{opacity:0;transform:translateY(-50%) scale(.4)}12%{opacity:1;transform:translateY(-50%) scale(1.12)}22%{transform:translateY(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-50%) scale(.96)}}
.tb-pop{animation:tbPop 2.5s ease-out forwards}
@keyframes tbLeg{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.tb-legwin{animation:tbLeg 3.5s ease forwards}
@keyframes tbWait{0%,100%{opacity:.45}50%{opacity:1}}
.tb-wait{animation:tbWait 2s ease-in-out infinite}
@keyframes tbGlow{0%,100%{box-shadow:0 0 0 rgba(231,201,119,0)}50%{box-shadow:0 0 14px rgba(231,201,119,.55)}}
.tb-live{animation:tbGlow 2.2s ease-in-out infinite}`}</style>
      <div style={{ height: headH, flex: "none", display: "flex", alignItems: "center", gap: 16, borderBottom: "1px solid rgba(231,201,119,.25)" }}>
        <span style={{ fontFamily: TB_FONT, fontSize: headH * 0.62, letterSpacing: ".06em", color: "#e7c977", lineHeight: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: w * 0.36 }} translate="no" data-notr>🎯 {tcTourName(session.tourInfo).toUpperCase()}</span>
        <span style={{ fontFamily: TB_FONT, fontSize: headH * 0.42, letterSpacing: ".14em", color: "#a9c2ae" }}>LIVE</span>
        <span style={{ flex: 1 }} />
        <span style={{ fontFamily: TB_FONT, fontSize: headH * 0.42, letterSpacing: ".08em", color: "#a9c2ae" }}>RATKAISTU <b style={{ color: "#f2ede1" }}>{decided}/{total}</b> OTTELUA</span>
        <span style={{ fontFamily: TB_FONT, fontSize: headH * 0.42, letterSpacing: ".08em", color: "#a9c2ae" }}>{rulesLine(rules).toUpperCase()}</span>
        <span style={{ fontFamily: TB_FONT, fontSize: headH * 0.62, color: "#f2ede1", lineHeight: 1 }}>{clock}</span>
      </div>
      <div style={{ height: stripH, flex: "none", marginTop: pad * 0.7, display: "grid", gridTemplateColumns: `repeat(${nb},minmax(0,1fr))`, gap: 12 }}>
        {boards.map((b) => (
          <TbMiniBoard key={b.id} b={b} m={b.matchId != null ? bracketMatchesById[b.matchId] : null} live={liveForBoard(srvState, b)} rules={rules} totalRounds={totalRounds} u={u} />
        ))}
      </div>
      {hasNext && <div style={{ flex: "none", marginTop: 8 }}><TbNextRow session={session} h={nextH} w={W} /></div>}
      <div style={{ flex: 1, minHeight: 0, marginTop: pad, position: "relative" }}>
        {bracket}
        {pages.length > 1 && (
          <div style={{ position: "absolute", right: 0, bottom: -18, display: "flex", gap: 6 }}>
            {pages.map((p, i) => <span key={p} style={{ width: 8, height: 8, borderRadius: "50%", background: i === pi % pages.length ? "#e7c977" : "#3a5c46" }} />)}
          </div>
        )}
      </div>
    </div>
  );
}

// Compact, read-only match chip for the big-screen bracket display. Shows
// the match number and — just like the hand-drawn reference bracket — a
// tiny "V→" (voitto, where the winner goes) / "H→" (häviö, where the loser
// goes) line, so a player can trace their own path forward without any
// explanation from the organizer. Still small enough that a full round-1
// column (up to 16 matches for a 32-bracket) fits a landscape TV's height.
function renderTriplaCompactCard({ id, bracketMatchesById, bracketResults, bracketTargets, large }) {
  const m = bracketMatchesById[id];
  const r = bracketResults[id];
  if (!m || !r) return null;
  const secBorder = { WB: "border-l-[#3e8e5b]", LB1: "border-l-[#d38a3f]", LB2: "border-l-[#c0392b]", SF: "border-l-[#e7c977]", F: "border-l-[#e7c977]" }[m.sec];
  const winTarget = bracketTargets.winnerTargetOf[id];
  // The generic winner/loser map doesn't cover the SF match's conditional
  // rematch (a separate "loserIfSlot" source type), so it's filled in by
  // hand here: losing the SF match sends the winners'-bracket-side player
  // to the rematch at `winTarget` - the only case where losing doesn't
  // immediately end the run. Every other match either has a real
  // loserTargetOf entry (WB/LB1 losers keep going) or none at all (LB2
  // losers and the two finalists are simply done) - and when there is
  // none, we show nothing rather than any "you're out" text.
  const isSfMatch = m.sec === "SF" && m.roundIndex === 1;
  const loseTarget = isSfMatch ? winTarget : bracketTargets.loserTargetOf[id];

  const nameRow = (name, isWinner, pending) => (
    <div className={`truncate leading-tight ${r.decided ? (isWinner ? "text-[#e7c977] font-semibold" : "text-[#5c7566] line-through") : "text-[#f2ede1]"}`}>
      {pending ? "…" : name === null ? "—" : name}
    </div>
  );

  const numberBadge = (
    <div className={`flex items-center justify-center font-semibold text-[#e7c977] shrink-0 border-r border-[#264536] ${large ? "text-[24px] pr-3 mr-3 min-w-[33px]" : "text-[11px] pr-1.5 mr-1.5 min-w-[16px]"}`}>
      {id})
    </div>
  );
  // Right-hand routing badge: "V24" = winner goes to match 24, "H66" =
  // loser goes to match 66. Either line is left out when it doesn't exist
  // (LB2 losers are simply out, the final has no next match), so LB2 cards
  // only show the V line.
  const hasRoute = winTarget != null || loseTarget != null;
  const boxWidth = large
    ? (hasRoute ? "min-w-[280px] max-w-[395px]" : "min-w-[225px] max-w-[340px]")
    : (hasRoute ? "min-w-[125px] max-w-[175px]" : "min-w-[100px] max-w-[150px]");
  const loseBadge = hasRoute ? (
    <div className={`flex flex-col items-start justify-center leading-tight text-[#8fa396] shrink-0 border-l border-[#264536] whitespace-nowrap ${large ? "text-[20px] pl-3 ml-3" : "text-[10px] pl-1.5 ml-1.5"}`}>
      {winTarget != null && <div>V{winTarget}</div>}
      {loseTarget != null && <div>H{loseTarget}</div>}
    </div>
  ) : null;

  const boxPad = large ? "px-4 py-3" : "px-1.5 py-1";
  const boxText = large ? "text-[23px]" : "text-[11px]";
  const boxBorder = large ? "border-l-[6px]" : "border-l-[3px]";
  const vapaaText = large ? "text-[15px]" : "text-[8px]";

  if (r.isBye) {
    return (
      <div key={id} className={`bg-[#152a20] border border-[#264536] ${secBorder} ${boxBorder} rounded flex items-center ${boxPad} ${boxText} ${boxWidth}`}>
        {numberBadge}
        <div className="flex-1 min-w-0">
          <div className="text-[#e7c977] font-semibold truncate leading-tight">{r.winnerName}</div>
          <div className={`${vapaaText} text-[#5c7566] leading-tight`}>vapaapari</div>
        </div>
        {loseBadge}
      </div>
    );
  }
  return (
    <div key={id} className={`bg-[#152a20] border border-[#264536] ${secBorder} ${boxBorder} rounded flex items-center ${boxPad} ${boxText} ${boxWidth}`}>
      {numberBadge}
      <div className="flex-1 min-w-0">
        {nameRow(r.p1.name, r.winnerName === r.p1.name, r.p1.pending)}
        {nameRow(r.p2.name, r.winnerName === r.p2.name, r.p2.pending)}
      </div>
      {loseBadge}
    </div>
  );
}

// One bracket section (WB/LB1/LB2/SF/F) laid out as a real bracket tree
// reads left-to-right, not top-to-bottom: each round is a column, and a
// later round's (fewer) matches are vertically centered against the
// earlier round's matches that feed them. This is what actually lets a
// whole section fit a landscape screen's height - the column that needs
// the most vertical room is round 1's, everything after it only gets
// narrower going down, never adds height.
function renderTriplaHorizontalSection({ sec, bracketDef, bracketMatchesById, bracketResults, bracketTargets, large }) {
  const ids = bracketDef.filter((m) => m.sec === sec).map((m) => m.id);
  if (ids.length === 0) return null;
  const rounds = {};
  ids.forEach((id) => {
    const m = bracketMatchesById[id];
    (rounds[m.roundIndex] = rounds[m.roundIndex] || []).push(id);
  });
  const allRoundKeys = Object.keys(rounds).map(Number).sort((a, b) => a - b);
  // In the 2nd-loss bracket the last rounds are single matches, one per
  // round, which made the bracket needlessly wide. Those trailing
  // one-match rounds are stacked on top of each other in ONE column instead
  // (with clear spacing so they don't touch).
  let stackKeys = [];
  if (sec === "LB2") {
    for (let i = allRoundKeys.length - 1; i >= 0 && rounds[allRoundKeys[i]].length === 1; i--) stackKeys.unshift(allRoundKeys[i]);
    if (stackKeys.length < 2) stackKeys = [];
  }
  const roundKeys = allRoundKeys.filter((k) => !stackKeys.includes(k));
  return (
    <div key={sec} className="flex gap-3 h-full items-stretch">
      {roundKeys.map((rIdx) => (
        <div key={rIdx} className="flex flex-col justify-center gap-1.5 min-w-0">
          <div className={`font-semibold text-[#e7c977] text-center uppercase tracking-wide ${large ? "text-[17px] mb-1.5" : "text-[10px] mb-0.5"}`}>
            {sec === "F" ? "Loppuottelu" : sec === "SF" ? (rIdx === 1 ? "Välierä" : "Uusinta") : `Kierros ${rIdx}`}
          </div>
          {/* A round with more than 8 matches (round 1 of a 32-bracket has 16)
              is split into side-by-side sub-columns of at most 8, so it uses
              the screen's spare width instead of overflowing its height. */}
          <div className="flex gap-2 flex-1 items-stretch">
            {chunkIntoColumns(rounds[rIdx], Math.ceil(rounds[rIdx].length / 8)).map((chunk, ci) => (
              <div key={ci} className={`flex flex-col justify-center flex-1 ${large ? "gap-4" : "gap-1.5"}`}>
                {chunk.map((id) => renderTriplaCompactCard({ id, bracketMatchesById, bracketResults, bracketTargets, large }))}
              </div>
            ))}
          </div>
        </div>
      ))}
      {stackKeys.length > 0 && (
        <div className="flex flex-col justify-center gap-1.5 min-w-0">
          <div className={`font-semibold text-[#e7c977] text-center uppercase tracking-wide ${large ? "text-[17px] mb-1.5" : "text-[10px] mb-0.5"}`}>
            Kierros {stackKeys[0]}–{stackKeys[stackKeys.length - 1]}
          </div>
          <div className="flex flex-col justify-center gap-5 flex-1">
            {stackKeys.map((k) => renderTriplaCompactCard({ id: rounds[k][0], bracketMatchesById, bracketResults, bracketTargets, large }))}
          </div>
        </div>
      )}
    </div>
  );
}

function chunkIntoColumns(arr, colCount) {
  const perCol = Math.ceil(arr.length / colCount);
  const cols = [];
  for (let i = 0; i < colCount; i++) cols.push(arr.slice(i * perCol, (i + 1) * perCol));

// REM: Arkisto, tulosraportti (tulostus/PDF), CSV-vienti ja tulosten kopiointi - ohjelman tekijä: Johannes Ketola
const ARCH_KEY = "triplacup-arkisto-v1";
const ARCH_FIELDS = ["bracketDef", "bracketWinners", "bracketSeeds", "bracketScores", "bracketStats", "withdrawn", "rules", "bracketTotalRounds", "bracketFinalId", "bracketSize", "tourInfo"];
function archLoad() {
  try { const a = JSON.parse(localStorage.getItem(ARCH_KEY) || "[]"); return Array.isArray(a) ? a.filter((x) => x && x.id && x.session) : []; } catch (e) { return []; }
}
function archStore(list) {
  let l = list.slice(0, 80);
  for (;;) {
    try { localStorage.setItem(ARCH_KEY, JSON.stringify(l)); return true; } catch (e) { if (l.length <= 1) return false; l = l.slice(0, -1); }
  }
}
function archEntryOf(session) {
  const st = {};
  ARCH_FIELDS.forEach((k) => { if (session[k] !== undefined) st[k] = session[k]; });
  const def = st.bracketDef || [];
  const { bracketResults } = deriveTriplaBracketState(def, st.bracketWinners || {}, st.bracketSeeds || []);
  const real = def.filter((m) => bracketResults[m.id] && !bracketResults[m.id].isBye);
  const decided = real.filter((m) => bracketResults[m.id].decided).length;
  const fr = st.bracketFinalId ? bracketResults[st.bracketFinalId] : null;
  const finished = !!(fr && fr.decided);
  return { id: st.tourInfo.id, info: st.tourInfo, savedAt: Date.now(), finished, champion: finished ? fr.winnerName : null,
    players: (st.bracketSeeds || []).filter(Boolean).length, decided, total: real.length, session: st };
}
// Turnaus arkistoon (päivittää saman turnauksen merkinnän). Vain, jos ainakin yksi ottelu on ratkaistu.
function archUpsert(session) {
  if (!session || session.phase !== "tournament" || !session.tourInfo || !session.tourInfo.id) return false;
  const e = archEntryOf(session);
  if (!e.decided) return false;
  const l = archLoad().filter((x) => x.id !== e.id);
  l.unshift(e);
  return archStore(l);
}
function archDelete(id) { archStore(archLoad().filter((x) => x.id !== id)); }
function tcSafeFile(s) { return String(s || "triplacup").replace(/[^\wåäöÅÄÖ.-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "triplacup"; }
function tcDownload(name, text, type) {
  const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
// ottelun vaihe tekstinä: [kaavion osa, kierros]
function tcStageOf(m, totalRounds) {
  if (!m) return ["", ""];
  if (m.sec === "SF") return [m.roundIndex === 2 ? "Uusintaottelu" : "Välierä", ""];
  if (m.sec === "F") return ["Finaali", ""];
  const tot = (totalRounds || {})[m.sec];
  return [triplaSectionShortLabel(m), tot && m.roundIndex === tot ? "Lohkon finaali" : "Kierros " + m.roundIndex];
}
const TC_SEC_ORDER = { WB: 0, LB1: 1, LB2: 2, SF: 3, F: 4 };
function tcReportData(s) {
  const stats = computeTourStats(s);
  const finished = tbIsFinished(s);
  const standings = finished ? tcStandingsRows(s, stats) : [];
  const matches = stats.matches.slice().sort((a, b) => (TC_SEC_ORDER[a.m.sec] - TC_SEC_ORDER[b.m.sec]) || (a.m.roundIndex - b.m.roundIndex) || (a.id - b.id));
  const def = s.bracketDef || [];
  const open = def.filter((m) => { const r = stats.results[m.id]; return r && !r.isBye && !r.decided; }).length;
  return { stats, finished, standings, matches, open, info: s.tourInfo || {}, rules: normRules(s.rules || null), players: (s.bracketSeeds || []).filter(Boolean).length, size: s.bracketSize || (s.bracketSeeds || []).length };
}
// --- CSV (Excel: puolipiste ja desimaalipilkku)
function tcCsv(s) {
  const d = tcReportData(s);
  const T = (x) => TCI.tr(x);
  const num = (v) => (v == null || isNaN(v) ? "" : Number(v).toFixed(2).replace(".", ","));
  const q = (v) => { const x = v == null ? "" : String(v); return /[;"\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const rows = [];
  rows.push([tcTourName(d.info), tcFmtDate(d.info.date), d.info.place || ""]);
  rows.push([T("Pelimuoto"), rulesLineTr(d.rules), T("Pelaajat"), d.players]);
  rows.push([]);
  if (d.finished) {
    rows.push([T("Lopputulokset")]);
    rows.push([T("Sija"), T("Pelaaja"), T("Voitot"), T("Häviöt"), T("Legit +"), T("Legit −"), T("Keskiarvo"), "180", T("Paras lopetus"), T("Huom.")]);
    d.standings.forEach((r) => { const p = r.p || {}; rows.push([r.rankLabel, r.name, (p.won || 0) + (p.woW || 0), (p.lost || 0) + (p.woL || 0), p.legM ? p.legsFor : "", p.legM ? p.legsAg : "", num(p.avg), p.darts ? p.t180 : "", p.co || "", p.withdrawn ? T("keskeytti") : ""]); });
    rows.push([]);
  }
  if (d.stats.awards.length) {
    rows.push([T("Palkinnot")]);
    d.stats.awards.forEach((a) => rows.push([T(a.title), a.value.replace(".", ",") + (a.unit ? " " + T(a.unit) : ""), a.names.join(", ")]));
    rows.push([]);
  }
  rows.push([T("Pelaajatilastot")]);
  rows.push([T("Pelaaja"), T("Ottelut"), T("Voitot"), T("Häviöt"), "W.O.", T("Legit +"), T("Legit −"), T("Keskiarvo"), T("9 t. KA"), "180", "140+", "100+", T("Paras lopetus"), T("Lyhyin legi"), T("Huom.")]);
  [...d.stats.players].sort((a, b) => (b.avg || 0) - (a.avg || 0) || a.name.localeCompare(b.name)).forEach((p) =>
    rows.push([p.name, p.played, p.won + p.woW, p.lost + p.woL, p.woW + p.woL || "", p.legM ? p.legsFor : "", p.legM ? p.legsAg : "", num(p.avg), num(p.f9), p.darts ? p.t180 : "", p.darts ? p.t140 : "", p.darts ? p.t100 : "", p.co || "", p.best || "", p.withdrawn ? T("keskeytti") : ""]));
  rows.push([]);
  rows.push([T("Ottelut")]);
  rows.push([T("Ottelu"), T("Kaavio"), T("Kierros"), T("Pelaaja 1"), T("Pelaaja 2"), T("Tulos"), T("Voittaja"), T("Keskiarvo") + " 1", T("Keskiarvo") + " 2", T("Huom.")]);
  d.matches.forEach((x) => {
    const [a, b] = tcStageOf(x.m, s.bracketTotalRounds);
    const st = x.st || [];
    const av = (i) => (st[i] && st[i].darts ? num((st[i].pts / st[i].darts) * 3) : "");
    rows.push([x.id, T(a), b ? T(b.replace(/\d+$/, "{}")).replace("{}", (b.match(/\d+$/) || [""])[0]) : "", x.names[0], x.names[1], x.wo ? "W.O." : x.legs ? x.legs[0] + "–" + x.legs[1] : "", x.names[x.w], av(0), av(1), x.wo ? T("luovutus") : ""]);
  });
  return "﻿" + rows.map((r) => r.map(q).join(";")).join("\r\n");
}
function rulesLineTr(rules) { return TCI.tr(rulesLine(rules)); }
// --- tulokset tekstinä (viestiin tai somejulkaisuun)
function tcResultText(s) {
  const d = tcReportData(s);

// REM: Isojen näyttöjen loppunäkymä, kutsut ja seuraavaksi-jono - ohjelman tekijä: Johannes Ketola
function useTbNow(ms) {
  const [t, setT] = useState(() => Date.now());
  useEffect(() => { const i = setInterval(() => setT(Date.now()), ms || 1000); return () => clearInterval(i); }, [ms]);
  return t;
}
// kutsun aika ottelun avaimesta ("m12-<aika base36>")
function tbKeyTime(key) {
  const p = String(key || "").split("-");
  const t = p.length > 1 ? parseInt(p[p.length - 1], 36) : NaN;
  return t > 1.5e12 && t < 4e12 ? t : null;
}
function tbMmSs(ms) {
  if (ms == null || ms < 0) return "";
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function tbIsFinished(session) {
  const def = session.bracketDef || [];
  if (!session.bracketFinalId || !def.length) return false;
  const { bracketResults } = deriveTriplaBracketState(def, session.bracketWinners || {}, session.bracketSeeds || []);
  const r = bracketResults[session.bracketFinalId];
  return !!(r && r.decided);
}
// --- Seuraavaksi pelattavat: valmiit ottelut, joita ei ole vielä annettu taululle (pisimpään odottaneet ensin)
function tbNextMatches(session) {
  const def = session.bracketDef || [];
  const { bracketResults, bracketMatchesById } = deriveTriplaBracketState(def, session.bracketWinners || {}, session.bracketSeeds || []);
  const onBoard = new Set((session.triplaBoards || []).filter((b) => b.status === "playing" && b.matchId != null).map((b) => b.matchId));
  const since = session.bracketReadySince || {};
  return def
    .filter((m) => { const r = bracketResults[m.id]; return r && r.ready && !r.decided && !r.isBye && !onBoard.has(m.id); })
    .sort((a, b) => (since[a.id] ?? 1e9) - (since[b.id] ?? 1e9) || a.id - b.id)
    .map((m) => ({ id: m.id, m: bracketMatchesById[m.id], p1: bracketResults[m.id].p1.name, p2: bracketResults[m.id].p2.name }));
}
function TbNextRow({ session, h, w }) {
  const list = tbNextMatches(session);
  if (!list.length) return null;
  const fs = h * 0.42;
  return (
    <div style={{ height: h, display: "flex", alignItems: "center", gap: 10, overflow: "hidden", whiteSpace: "nowrap" }}>
      <span style={{ fontFamily: TB_FONT, fontSize: fs, letterSpacing: ".12em", color: "#86efac", flex: "none" }}>SEURAAVAKSI</span>

}
// --- Kutsuäänet: merkkiääni ja puhe (selain vaatii yhden napautuksen ennen kuin ääni sallitaan)
const TbSound = (function () {
  const KEY = "triplacup-display-sound";
  let on = false, ctx = null, subs = [];
  try { on = localStorage.getItem(KEY) === "1"; } catch (e) {}
  function ac() { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; if (!ctx) ctx = new C(); if (ctx.state === "suspended") ctx.resume().catch(() => {}); return ctx; }
  function chime() {
    try {
      const a = ac(); if (!a) return;
      [[659, 0], [880, 0.22], [1319, 0.44]].forEach(([f, d]) => {
        const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + d;
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1);
      });
    } catch (e) {}
  }
  function speak(text, lang) {
    try {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      const want = lang === "sv" ? "sv" : "fi";
      const v = (window.speechSynthesis.getVoices() || []).find((x) => (x.lang || "").toLowerCase().startsWith(want));
      u.lang = lang === "sv" ? "sv-SE" : "fi-FI";
      if (v) u.voice = v;
      u.rate = 0.95;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function set(v) {
    on = !!v;
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
    if (on) { chime(); try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (e) {} }
    subs.forEach((f) => f(on));
  }
  return { get on() { return on; }, set, chime, speak, sub: (f) => { subs.push(f); return () => { subs = subs.filter((x) => x !== f); }; } };
})();
function TbSoundButton() {
  const [on, setOn] = useState(TbSound.on);

}

function tbCalls(session, srvState) {

  return (session.triplaBoards || [])
    .filter((b) => !b.disabled && b.status === "playing" && b.matchId != null && !liveForBoard(srvState, b))

}

      seen.current.add(c.key);
      if (c.t == null || Date.now() - c.t < 5 * 60000) queue.current.push(c);
    });
    if (!cur && queue.current.length) setCur(queue.current.shift());
  }, [sig]);

    if (!cur) { if (queue.current.length) setCur(queue.current.shift()); return undefined; }

.tb-call{animation:tbCallIn 11s ease forwards}
@keyframes tbCallPulse{0%,100%{background:#e7c977}50%{background:#fde68a}}
.tb-callb{animation:tbCallPulse 1.1s ease-in-out infinite}`}</style>
      <div className="tb-callb" style={{ flex: "none", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: `${vw * 1}px ${vw * 2.2}px`, color: "#0b1f16" }}>

// REM: Ottelukohtaiset ACRHI DARTS -tilastot Triplacupissa - ohjelman tekijä: Johannes Ketola
// Tabletti tallentaa ottelun lopussa ACRHI DARTSin loppuruudun (otsikko, tulos ja koko tilastosivu).
// Internetin kautta tilastosivu kulkee polkuun /t/<koodi>-ms/<ottelun avain> (ei kuormita tauluille menevää tietoa),
// lähiverkossa tuloksen mukana. Triplacup säilyttää sivut tällä laitteella (IndexedDB) ja näyttää ne
// taulu.html?tilasto=1 -näkymässä, joten sivu on täsmälleen sama kuin tabletilla (myös ruotsiksi).
const TCMS = (function () {
  const DBN = "triplacup-ottelutilastot", ST = "ms";
  const mem = {};
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore(ST); } catch (e) {} };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function put(k, v) {
    mem[k] = v;
    return db().then((d) => new Promise((res) => {
      try { const tx = d.transaction(ST, "readwrite"); tx.objectStore(ST).put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
    })).catch(() => false);
  }
  function getLocal(k) {
    if (mem[k]) return Promise.resolve(mem[k]);
    return db().then((d) => new Promise((res) => {
      try { const r = d.transaction(ST).objectStore(ST).get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); }
    })).catch(() => null);
  }
  function fbKey(k) { return String(k).replace(/[.#$\[\]\/|]/g, "_"); }
  function cloudUrl(code, k) { return PILVI_DB.replace(/\/+$/, "") + "/t/" + code + "-ms/" + fbKey(k) + ".json"; }
  function valid(rec) { return !!(rec && typeof rec.st === "string" && rec.st.length > 0); }
  function fetchCloud(code, k) {
    if (!code || !TCLink.validCode(code)) return Promise.resolve(null);
    return TCLink.jreq(cloudUrl(code, k), "GET").then((x) => (valid(x) ? x : null)).catch(() => null);
  }
  // tabletin tulos: tilastosivu talteen (mukana tai pilvessä)
  function fromResult(res, link) {
    if (!res || !res.key) return;
    if (valid(res.me)) { put(res.key, { ...res.me, at: Date.now() }); return; }
    if (res.msk && link && link.mode === "pilvi") {
      const tryGet = (n) => fetchCloud(link.code, res.msk).then((x) => { if (x) put(res.key, { ...x, at: Date.now() }); else if (n > 0) setTimeout(() => tryGet(n - 1), 3000); });
      tryGet(3);
    }
  }
  function get(k, code) {
    return getLocal(k).then((v) => (valid(v) ? v : fetchCloud(code, k).then((x) => { if (x) put(k, { ...x, at: Date.now() }); return x; })));
  }
  return { fromResult, get, put };
})();

// --- Sveitsiläisen tilastot ja palkinnot ottelulokista
// KA ja 9 tikan KA = ottelukohtaisten keskiarvojen keskiarvo (kuten sveitsiläisen omassa tulostaulussa).
function computeSwissStats(s) {
  const P = {};

    const ids = [m.p1Id, m.p2Id], names = [m.p1Name, m.p2Name], legs = [m.l1 || 0, m.l2 || 0];
    [0, 1].forEach((i) => {

      const f = m.stats ? (i ? m.stats.f92 : m.stats.f91) : null;

  const a180 = top(players.filter((p) => p.t180 > 0).map((p) => ({ name: p.name, v: p.t180 })), gt);
  if (a180) awards.push({ key: "t180", icon: "💯", title: "Eniten 180:iä", value: String(a180.v), unit: "", names: a180.names });

function SwissFinalScreen({ session }) {

// Sveitsiläisen alkuperäiset TV-sivut (jono, tulostaulu, kombo, ottelut) omana osoitteenaan.

const SW_REMOTE_KEY = "triplacup-swiss-remote-v1";
function SwissLegacyTv({ view, session, remote }) {
  const ref = useRef(null);
  const key = remote ? SW_REMOTE_KEY : SWISS_SESSION_KEY;
  useEffect(() => { if (remote && session) { try { localStorage.setItem(SW_REMOTE_KEY, JSON.stringify(session)); } catch (e) {} } }, [remote, session]);
  const doc = useMemo(() => {
    let html = (Swiss.TV[view] || Swiss.TV.stulos).replace(/var KEY = "[^"]*";/, 'var KEY = "' + key + '";');
    const i18n = document.getElementById("tc-i18n");
    if (i18n) html = html.replace("</head>", "<script>" + i18n.textContent.replace(/<\/script/gi, "<\\/script") + "<\/script></head>");
    return html;
  }, [view, key]);
  useEffect(() => {
    const push = () => { try { const W = ref.current && ref.current.contentWindow; if (W && W.TCI) W.TCI.follow(TCI.lang); } catch (e) {} };
    const un = TCI.sub(push);
    const f = ref.current; if (f) f.addEventListener("load", push);
    const t = setInterval(push, 3000);
    return () => { un(); clearInterval(t); if (f) f.removeEventListener("load", push); };
  }, [doc]);
  return <iframe ref={ref} title="TV" srcDoc={doc} style={{ position: "fixed", inset: 0, width: "100vw", height: "100vh", border: 0, background: "#0b1f16" }} />;
}
function SwissDisplay({ view, session, srvState, remote }) {
  const legacy = { sjono: 1, stulos: 1, skombo: 1, skombo2: 1, sottelut: 1 };
  if (legacy[view]) return <SwissLegacyTv view={view} session={session} remote={remote} />;

  if (view === "all") return <SwissAllDisplay session={session} srvState={srvState} />;

}

// --- Sveitsiläisen tulosraportti, CSV ja tekstiversio
function swReportData(s) {
  const stats = computeSwissStats(s);
  const by = {}; stats.players.forEach((p) => (by[p.id] = p));
  const { list, bh } = swStandings((s.players || []).map((p) => ({ ...p })), s.matchLog, s.tieBreak);
  const draws = {}; (s.matchLog || []).forEach((m) => { if (m.l1 === m.l2) { draws[m.p1Id] = (draws[m.p1Id] || 0) + 1; draws[m.p2Id] = (draws[m.p2Id] || 0) + 1; } });
  return { stats, by, list, bh, tieMode: swTieMode(s.tieBreak), draws, finished: swFinished(s), info: s.tourInfo || {}, rules: normSwRules(s.tcRules), rt: Number(s.roundsTarget) || 0,
    matches: (s.matchLog || []).slice().sort((a, b) => a.id - b.id) };
}
function swCsv(s) {
  const d = swReportData(s);
  const T = (x) => TCI.tr(x);
  const num = (v) => (v == null || isNaN(v) ? "" : Number(v).toFixed(2).replace(".", ","));
  const q = (v) => { const x = v == null ? "" : String(v); return /[;"\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const rows = [];
  rows.push([tcTourName(d.info), tcFmtDate(d.info.date), d.info.place || ""]);
  rows.push([T("Kiihdytetty sveitsiläinen"), T("Pelaajat"), (s.players || []).length, T("Pelejä per pelaaja"), d.rt, swRulesLineTr(d.rules)]);
  rows.push([]);
  rows.push([T(d.finished ? "Lopputulokset" : "Tulostaulu")]);
  rows.push([T("Sija"), T("Pelaaja"), T("Voitot"), T("Tasapelit"), T("Häviöt"), T("Legit +"), T("Legit −"), T("Legiero"), T("Pisteet"), T(swTieHead(d.tieMode)), T("Pelit"), T("Keskiarvo"), T("9 t. KA"), T("Huom.")]);
  d.list.forEach((p, i) => {
    const x = d.by[p.id] || {};
    rows.push([i + 1, p.name, x.won || 0, x.drawn || 0, x.lost || 0, p.legsFor || 0, p.legsAgainst || 0, (p.legsFor || 0) - (p.legsAgainst || 0), p.wins * 2, d.bh[p.id], p.gamesPlayed + "/" + d.rt, num(x.avg), num(x.f9), p.withdrawn ? T("keskeytti") : ""]);
  });
  rows.push([]);
  if (d.stats.awards.length) {
    rows.push([T("Palkinnot")]);
    d.stats.awards.forEach((a) => rows.push([T(a.title), a.value.replace(".", ",") + (a.unit ? " " + T(a.unit) : ""), a.names.join(", ")]));
    rows.push([]);
  }
  rows.push([T("Pelaajatilastot")]);
  rows.push([T("Pelaaja"), "180", "140+", "100+", T("Paras lopetus"), T("Lyhyin legi"), T("Heittoaika") + " (s)"]);
  d.stats.players.forEach((p) => rows.push([p.name, p.darts ? p.t180 : "", p.darts ? p.t140 : "", p.darts ? p.t100 : "", p.co || "", p.best || "", p.vt == null ? "" : num(p.vt).replace(/0$/, "")]));
  rows.push([]);
  rows.push([T("Ottelut")]);
  rows.push(["#", T("Taulu"), T("Pelaaja 1"), T("Pelaaja 2"), T("Tulos"), T("Keskiarvo") + " 1", T("Keskiarvo") + " 2", T("Alkoi"), T("Päättyi"), T("Kesto"), T("Odotus")]);
  const tm = (t) => (t ? new Date(t).toLocaleTimeString(TCI.locale(), { hour: "2-digit", minute: "2-digit" }) : "");
  d.matches.forEach((m) => rows.push([m.id, m.board, m.p1Name, m.p2Name, m.l1 + "–" + m.l2, num(m.stats && m.stats.avg1), num(m.stats && m.stats.avg2), tm(m.startedAt), tm(m.at), m.tm && m.tm.dur != null ? tcDur(m.tm.dur) : "", m.tm && m.tm.wait != null ? tcDur(m.tm.wait) : ""]));
  return "﻿" + rows.map((r) => r.map(q).join(";")).join("\r\n");
}

function swResultText(s) {

// REM: Osallistujalistan poiminta liitetystä tekstistä (esim. Kisailu.net) - ohjelman tekijä: Johannes Ketola
// Kisailun kisasivulla osallistujat ovat numeroituna peräkkäin:
//   1
//   Antti Tenkanen<TAB>Härkä Darts
//   2
//   Julius Puranen<TAB>-
// (tai samalla rivillä "1<TAB>Nimi<TAB>Seura" / "1. Nimi"). Koko sivun voi liittää: muu teksti (otsikot,
// kisan tiedot, pistetaulukot) ohitetaan, koska nimet poimitaan vain juoksevasti numeroidusta jaksosta.
// Palauttaa { names } kun vähintään kaksi peräkkäin numeroitua nimeä löytyy, muuten null (tavallinen lista).
function tcLooksPersonName(t) {
  const x = String(t || "").trim();
  if (x.length < 2 || x.length > 60 || /\d/.test(x) || x.includes("_")) return false;
  return /^[\p{L}][\p{L}\p{M}\s.'’-]*$/u.test(x);
}
function tcExtractRosterNames(text) {
  const lines = String(text || "").split(/\r?\n/).map((l) => l.replace(/ /g, " ").replace(/^[ \t]+|[ \t]+$/g, ""));
  const nameOf = (l) => { const x = String(l || "").split("\t")[0].replace(/\s+/g, " ").trim(); return tcLooksPersonName(x) ? x : ""; };
  let best = [];
  for (let i = 0; i < lines.length; i++) {
    const m0 = lines[i].match(/^(\d+)[.)]?(?:$|[\t ])/);
    if (!m0) continue;
    const out = [];
    let n = Number(m0[1]), j = i;
    while (j < lines.length) {
      const L = lines[j];
      if (!L) { j++; continue; }
      let m = L.match(/^(\d+)[.)]?$/);
      if (m && Number(m[1]) === n) {
        let k = j + 1;
        while (k < lines.length && !lines[k]) k++;
        const nm = k < lines.length ? nameOf(lines[k]) : "";
        if (!nm) break;
        out.push(nm); n++; j = k + 1; continue;
      }
      m = L.match(/^(\d+)[.)]?[\t ]+(.+)$/);
      if (m && Number(m[1]) === n) {
        const nm = nameOf(m[2]);
        if (!nm) break;
        out.push(nm); n++; j++; continue;
      }
      break;
    }
    if (out.length > best.length) best = out;
  }
  if (best.length < 2) return null;
  const seen = new Set(), names = [];
  best.forEach((x) => { const k = x.toLowerCase(); if (!seen.has(k)) { seen.add(k); names.push(x); } });
  return { names };
}

// REM: Kaudet ja rankingpisteet (kiihdytetty sveitsiläinen) - ohjelman tekijä: Johannes Ketola
// Kausi (esim. "Talvikiertue 2026–27") kokoaa kisojen tulokset yhteen listaan. Jokaisesta kisasta tallennetaan
// pelaajien sijoitus ja tunnusluvut; kauden pisteet lasketaan aina kauden pisteytyssäännöistä, joten sääntöjen
// muutos laskee koko listan uudelleen. Pisteytys on täysin vapaasti määriteltävä (taulukko, osallistujamäärä tai
// kisan omat pisteet + osallistumis- ja bonuspisteet, parhaat N tulosta).
const TC_SEASON_KEY = "triplacup-kaudet-v1";
function tcSeasonDefaultCfg() {
  return {
    method: "table",
    table: [{ from: 1, to: 1, pts: 10 }, { from: 2, to: 2, pts: 7 }, { from: 3, to: 3, pts: 5 }, { from: 4, to: 4, pts: 4 }, { from: 5, to: 6, pts: 3 }, { from: 7, to: 8, pts: 2 }, { from: 9, to: 12, pts: 1 }],
    base: 1, step: 1, winBonus: 0, sW: 2, sD: 1, sL: 0, part: 0, bWin: 0, b180: 0, bCo100: 0, dnf: "rank", best: 0,
  };
}
function tcNumOr(v, d) { const n = Number(v); return isFinite(n) ? n : d; }
function tcSeasonCfg(c) {
  const d = tcSeasonDefaultCfg(), o = { ...d, ...(c || {}) };
  o.method = ["table", "field", "swiss"].includes(o.method) ? o.method : "table";
  o.table = (Array.isArray(o.table) ? o.table : d.table).map((r) => {
    const f = Math.max(1, Math.round(tcNumOr(r.from, 1))), t = Math.max(f, Math.round(tcNumOr(r.to, f)));
    return { from: f, to: t, pts: tcNumOr(r.pts, 0) };

  o.best = Math.max(0, Math.round(tcNumOr(o.best, 0)));

  return o;
}
function tcPtsFmt(x) { const v = Math.round(Number(x) * 100) / 100; return Number.isInteger(v) ? String(v) : String(v); }
// Yhden kisan pisteet pelaajalle: r = { rank, w, d, l, t180, co100, dnf }, n = osallistujia
function tcSeasonPts(cfg, r, n) {
  if (r.dnf && cfg.dnf === "zero") return 0;
  let p = 0;
  if (cfg.method === "table") {
    const row = cfg.table.find((x) => r.rank >= x.from && r.rank <= x.to);
    p = row ? row.pts : 0;
  } else if (cfg.method === "field") {
    p = cfg.base + Math.max(0, n - r.rank) * cfg.step + (r.rank === 1 ? cfg.winBonus : 0);
  } else {

}
function tcNameKey(n) { return String(n || "").trim().replace(/\s+/g, " ").toLowerCase(); }
const TcSeasons = (function () {
  let subs = [];
  function raw() { try { const d = JSON.parse(localStorage.getItem(TC_SEASON_KEY) || "null"); return d && Array.isArray(d.seasons) ? d : { v: 1, seasons: [] }; } catch (e) { return { v: 1, seasons: [] }; } }
  function write(d) { try { localStorage.setItem(TC_SEASON_KEY, JSON.stringify(d)); } catch (e) {} subs.forEach((f) => { try { f(); } catch (e) {} }); try { pushSavedSoon(); } catch (e) {} }
  // toisessa välilehdessä (kauden sivu) tehdyt muutokset pilveen turnauksen vetäjän välilehdeltä
  try { window.addEventListener("storage", (e) => { if (e.key === TC_SEASON_KEY) { try { pushSavedSoon(); } catch (x) {} } }); } catch (e) {}
  function list() { return raw().seasons; }
  function get(id) { return list().find((s) => s.id === id) || null; }

    const d = raw(); const i = d.seasons.findIndex((s) => s.id === season.id);
    const s = { ...season, updated: Date.now() };
    if (i >= 0) d.seasons[i] = s; else d.seasons.push(s);
    write(d); return s;
  }
  function create(name) { return save({ id: "k" + TCLink.randCode(10), name: String(name || "").trim() || "Kausi", created: Date.now(), cfg: tcSeasonDefaultCfg(), results: [] }); }
  function remove(id) { const d = raw(); d.seasons = d.seasons.filter((s) => s.id !== id); write(d); }
  // kisan tulokset kauteen (sama kisa vain yhdessä kaudessa); seasonId tyhjä = poistetaan kaikista
  function record(seasonId, res) {
    const d = raw(); let ch = false;
    d.seasons.forEach((s) => {
      const had = (s.results || []).some((t) => t.tid === res.tid);
      if (s.id === seasonId) {
        const rs = (s.results || []).filter((t) => t.tid !== res.tid).concat([res]);
        const old = (s.results || []).find((t) => t.tid === res.tid);
        if (!old || JSON.stringify({ ...old, at: 0 }) !== JSON.stringify({ ...res, at: 0 })) { s.results = rs; s.updated = Date.now(); ch = true; }
      } else if (had) { s.results = s.results.filter((t) => t.tid !== res.tid); s.updated = Date.now(); ch = true; }
    });
    if (ch) write(d);
    return ch;
  }
  function removeTour(tid, seasonId) {
    const d = raw(); let ch = false;
    d.seasons.forEach((s) => { if ((!seasonId || s.id === seasonId) && (s.results || []).some((t) => t.tid === tid)) { s.results = s.results.filter((t) => t.tid !== tid); s.updated = Date.now(); ch = true; } });
    if (ch) write(d);
  }
  function seasonOf(tid) { return list().find((s) => (s.results || []).some((t) => t.tid === tid)) || null; }
  // toisen laitteen kaudet mukaan (uudempi versio voittaa)

      const i = d.seasons.findIndex((x) => x.id === s.id);
      if (i < 0) d.seasons.push(s); else if ((s.updated || 0) > (d.seasons[i].updated || 0)) d.seasons[i] = s;

  function sub(f) { subs.push(f); const on = (e) => { if (e.key === TC_SEASON_KEY) f(); }; window.addEventListener("storage", on); return () => { subs = subs.filter((x) => x !== f); window.removeEventListener("storage", on); }; }

function useTcSeasons() {
  const [, setT] = useState(0);

// Sveitsiläisen kisan tulosrivit kauteen: sijoitus (tulostaulun järjestys), V/T/H, 180:t, 100+ lopetukset, DNF
function tcSwissSeasonRows(players, matchLog, tieBreak) {
  const { list } = swStandings((players || []).map((p) => ({ ...p })), matchLog || [], tieBreak);
  const stats = computeSwissStats({ players, matchLog });
  const by = {}; stats.players.forEach((p) => (by[p.id] = p));
  return list.map((p, i) => {
    const x = by[p.id] || {};
    return { name: p.name, rank: i + 1, w: x.won || 0, d: x.drawn || 0, l: x.lost || 0, t180: x.t180 || 0, co100: x.co100 || 0, sp: Number(p.wins || 0) * 2, dnf: !!p.withdrawn };
  });
}
// kisan ajankohta kauden järjestykseen: viimeisen ottelun päättymisaika (ei muutu tuloksia muokattaessa)
function tcLastMatchAt(ms) { return (ms || []).reduce((a, m) => Math.max(a, Number(m && m.at) || 0), 0); }
// Arkistoon tallennettu sveitsiläinen -> pelaajat (vastustajat otteluista) tulostaulua varten
function tcSwissArchivePlayers(rec) {
  const opp = {};
  (rec.matches || []).forEach((m) => { (opp[m.p1Id] = opp[m.p1Id] || []).push(m.p2Id); (opp[m.p2Id] = opp[m.p2Id] || []).push(m.p1Id); });
  return (rec.players || []).map((p) => ({ ...p, opponents: opp[p.id] || [] }));

// Kauden taulukko: pisteet nykyisillä säännöillä, parhaat N tulosta, järjestys
function tcSeasonTable(season) {
  const cfg = tcSeasonCfg(season && season.cfg);
  const tours = ((season && season.results) || []).slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")) || (a.at || 0) - (b.at || 0));
  const P = {};
  tours.forEach((t) => {
    (t.rows || []).forEach((r) => {
      const k = tcNameKey(r.name);
      const p = P[k] || (P[k] = { key: k, name: r.name, per: {}, total: 0, played: 0, wins: 0, best: null, all: 0 });
      p.name = r.name;
      p.per[t.tid] = { pts: tcSeasonPts(cfg, r, t.n || (t.rows || []).length), rank: r.rank, dnf: !!r.dnf, counted: true };
    });
  });
  const rows = Object.values(P).map((p) => {
    const ent = tours.filter((t) => p.per[t.tid]).map((t) => ({ tid: t.tid, ...p.per[t.tid] }));
    if (cfg.best > 0 && ent.length > cfg.best) {
      const keep = ent.slice().sort((a, b) => b.pts - a.pts).slice(0, cfg.best).map((e) => e.tid);
      ent.forEach((e) => { if (!keep.includes(e.tid)) p.per[e.tid].counted = false; });
    }
    p.played = ent.length;
    p.all = Math.round(ent.reduce((a, e) => a + e.pts, 0) * 100) / 100;
    p.total = Math.round(ent.filter((e) => p.per[e.tid].counted).reduce((a, e) => a + e.pts, 0) * 100) / 100;
    p.wins = ent.filter((e) => e.rank === 1).length;
    p.best = ent.length ? Math.min(...ent.map((e) => e.rank)) : null;
    return p;
  });
  rows.sort((a, b) => b.total - a.total || b.wins - a.wins || (a.best || 999) - (b.best || 999) || b.played - a.played || a.name.localeCompare(b.name, "fi"));
  let prev = null;
  rows.forEach((r, i) => { r.pos = prev && prev.total === r.total && prev.wins === r.wins && prev.best === r.best && prev.played === r.played ? prev.pos : i + 1; prev = r; });
  return { cfg, tours, rows };
}
function tcSeasonRuleText(cfg) {
  const T = (x) => TCI.tr(x);
  let t;
  if (cfg.method === "table") t = cfg.table.map((r) => (r.from === r.to ? r.from + "." : r.from + ".–" + r.to + ".") + " " + tcPtsFmt(r.pts)).join(", ");
  else if (cfg.method === "field") t = TCI.tr("Viimeinen {} p, jokainen sija ylemmäs +{} p").replace("{}", tcPtsFmt(cfg.base)).replace("{}", tcPtsFmt(cfg.step)) + (cfg.winBonus ? ", " + T("voittajalle lisäksi") + " " + tcPtsFmt(cfg.winBonus) : "");
  else t = T("Kisan omat pisteet") + ": " + T("voitto") + " " + tcPtsFmt(cfg.sW) + ", " + T("tasapeli") + " " + tcPtsFmt(cfg.sD) + ", " + T("tappio") + " " + tcPtsFmt(cfg.sL);
  const ex = [];
  if (cfg.part) ex.push(T("osallistuminen") + " +" + tcPtsFmt(cfg.part));
  if (cfg.bWin && cfg.method !== "swiss") ex.push(T("ottelun voitto") + " +" + tcPtsFmt(cfg.bWin));
  if (cfg.b180) ex.push("180 +" + tcPtsFmt(cfg.b180));

// --- Kauden tilanne (oma sivu ?kausi=<id>, ?kausi=1 = kaikki kaudet)
function tcSeasonCsv(season) {
  const T = (x) => TCI.tr(x);
  const d = tcSeasonTable(season);
  const q = (v) => { const x = v == null ? "" : String(v); return /[;"\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const rows = [[season.name], [T("Pisteytys"), tcSeasonRuleText(d.cfg)], []];
  rows.push([T("Sija"), T("Pelaaja"), T("Pisteet"), T("Kisat"), T("Voitot"), T("Paras sija")].concat(d.tours.map((t) => (t.name || "") + (t.date ? " " + tcFmtDate(t.date) : ""))));
  d.rows.forEach((r) => rows.push([r.pos, r.name, tcPtsFmt(r.total).replace(".", ","), r.played, r.wins, r.best || ""].concat(d.tours.map((t) => { const e = r.per[t.tid]; return e ? tcPtsFmt(e.pts).replace(".", ",") + (e.counted ? "" : " *") + " (" + e.rank + ".)" : ""; }))));
  if (d.cfg.best > 0) { rows.push([]); rows.push(["* " + T("ei lasketa (vain parhaat tulokset)")]); }
  return "﻿" + rows.map((r) => r.map(q).join(";")).join("\r\n");
}
function tcSeasonText(season) {
  const d = tcSeasonTable(season);
  const L = ["🏅 " + season.name, TCI.tr("Kisoja") + ": " + d.tours.length, ""];
  d.rows.forEach((r) => L.push(r.pos + ". " + r.name + " " + tcPtsFmt(r.total) + " p (" + r.played + ")"));
  return L.join("\n");
}

const SW_TV_PAGE_MS = 10000;
function SwissTvAllDisplay({ session, srvState }) {

}
function SwissTvAll({ s, srvState }) {
  const { w, h } = useTbSize();
  const rules = swDispRules(s);
  const boards = swBoardsOf(s).filter((b) => !b.disabled || b.status === "playing");
  const nb = Math.max(1, boards.length);
  const pad = Math.max(10, w * 0.009), gap = Math.max(8, w * 0.0065);
  const headH = Math.max(34, Math.min(h * 0.062, w * 0.036));
  // taulut: enintään 7 rivissä, muuten kahdessa rivissä
  const portrait = w < h * 1.15;
  const bRows = nb > 7 || (portrait && nb > 4) ? 2 : 1;
  const bCols = Math.ceil(nb / bRows);
  const stripH = portrait ? Math.min(h * 0.3, (w / bCols) * 0.62 * bRows) : h * (bRows === 2 ? 0.36 : 0.235);
  const cardW = (w - pad * 2 - (bCols - 1) * gap) / bCols;
  const cardH = (stripH - (bRows - 1) * gap) / bRows;
  const u = Math.max(2.6, Math.min(cardW / 50, cardH / 30));
  // pelaajat tauluilla (merkki jonoon ja sarjataulukkoon)
  const onBoard = {};
  (s.boards || []).forEach((b) => { if (b.status === "playing" && b.p1 && b.p2) { onBoard[b.p1.id] = b.id; onBoard[b.p2.id] = b.id; } });
  const byId = {}; (s.players || []).forEach((p) => (byId[p.id] = p));
  const queue = (s.pairQueue || []).map((q, i) => ({ i, key: q.key || i, a: byId[q.p1Id], b: byId[q.p2Id] }));
  // sarjataulukko
  const { list, bh, tie } = swStandings((s.players || []).map((p) => ({ ...p })), s.matchLog, s.tieBreak);
  const stats = computeSwissStats(s);
  const avgById = {}; stats.players.forEach((p) => (avgById[p.id] = p.avg));
  const anyAvg = stats.players.some((p) => p.avg != null);
  const draws = {}; (s.matchLog || []).forEach((m) => { if (m.l1 === m.l2) { draws[m.p1Id] = (draws[m.p1Id] || 0) + 1; draws[m.p2Id] = (draws[m.p2Id] || 0) + 1; } });
  const anyDraw = Object.keys(draws).length > 0;
  const rt = Number(s.roundsTarget) || 0;
  const bodyH = h - headH - stripH - pad * 2 - gap * 2 - 14;
  const titleH = Math.max(18, Math.min(h * 0.034, w * 0.02));
  const minRow = portrait ? Math.max(17, Math.min(h * 0.03, w * 0.026)) : Math.max(17, Math.min(h * 0.03, w * 0.017));
  const rowCap = Math.min(h * 0.06, w * 0.03);
  // pystynäytöllä jono taulukon yläpuolella (enintään 6 riviä), muuten rinnakkain
  const qRowsP = portrait ? Math.min(Math.max(queue.length, 1), 6) : 0;
  // turnauksen suurin katko ja paras legi (vähiten tikkoja); tasatilanteessa kaikki parhaat
  const hlH = portrait ? Math.max(64, w * 0.1) : Math.max(70, Math.min(h * 0.14, w * 0.075));
  const qBlockH = portrait ? hlH + gap + titleH + 6 + qRowsP * (minRow * 1.25 + 4) + (queue.length > 6 ? minRow : 0) + minRow * 0.9 : 0;
  const tblH = bodyH - titleH - 6 - (portrait ? qBlockH + gap * 2 : 0);
  const fit = Math.max(4, Math.floor(tblH / minRow) - 1);
  const pages = Math.max(1, Math.ceil(list.length / fit));
  const perPage = pages > 1 ? Math.ceil(list.length / pages) : list.length;
  const rowH = Math.max(minRow, Math.min(rowCap, tblH / Math.max(8, perPage + 1)));
  const [page, setPage] = useState(0);
  useEffect(() => {
    if (pages <= 1) { setPage(0); return; }
    const t = setInterval(() => setPage((p) => (p + 1) % pages), SW_TV_PAGE_MS);
    return () => clearInterval(t);
  }, [pages]);
  const pg = Math.min(page, pages - 1);
  const shown = list.slice(pg * perPage, pg * perPage + perPage);
  // jono
  const qRowH = portrait ? minRow * 1.25 : Math.max(minRow * 1.05, Math.min(rowCap * 1.12, tblH / Math.max(7, Math.min(queue.length, 14) + 0.6)));
  const qFit = portrait ? 6 : Math.max(1, Math.floor((tblH - hlH - gap * 2 - minRow - 4) / (qRowH + 4)));
  const qShown = queue.length > qFit ? queue.slice(0, qFit - 1) : queue;
  const lerp = (a, b, t) => { const x = [1, 3, 5].map((i) => parseInt(a.substr(i, 2), 16)), y = [1, 3, 5].map((i) => parseInt(b.substr(i, 2), 16)); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; };
  const fs = rowH * 0.5;
  const awCo = stats.awards.find((a) => a.key === "co") || null;
  const awBest = stats.awards.find((a) => a.key === "best") || null;
  const hlTile = (id, icon, label, aw, unit) => {
    const names = aw ? aw.names : [];
    const shownN = names.length > 3 ? names.slice(0, 3) : names;
    return (
      <div data-testid={id} style={{ flex: 1, minWidth: 0, height: hlH, boxSizing: "border-box", borderRadius: 10, padding: `${hlH * 0.08}px ${hlH * 0.14}px`, overflow: "hidden",
        border: "1px solid rgba(231,201,119,.4)", background: "linear-gradient(180deg,rgba(231,201,119,.12),rgba(231,201,119,.03))", display: "flex", flexDirection: "column", justifyContent: "space-evenly" }}>
        <div style={{ fontFamily: TB_FONT, fontSize: hlH * 0.15, lineHeight: 1.2, letterSpacing: ".12em", color: "#e7c977", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", flex: "none" }}><span>{icon} </span><span>{label}</span></div>
        <div style={{ display: "flex", alignItems: "baseline", gap: hlH * 0.08, lineHeight: 1, flex: "none" }}>
          <span data-testid={id + "-v"} style={{ fontFamily: TB_FONT, fontSize: hlH * 0.32, color: aw ? "#fff" : "#5c7566" }}>{aw ? aw.value : "–"}</span>
          {aw && unit ? <span style={{ fontSize: hlH * 0.14, color: "#a9c2ae" }}>{unit}</span> : null}
        </div>
        <div data-testid={id + "-n"} style={{ fontSize: hlH * 0.13, lineHeight: 1.18, fontWeight: 600, color: aw ? "#ece6d8" : "#5c7566", overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", minHeight: hlH * 0.13 * 1.18 * 2 }}>
          {aw ? <span translate="no" data-notr>{shownN.join(", ")}</span> : <span>ei vielä tabletilla kirjattuja pelejä</span>}
          {names.length > shownN.length ? <span style={{ color: "#a9c2ae" }}>{" +" + (names.length - shownN.length)}</span> : null}
        </div>
      </div>
    );
  };
  const th = { fontFamily: TB_FONT, fontSize: rowH * 0.48, letterSpacing: ".08em", color: "#8fa396", fontWeight: 400, textAlign: "right", padding: "0 0.55em", whiteSpace: "nowrap" };
  const td = { fontSize: fs, textAlign: "right", padding: "0 0.55em", color: "#a9c2ae", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" };
  const secTitle = (txt, color, extra) => (
    <div style={{ height: titleH, display: "flex", alignItems: "center", gap: 12, marginBottom: 6, flex: "none" }}>
      <span style={{ fontFamily: TB_FONT, fontSize: titleH * 0.86, letterSpacing: ".12em", color, lineHeight: 1, whiteSpace: "nowrap", flex: "none" }}>{txt}</span>
      {extra}
    </div>
  );
  const badge = (bid, size) => (
    <span style={{ fontFamily: TB_FONT, fontSize: size, lineHeight: 1, padding: `${size * 0.12}px ${size * 0.35}px`, borderRadius: size * 0.25, background: "rgba(231,201,119,.16)", color: "#e7c977", border: "1px solid rgba(231,201,119,.45)", marginLeft: size * 0.4, flex: "none" }}>T{bid}</span>
  );
  return (
    <div data-testid="sw-tvall" style={{ height: "100vh", width: "100vw", overflow: "hidden", boxSizing: "border-box", padding: `${pad * 0.8}px ${pad}px ${Math.max(34, pad * 1.6)}px`, color: "#f2ede1",
      background: "radial-gradient(ellipse at 30% 0%,#173626 0%,#0b1f16 45%,#06110c 100%)", fontFamily: "Inter,system-ui,sans-serif", display: "flex", flexDirection: "column" }}>
      <style>{TB_ANIM_CSS}</style>
      <SwissHeader s={s} headH={headH} title={w >= 1500 ? "TV · TAULUT · JONO · SARJATAULUKKO" : ""} w={w} />
      <div data-testid="sw-tvall-boards" style={{ height: stripH, flex: "none", display: "grid", gridTemplateColumns: `repeat(${bCols},minmax(0,1fr))`, gridTemplateRows: `repeat(${bRows},minmax(0,1fr))`, gap }}>
        {boards.map((b) => <TbMiniBoard key={b.id} b={b} m={null} live={swLiveFor(srvState, b)} rules={rules} totalRounds={{}} u={u} />)}
      </div>
      <div style={{ flex: 1, minHeight: 0, marginTop: gap * 1.6, display: "grid", gridTemplateColumns: portrait ? "minmax(0,1fr)" : "minmax(0,0.36fr) minmax(0,0.64fr)", gridTemplateRows: portrait ? `${qBlockH}px minmax(0,1fr)` : "minmax(0,1fr)", gap: portrait ? gap * 2 : gap * 3 }}>
        {/* peliparijono */}
        <div data-testid="sw-tvall-queue" style={{ minWidth: 0, display: "flex", flexDirection: "column" }}>
          {secTitle("PELIPARIJONO", "#86efac", queue.length > 0 ? <span style={{ fontSize: titleH * 0.5, color: "#7a9484", whiteSpace: "nowrap" }}>{queue.length + " paria"}</span> : null)}
          {queue.length === 0 ? <div style={{ color: "#5c7566", fontSize: qRowH * 0.5, fontStyle: "italic" }}>Jono on tyhjä.</div> : (
            <div style={{ display: "flex", flexDirection: "column", gap: 4, overflow: "hidden" }}>
              {qShown.map((x) => {
                const t = queue.length > 1 ? x.i / (queue.length - 1) : 0;
                const busy = [x.a, x.b].map((p) => (p && onBoard[p.id] ? onBoard[p.id] : null));
                return (
                  <div key={x.key} data-testid="sw-tvall-qrow" style={{ height: qRowH, flex: "none", display: "flex", alignItems: "center", gap: qRowH * 0.25, borderRadius: 8, padding: `0 ${qRowH * 0.3}px`, borderLeft: `6px solid ${lerp("#3fae57", "#c9524f", t)}`, background: lerp("#123423", "#2c1717", t) }}>
                    <span style={{ fontFamily: TB_FONT, fontSize: qRowH * 0.55, color: "#7a9484", width: qRowH * 0.9, textAlign: "right", flex: "none" }}>{x.i + 1}.</span>
                    <span style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: qRowH * 0.2, fontSize: qRowH * 0.44, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden" }}>
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis" }} translate="no" data-notr>{x.a ? x.a.name : "?"}</span>{busy[0] ? badge(busy[0], qRowH * 0.34) : null}
                      <span style={{ color: "#8aa392", fontWeight: 400, fontSize: qRowH * 0.34, flex: "none" }}>VS</span>
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis" }} translate="no" data-notr>{x.b ? x.b.name : "?"}</span>{busy[1] ? badge(busy[1], qRowH * 0.34) : null}
                    </span>
                  </div>
                );
              })}
              {queue.length > qShown.length && <div style={{ color: "#7a9484", fontSize: qRowH * 0.4, paddingLeft: qRowH * 1.3 }}>{"+ " + (queue.length - qShown.length) + " paria lisää"}</div>}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: Math.max(10, qRowH * 0.28), color: "#7a9484" }}>
                <span>Seuraava vuorossa</span><span>Odottaa pisimpään</span>
              </div>
            </div>
          )}
          <div data-testid="sw-tvall-hl" style={{ marginTop: "auto", paddingTop: gap, display: "flex", gap, flex: "none" }}>
            {hlTile("sw-tvall-co", "🏁", "SUURIN KATKO", awCo, "")}
            {hlTile("sw-tvall-best", "⏱", "PARAS LEGI", awBest, "tikkaa")}
          </div>
        </div>
        {/* sarjataulukko */}
        <div data-testid="sw-tvall-table" style={{ minWidth: 0, overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {secTitle("SARJATAULUKKO", "#e7c977", (
            <>
              <span style={{ fontSize: titleH * 0.48, color: "#7a9484", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", minWidth: 0 }}>{"Tasapisteissä: legiero, " + swTieName(tie.mode)}</span>
              <span style={{ flex: 1 }} />
              {pages > 1 && (
                <span data-testid="sw-tvall-page" style={{ fontFamily: TB_FONT, fontSize: titleH * 0.6, letterSpacing: ".08em", color: "#a9c2ae" }}>
                  {Array.from({ length: pages }).map((_, i) => <span key={i} style={{ display: "inline-block", width: titleH * 0.32, height: titleH * 0.32, borderRadius: "50%", margin: `0 ${titleH * 0.08}px`, background: i === pg ? "#e7c977" : "rgba(169,194,174,.3)" }} />)}
                  <span style={{ marginLeft: 8 }}>{(pg + 1) + "/" + pages}</span>
                </span>
              )}
            </>
          ))}
          <table style={{ width: "100%", borderCollapse: "collapse", tableLayout: "auto" }}>
            <thead><tr style={{ height: rowH }}>
              <th style={{ ...th, textAlign: "left", width: rowH * 1.3 }}></th><th style={{ ...th, textAlign: "left", width: "99%" }}>PELAAJA</th>
              <th style={th} title="Voitetut pelit">V</th>{anyDraw && <th style={th} title="Tasapelit">T⁠</th>}
              <th style={th} title="Voitetut legit">LV</th><th style={th} title="Hävityt legit">LH</th><th style={th} title="Legiero">LE</th>
              <th style={{ ...th, color: "#e7c977" }} title="Pisteet">P</th><th style={th} title={swTieTitle(tie.mode)} data-testid="sw-tvall-tiehead">{swTieHead(tie.mode)}</th>
              <th style={th}>PELIT</th>{anyAvg && <th style={th} title="Keskiarvo">KA</th>}
            </tr></thead>
            <tbody>
              {shown.map((p, k) => {
                const i = pg * perPage + k;
                const ld = (p.legsFor || 0) - (p.legsAgainst || 0);
                return (
                  <tr key={p.id} data-testid="sw-tvall-row" style={{ height: rowH, background: k % 2 ? "transparent" : "rgba(255,255,255,.035)", opacity: p.withdrawn ? 0.55 : 1 }}>
                    <td style={{ ...td, textAlign: "left", fontFamily: TB_FONT, fontSize: rowH * 0.58, color: i < 3 ? "#e7c977" : "#8fa396" }}>{i + 1}.</td>
                    <td style={{ ...td, textAlign: "left", color: "#ece6d8", fontWeight: 600, maxWidth: 0, overflow: "hidden", textOverflow: "ellipsis" }}>
                      <span style={{ display: "inline-flex", alignItems: "center", maxWidth: "100%" }}>
                        <span style={{ overflow: "hidden", textOverflow: "ellipsis" }} translate="no" data-notr>{p.name}</span>
                        {onBoard[p.id] ? badge(onBoard[p.id], rowH * 0.36) : null}
                        {p.withdrawn ? <span style={{ fontSize: rowH * 0.32, color: "#e8a0a0", marginLeft: 6 }}>DNF</span> : null}
                      </span>
                    </td>
                    <td style={{ ...td, color: "#e7c977", fontWeight: 700 }}>{swFmtW(p.wins - (draws[p.id] || 0) / 2)}</td>
                    {anyDraw && <td style={td}>{draws[p.id] || 0}</td>}
                    <td style={td}>{p.legsFor || 0}</td>
                    <td style={td}>{p.legsAgainst || 0}</td>
                    <td style={td}>{ld > 0 ? "+" + ld : ld}</td>
                    <td style={{ ...td, color: "#e7c977", fontWeight: 700 }}>{p.wins * 2}</td>
                    <td style={td} data-testid="sw-tvall-tie">{bh[p.id]}</td>
                    <td style={td}>{p.gamesPlayed}/{rt}</td>
                    {anyAvg && <td style={td}>{tcNum(avgById[p.id])}</td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// REM: Pelaajarekisterin lajittelu - ohjelman tekijä: Johannes Ketola
function rosterSort(a, b) {
  const firstA = a.name.trim().split(/\s+/)[0];
  const firstB = b.name.trim().split(/\s+/)[0];
  return firstA.localeCompare(firstB, "fi-FI", { sensitivity: "base" }) ||

}
